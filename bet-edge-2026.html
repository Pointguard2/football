*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--chalk);font-family:var(--body);font-size:15px;line-height:1.3}
body{padding-bottom:calc(74px + env(safe-area-inset-bottom))}button{font-family:inherit;color:inherit;cursor:pointer;-webkit-appearance:none}

h2::before{content:"";width:4px;height:16px;background:var(--lime);border-radius:2px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.pill{display:inline-block;font:600 10px var(--body);border:1px solid var(--line);border-radius:999px;padding:3px 8px;color:var(--muted);margin:2px 3px 0 0;letter-spacing:.02em}

    ${rows.slice(0,80).map(p=>{ const b=p.best; const logged=BETS.find(x=>x.player===p.player&&x.stat===p.stat&&x.side===b.side); return `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><div class="nm" style="flex:1">${esc(p.player)} <span class="sub">${(DATA.model.players[ENGINE.find(DATA,p.player)]||{}).team||''} ${p.opp?'v '+p.opp:''}</span></div><div class="ev ${b.ev>0.02?'pos':'neg'}">${b.ev>0?'+':''}${Math.round(b.ev*100)}% EV</div></div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:4px"><div><b>${b.side==='over'?'Over':'Under'} ${p.stat==='any_td'?'':p.line}</b> ${STATN[p.stat]} <span class="sub">${odds(b.odds)} ${b.book}</span></div><div class="sub">model ${pct(b.p)} · market ${pct(b.side==='over'?p.mkt:1-p.mkt)}</div></div>
      <div class="bar"><i style="width:${Math.round(b.p*100)}%"></i></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><div class="sub">proj ${p.mean}${p.stat==='any_td'?' TD/g':''} · ${p.cur} games this season (${p.n} used) · trust ${Math.round(p.w*100)}%${p.implied?' · team implied '+p.implied.toFixed(1):p.moved?' · team changed, no matchup adj':''}${b.units>0?' · stake '+b.units+'u':''}</div><button class="btn ${logged?'on':''}" data-log='${esc(JSON.stringify({player:p.player,stat:p.stat,side:b.side,line:p.line,odds:b.odds,book:b.book,p:+b.p.toFixed(3),mkt:+(b.side==='over'?p.mkt:1-p.mkt).toFixed(3),ev:+b.ev.toFixed(3),game:p.game}))}'>${logged?'Logged':'+ Slate'}</button></div></div>` }).join('')}
    <div class="note">EV combines the model's probability (shrunk toward the market until a player has ${ENGINE.SHRINK}+ games this season) with the best available price. Suggested stake = quarter-Kelly, capped at ${DATA.bank.maxUnits} units.</div>`;
  el.querySelectorAll('[data-stat]').forEach(b=>b.onclick=()=>{PF.stat=b.dataset.stat;renderProps()}); el.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>{PF.min=+b.dataset.min;renderProps()}); el.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{PF.sort=b.dataset.sort;renderProps()});
  el.querySelectorAll('[data-log]').forEach(b=>b.onclick=()=>{ const x=JSON.parse(b.dataset.log); const i=BETS.findIndex(y=>y.player===x.player&&y.stat===x.stat&&y.side===x.side); if(i>-1){ if(BETS[i].local){BETS.splice(i,1)} } else BETS.push(Object.assign(x,{id:Date.now(),week:+WK,units:1,local:true,placedAt:new Date().toISOString()})); saveLocal(); renderProps(); renderSlate() }) }
function renderSlate(){ const el=$('v-slate'); const unit=DATA.bank.unit; const rows=BETS.map((b,i)=>{ const res=b.result; const ret=res==='win'?b.units*ENGINE.payout(b.odds):res==='loss'?-b.units:0;
    return `<div class="card"><div style="display:flex;justify-content:space-between"><div class="nm">${esc(b.player||b.game)} · <b>${b.side==='over'?'Over':b.side==='under'?'Under':esc(b.side)} ${b.stat==='any_td'?'':b.line??''}</b> ${STATN[b.stat]||b.stat||''}</div><div class="ev ${res==='win'?'pos':res==='loss'?'neg':''}">${res?(res==='push'?'PUSH':(ret>0?'+':'')+ret.toFixed(2)+'u'):'open'}</div></div>
      <div class="sub" style="margin-top:3px">${odds(b.odds)} ${b.book||''} · model ${pct(b.p)} vs market ${pct(b.mkt)} · EV ${b.ev>0?'+':''}${Math.round((b.ev||0)*100)}%${b.actual!=null?' · actual '+b.actual:''}${b.close!=null?' · closed '+b.close:''}</div>
      <div style="display:flex;gap:8px;align-items:center;margin-top:6px"><span class="sub">units</span><input class="num" type="number" step="0.5" min="0.5" value="${b.units}" data-u="${i}"> <span class="sub">= $${(b.units*unit).toFixed(0)}</span>${b.local?`<button class="btn" data-del="${i}" style="margin-left:auto">remove</button>`:''}</div></div>` }).join('');
  const settled=BETS.filter(b=>b.result); const net=settled.reduce((a,b)=>a+(b.result==='win'?b.units*ENGINE.payout(b.odds):b.result==='loss'?-b.units:0),0); const staked=settled.reduce((a,b)=>a+(b.result==='push'?0:b.units),0);
  el.innerHTML=`<h2>Slate · week ${WK}</h2><div class="card"><div style="display:flex;justify-content:space-between"><div><div style="font:700 22px var(--disp)">${BETS.length} bets · ${BETS.reduce((a,b)=>a+b.units,0).toFixed(1)}u</div><div class="sub">unit $${unit} · max ${DATA.bank.maxUnits}u · ¼ Kelly</div></div><div style="text-align:right"><div style="font:700 22px var(--disp);color:${net>=0?'var(--lime)':'var(--bad)'}">${settled.length?(net>=0?'+':'')+net.toFixed(2)+'u':'—'}</div><div class="sub">${settled.length?`${settled.filter(b=>b.result==='win').length}-${settled.filter(b=>b.result==='loss').length}${settled.filter(b=>b.result==='push').length?'-'+settled.filter(b=>b.result==='push').length:''} · ROI ${staked?Math.round(100*net/staked):0}%`:'nothing settled yet'}</div></div></div></div>
    ${rows||'<div class="card"><div class="note">Nothing logged. Tap + Slate on a prop, or paste bets below.</div></div>'}
    <h2>Export / import</h2><div class="card"><div class="note">Bets you log on the phone live in this browser. Copy the JSON out before running settle.js, paste it into <span class="k">bets-${WK}.json</span> and run <span class="k">node ingest.js bets ${WK} bets-${WK}.json</span> so they're graded and kept in the file.</div>
    <textarea class="paste" rows="4" id="betjson">${esc(JSON.stringify(BETS.filter(b=>b.local)))}</textarea><div class="seg" style="margin-top:6px"><button class="btn" id="betimp">Import pasted JSON</button><button class="btn" id="betclr">Clear local</button></div></div>`;
  el.querySelectorAll('[data-u]').forEach(inp=>inp.onchange=()=>{ BETS[+inp.dataset.u].units=+inp.value||1; saveLocal(); renderSlate() }); el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ BETS.splice(+b.dataset.del,1); saveLocal(); renderSlate(); renderProps() });
  $('betimp').onclick=()=>{ try{ JSON.parse($('betjson').value).forEach(b=>{ if(!BETS.find(x=>x.id===b.id)) BETS.push(Object.assign(b,{local:true})) }); saveLocal(); renderSlate() }catch(e){ alert('not valid JSON') } }; $('betclr').onclick=()=>{ for(let i=BETS.length-1;i>=0;i--) if(BETS[i].local) BETS.splice(i,1); saveLocal(); renderSlate(); renderProps() } }
function renderBrain(){ const el=$('v-brain'); const R=Object.values(DATA.results||{}).flat(); const allBets=Object.values(DATA.bets||{}).flat().filter(b=>b.result);
  if(!R.length){ el.innerHTML=`<h2>Brain</h2><div class="card"><div class="verdict">No graded weeks yet</div><div class="note">After each week, <span class="k">node settle.js ${WK}</span> grades every prop in the closing snapshot against the box score — not just the ones bet — so the model is judged on all of its opinions. This tab then shows calibration (when the model says 60%, does it hit 60%?), edge buckets (do bigger claimed edges win more?), and closing-line value.</div>
    <div class="card" style="margin-top:8px"><div class="k">MODEL BUILD</div><div class="sub" style="margin-top:4px">${DATA.model.built?`week ${DATA.model.built.week} ${DATA.model.built.season} · ${Object.keys(DATA.model.players||{}).length} players · ${DATA.model.built.rows} player-games · decay ${DATA.model.built.decay}/game, prior season ×${DATA.model.built.priorW}`:'not built'}</div></div></div>`; return }
  const buckets=[[.5,.55],[.55,.6],[.6,.65],[.65,.7],[.7,1.01]].map(([lo,hi])=>{ const rs=R.filter(r=>r.p>=lo&&r.p<hi&&r.result!=='push'); return {lo,hi,n:rs.length,hit:rs.length?rs.filter(r=>r.result==='win').length/rs.length:null,exp:rs.length?rs.reduce((a,r)=>a+r.p,0)/rs.length:null} });
  const byStat={}; R.forEach(r=>{ if(r.result==='push') return; const o=byStat[r.stat]=byStat[r.stat]||{n:0,w:0,p:0}; o.n++; o.w+=r.result==='win'?1:0; o.p+=r.p });
  const edge=[[0,.03],[.03,.06],[.06,.1],[.1,1]].map(([lo,hi])=>{ const rs=R.filter(r=>r.ev>=lo&&r.ev<hi&&r.result!=='push'); const roi=rs.length?rs.reduce((a,r)=>a+(r.result==='win'?ENGINE.payout(r.odds):-1),0)/rs.length:null; return {lo,hi,n:rs.length,roi} });
  const clv=allBets.filter(b=>b.close!=null&&b.line!=null); const clvAvg=clv.length?clv.reduce((a,b)=>a+((b.side==='over'?1:-1)*(b.close-b.line)),0)/clv.length:null;
  const total=R.filter(r=>r.result!=='push'); const hit=total.filter(r=>r.result==='win').length/total.length; const expHit=total.reduce((a,r)=>a+r.p,0)/total.length; const flatRoi=total.reduce((a,r)=>a+(r.result==='win'?ENGINE.payout(r.odds):-1),0)/total.length;
  el.innerHTML=`<h2>Brain · ${Object.keys(DATA.results).length} graded week${Object.keys(DATA.results).length>1?'s':''}</h2>
    <div class="card"><div style="display:flex;justify-content:space-between"><div><div style="font:700 26px var(--disp);color:${Math.abs(hit-expHit)<.04?'var(--lime)':'var(--warn)'}">${pct(hit)}</div><div class="sub">model's picks hit · it expected ${pct(expHit)}</div></div><div style="text-align:right"><div style="font:700 26px var(--disp);color:${flatRoi>0?'var(--lime)':'var(--bad)'}">${flatRoi>0?'+':''}${Math.round(flatRoi*100)}%</div><div class="sub">flat-stake ROI on every model-favoured side (${total.length})</div></div></div>
    <div class="verdict" style="font-size:16px;margin-top:8px">${Math.abs(hit-expHit)<.04?'calibrated':hit<expHit?'overconfident — claims more than it delivers':'underconfident — better than it thinks'}</div></div>
    <h2>Calibration</h2><div class="card"><div class="grid"><div class="k">MODEL SAID</div><div class="k">HIT</div><div class="k">N</div>${buckets.map(b=>`<div>${Math.round(b.lo*100)}–${Math.round(Math.min(b.hi,1)*100)}%</div><div style="color:${b.hit==null?'var(--muted)':Math.abs(b.hit-b.exp)<.06?'var(--lime)':'var(--warn)'}">${b.hit==null?'—':pct(b.hit)}</div><div class="sub">${b.n}</div>`).join('')}</div><div class="note">Each row should hit about what it says. Rows that consistently miss low mean the sd floors are too tight for that confidence band.</div></div>
    <h2>Edge buckets</h2><div class="card"><div class="grid"><div class="k">CLAIMED EV</div><div class="k">ROI</div><div class="k">N</div>${edge.map(b=>`<div>${Math.round(b.lo*100)}–${Math.round(Math.min(b.hi,1)*100)}%</div><div style="color:${b.roi==null?'var(--muted)':b.roi>0?'var(--lime)':'var(--bad)'}">${b.roi==null?'—':(b.roi>0?'+':'')+Math.round(b.roi*100)+'%'}</div><div class="sub">${b.n}</div>`).join('')}</div><div class="note">If bigger claimed edges don't earn more, the edge is noise and the min-EV filter should go up.</div></div>
    <h2>By market</h2><div class="card"><div class="grid"><div class="k">STAT</div><div class="k">HIT / EXP</div><div class="k">N</div>${Object.entries(byStat).sort((a,b)=>b[1].n-a[1].n).map(([k,o])=>`<div>${STATN[k]||k}</div><div>${pct(o.w/o.n)} / ${pct(o.p/o.n)}</div><div class="sub">${o.n}</div>`).join('')}</div></div>
    <h2>Closing line value</h2><div class="card"><div style="font:700 22px var(--disp);color:${clvAvg==null?'var(--muted)':clvAvg>0?'var(--lime)':'var(--bad)'}">${clvAvg==null?'—':(clvAvg>0?'+':'')+clvAvg.toFixed(2)}</div><div class="sub">avg line movement in our favour on ${clv.length} logged bets (positive = we beat the close)</div><div class="note">Beating the closing line is the earliest honest signal of an edge — it shows up long before win/loss does.</div></div>` }
function renderData(){ const el=$('v-data'); el.innerHTML=`<h2>Data</h2>
    <div class="card"><div class="k">STATE</div><div class="sub" style="margin-top:4px">week ${WK} · model ${DATA.model.built?`built wk${DATA.model.built.week} (${Object.keys(DATA.model.players||{}).length} players)`:'none'} · market ${MK.snapshots.length} snapshot${MK.snapshots.length===1?'':'s'}${SNAP?` (${Object.keys(SNAP.games).length} games, ${SNAP.props.length} props)`:''} · bets in file ${(DATA.bets[WK]||[]).length}</div></div>
    <div class="card"><div class="k">WEEKLY LOOP</div><div class="note">Tuesday: <span class="k">node build-model.js ${+WK+1}</span> → Wednesday–Sunday: <span class="k">node lines.js ${WK}</span> (each run adds a snapshot; the last one before kickoff is the close) → log bets on Slate, export JSON → Monday: <span class="k">node ingest.js bets ${WK} bets-${WK}.json</span>, <span class="k">node settle.js ${WK}</span> → <span class="k">node sync.js</span>. See RUNBOOK.md.</div></div>
    <div class="card"><div class="k">MODEL CONSTANTS</div><div class="sub" style="margin-top:4px">home field ${ENGINE.HFA} · margin sd ${ENGINE.SD_SPREAD} · total sd ${ENGINE.SD_TOTAL} · player trust reaches 50% after ${ENGINE.SHRINK} current-season games · unit $${DATA.bank.unit} · ¼ Kelly · max ${DATA.bank.maxUnits}u</div><div class="note">These are the only hand-set numbers. Everything else is fit from nflverse history by build-model.js and re-fit every week.</div></div>
    <div class="card"><div class="k">MARKET LEAN</div><div class="sub" style="margin-top:4px">${Object.keys(DATA.model.marketLean||{}).length?Object.entries(DATA.model.marketLean).map(([k,v])=>`${STATN[k]||k} ${v>1?'+':''}${Math.round((v-1)*100)}%`).join(' · '):'none yet — set by settle.js from the last 3 graded weeks'}</div><div class="note">Hot markets get slightly more trust, cold ones slightly less, never more than ±${Math.round(ENGINE.LEAN*100)}%, and it is recomputed from scratch each week so a hot streak fades as soon as it ends.</div></div>
    <div class="card"><div class="k">SOURCES</div>${Object.entries(DATA.sources||{}).map(([k,v])=>`<div class="sub" style="margin-top:4px"><b>${k}</b> — ${esc(v)}</div>`).join('')}</div>` }
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{ document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t)); ['lines','props','slate','brain','data'].forEach(v=>$('v-'+v).classList.toggle('hide',v!==t.dataset.v)) });
renderLines(); renderProps(); renderSlate(); renderBrain(); renderData();
</script>
</body></html>
