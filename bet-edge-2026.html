<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex, nofollow">
<title>Bet Edge 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---- tokens ------------------------------------------------------------
   accent = brand / navigation only.  status = won|lost|push|open, reserved:
   never reused for anything else, and never shown without a word beside it.
   All six pass WCAG AA on --panel; won/lost separate under deuteranopia. */
:root{
--bg:#0A0D11;--panel:#12171D;--panel2:#181F27;--line:#232C36;--chalk:#F2F5F7;--muted:#8A97A3;
--accent:#B4FF3C;--amber:#B4FF3C;--lime:#B4FF3C;--good:#B4FF3C;--bad:#FF4F5E;--warn:#FFB020;
--won:#3DDC84;--lost:#FF4F5E;--push:#FFB020;--open:#8A97A3;
--qb:#FF5A6E;--rb:#3DDC84;--wr:#4DA3FF;--te:#FFA53D;--lb:#3DDC84;--dl:#FF7A59;--db:#5BC8E8;--k:#B08CFF;--dst:#8E9BA8;
--disp:'Oswald','Arial Narrow',system-ui,sans-serif;--body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;--mono:ui-monospace,Menlo,monospace;
--r:14px;--pad:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--chalk);font-family:var(--body);font-size:15px;line-height:1.35}
body{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-appearance:none}
header{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,#0A0D11 70%,rgba(10,13,17,.92));border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;justify-content:space-between;align-items:center}
h1{font-family:var(--disp);font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:22px;margin:0;line-height:1}h1 i{color:var(--accent);font-style:normal}
h1 small{display:block;font:600 10px/1 var(--body);letter-spacing:.18em;color:var(--muted);margin-top:4px}
.ver{font:11px var(--mono);color:var(--muted);text-align:right}
main{padding:0 16px}
h2{font-family:var(--disp);font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--chalk);margin:26px 0 10px;font-weight:600;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:4px;height:16px;background:var(--accent);border-radius:2px}
h2:first-child{margin-top:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);margin-bottom:10px}
.card.top{border-color:rgba(180,255,60,.45);background:var(--panel2);box-shadow:0 0 0 1px rgba(180,255,60,.12) inset}
.row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}
.chip{font-family:var(--disp);font-size:11px;font-weight:700;letter-spacing:.06em;padding:4px 7px;border-radius:6px;color:#0A0D11;flex:0 0 auto;min-width:34px;text-align:center}
.nm{flex:1;min-width:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font:12px var(--body);color:var(--muted);margin-top:3px;font-weight:400;line-height:1.4;white-space:normal}
.num{font:600 14px var(--mono);flex:0 0 auto;text-align:right;min-width:46px}
.pos{color:var(--won)}.neg{color:var(--lost)}
.grade{font-family:var(--disp);font-size:30px;font-weight:700;width:48px;text-align:center;flex:0 0 auto;color:var(--accent)}
/* ---- hero number: one big answer per card, label underneath ---- */
.stat{font:700 30px/1 var(--disp);letter-spacing:.01em}
.statlab{font:12px var(--body);color:var(--muted);margin-top:5px}
.statrow{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.statrow>div:last-child{text-align:right}
/* ---- result pill: colour is never the only signal — always a word ---- */
.res{display:inline-flex;align-items:center;gap:5px;font:700 11px var(--disp);letter-spacing:.07em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid;white-space:nowrap}
.res.won{color:var(--won);border-color:rgba(61,220,132,.45);background:rgba(61,220,132,.1)}
.res.lost{color:var(--lost);border-color:rgba(255,79,94,.45);background:rgba(255,79,94,.1)}
.res.push{color:var(--push);border-color:rgba(255,176,32,.45);background:rgba(255,176,32,.1)}
.res.open{color:var(--open);border-color:var(--line);background:var(--panel2)}
.tag{display:inline-block;font:700 10px var(--disp);letter-spacing:.09em;text-transform:uppercase;padding:3px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted);background:var(--panel2);white-space:nowrap}
.tag.real{color:var(--accent);border-color:rgba(180,255,60,.45)}
/* ---- bet line ---- */
.bet{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.bet:last-child{border-bottom:0}
.bet .who{flex:1;min-width:0}
.bet .pick{font-size:15px;font-weight:600;line-height:1.35}
.bet .rt{flex:0 0 auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.bet .amt{font:700 15px var(--mono)}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;overflow-x:auto;scrollbar-width:none;background:rgba(10,13,17,.98);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:3px}.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 1 0;min-width:52px;min-height:44px;padding:8px 6px;background:none;border:0;border-radius:10px;font-family:var(--disp);font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.tab.on{color:#0A0D11;background:var(--accent);font-weight:700}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:10px 14px;font-family:var(--disp);font-size:12px;letter-spacing:.06em;color:var(--chalk);min-height:44px;text-transform:uppercase}
.btn.on{border-color:var(--accent);color:#0A0D11;background:var(--accent);font-weight:700}
.btn.g{border-color:rgba(180,255,60,.5);color:var(--accent);background:var(--panel2)}
.btn.r{border-color:rgba(255,79,94,.5);color:var(--bad);background:var(--panel2)}
input[type=search],input[type=text],select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--chalk);padding:12px;font-size:16px;font-family:var(--body);min-height:44px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pill{display:inline-block;font:600 10px var(--body);border:1px solid var(--line);border-radius:999px;padding:3px 8px;color:var(--muted);margin:2px 3px 0 0;letter-spacing:.02em}
.note{font-size:12.5px;color:var(--muted);line-height:1.5;margin:10px 0 0}
.flag{font-size:12px}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--accent)}
.verdict{font-family:var(--disp);font-size:19px;letter-spacing:.03em;margin:6px 0 0;text-transform:uppercase;color:var(--accent);line-height:1.2}
.sel{border-color:var(--accent)!important;background:rgba(180,255,60,.08)}
.hide{display:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.rk{font:600 12px var(--mono);color:var(--muted);width:26px;text-align:right;flex:0 0 auto}
.mrow{display:grid;grid-template-columns:1fr 44px 1fr;align-items:center;border-top:1px solid var(--line)}.mrow:first-of-type{border-top:0}
.mc{padding:7px 4px;min-height:44px}.mc.r{text-align:right}.mv{font:700 17px var(--disp);line-height:1.1}.mn{font-size:13px;line-height:1.25;margin-top:3px}
.mslot{font:700 10px var(--mono);text-align:center;padding:4px 0;border-radius:6px;color:#0A0D11;margin:0 4px}
/* ---- tables: one type scale, generous rows ---- */
.grid{display:grid;grid-template-columns:1fr auto auto;gap:7px 12px;align-items:center}
.grid>div{min-height:22px;display:flex;align-items:center}
.k{font:600 10px var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.ev{font:700 15px var(--disp);min-width:52px;text-align:right}.ev.pos{color:var(--won)}.ev.neg{color:var(--muted)}
.paste{width:100%;background:var(--panel2);color:var(--chalk);border:1px solid var(--line);border-radius:8px;font:12px var(--mono);padding:10px}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
input.num{width:64px;background:var(--panel2);color:var(--chalk);border:1px solid var(--line);border-radius:6px;padding:8px;font:13px var(--mono);min-height:38px}
</style></head><body>
<header><div><div style="font:700 22px var(--disp);letter-spacing:.04em">BET <span style="color:var(--lime)">EDGE</span></div><div class="sub" style="letter-spacing:.12em">FOOTBALL · PRICE THE NUMBER, NOT THE NAME</div></div><div class="sub" style="text-align:right;font-family:var(--mono)" id="hdr"></div></header>

    <div class="card" style="margin-top:10px"><div class="k">Model build</div><div class="sub">${DATA.model.built?`week ${DATA.model.built.week} ${DATA.model.built.season} · ${Object.keys(DATA.model.players||{}).length} players · ${DATA.model.built.rows} player-games · recent games count more (${DATA.model.built.decay}/game), last season counts ×${DATA.model.built.priorW}`:'not built'}</div></div></div>`; return }

  const pill=b=>b.result==='win'?'<span class="res won">✓ Won</span>':b.result==='loss'?'<span class="res lost">✕ Lost</span>':b.result==='push'?'<span class="res push">= Push</span>':'<span class="res open">• Not settled</span>';

      <div class="k">Method</div><div class="k">Record</div><div class="k">Pot now</div>
      ${LANES.map(([k,nm])=>{ const B=book(k), o=roll(all.filter(b=>lane(b)===k));
        return `<div>${nm}</div><div class="sub" style="margin:0">${o.settled?o.w+'–'+o.l:'—'}</div><div style="color:${col(B.pl)};font:700 14px var(--mono);justify-content:flex-end">${money(B.end)}</div>` }).join('')}
    </div><div class="note">Each pile gets its own ${money(BR0)} and is bet the same way, so the gap between them is down to which picks were taken — nothing else.</div></div>`;
  }

  h+=`<h2>Week by week</h2><div class="card"><div class="grid" style="grid-template-columns:auto 1fr auto auto">
    <div class="k">Wk</div><div class="k">Record</div><div class="k">Risked</div><div class="k">Pot after</div>
    ${M.rows.map(r=>`<div class="sub" style="margin:0">${r.w}</div><div>${r.won} won · ${r.lost} lost <span style="color:${col(r.net)}">${(r.net>=0?'+':'−')+money(Math.abs(r.net)).replace('$','$')}</span></div><div class="sub" style="margin:0">${money(r.risked)}</div><div style="color:${col(r.net)};font:700 14px var(--mono);justify-content:flex-end">${money(r.end)}</div>`).join('')
    ||'<div class="sub" style="grid-column:1/-1;margin:0">Nothing graded yet.</div>'}
  </div><div class="note">This is the week-by-week reconciliation: what the pot was, what went on the line, what came back.</div></div>`;

  const stats={}; all.forEach(b=>{ if(!b.result) return; (stats[b.stat]=stats[b.stat]||[]).push(b) });
  h+=`<h2>Which bet types paid</h2><div class="card"><div class="grid" style="grid-template-columns:1fr auto auto">
    <div class="k">Bet type</div><div class="k">Record</div><div class="k">Made</div>
    ${Object.entries(stats).map(([st,rows])=>[st,roll(rows)]).sort((a,b)=>b[1].net-a[1].net).map(([st,o])=>`<div>${STATN[st]||st}</div><div class="sub" style="margin:0">${o.w}–${o.l}</div><div style="color:${col(o.net)};font:700 14px var(--mono);justify-content:flex-end">${(o.net>=0?'+':'−')+money(Math.abs(o.net*U))}</div>`).join('')}
  </div><div class="note">Only bets that were taken. The Brain tab scores every pick the model had an opinion on, taken or not.</div></div>`;

  h+=`<h2>Every bet</h2>`;
  weeksDesc.forEach(w=>{ const rows=(DATA.bets[String(w)]||[]).slice().sort((a,b)=>(b.result?1:0)-(a.result?1:0)||retU(b)-retU(a)); const o=roll(rows);
    h+=`<div class="card"><div class="statrow" style="align-items:center"><div><div class="nm">Week ${w}</div><div class="sub">${o.n} bets · ${o.settled?`${o.w} won · ${o.l} lost${o.p?' · '+o.p+' push':''}`:'none finished'}</div></div>
      <div><div style="font:700 20px var(--disp);color:${col(o.net)}">${o.settled?(o.net>=0?'+':'−')+money(Math.abs(o.net*U)):'open'}</div><div class="statlab" style="margin-top:2px">${o.settled?money(o.stake*U)+' risked':''}</div></div></div>
      <div style="margin-top:10px">
      ${rows.map(b=>{ const L=lane(b);
        return `<div class="bet"><div class="who">
          <div class="pick">${esc(b.player||b.game)} — ${b.side==='over'?'over':b.side==='under'?'under':esc(b.side)} ${b.stat==='any_td'?'':(b.line??'')} ${(STATN[b.stat]||b.stat||'').toLowerCase()}</div>
          <div class="sub">${odds(b.odds)}${b.book?' at '+esc(b.book):''}${b.actual!=null?` · he got ${b.actual}`:''}<br>
            <span class="tag${L==='real'?' real':''}">${L==='real'?'You bet this':L==='challenger'?'New method':'Usual method'}</span></div>
        </div>
        <div class="rt">${pill(b)}<div class="amt" style="color:${b.result?col(retU(b)):'var(--muted)'}">${b.result?(b.result==='push'?money(0):(retU(b)>=0?'+':'−')+money(Math.abs(retU(b)*U))):money(b.units*U)}</div></div></div>` }).join('')}
      </div></div>`;
  });
  el.innerHTML=h;
}
function renderData(){ const el=$('v-data'); el.innerHTML=`<h2>Data</h2>
    <div class="card"><div class="k">STATE</div><div class="sub" style="margin-top:4px">week ${WK} · model ${DATA.model.built?`built wk${DATA.model.built.week} (${Object.keys(DATA.model.players||{}).length} players)`:'none'} · market ${MK.snapshots.length} snapshot${MK.snapshots.length===1?'':'s'}${SNAP?` (${Object.keys(SNAP.games).length} games, ${SNAP.props.length} props)`:''} · bets in file ${(DATA.bets[WK]||[]).length}</div></div>
    <div class="card"><div class="k">WEEKLY LOOP</div><div class="note">Tuesday: <span class="k">node build-model.js ${+WK+1}</span> → Wednesday–Sunday: <span class="k">node lines.js ${WK}</span> (each run adds a snapshot; the last one before kickoff is the close) → log bets on Slate, export JSON → Monday: <span class="k">node ingest.js bets ${WK} bets-${WK}.json</span>, <span class="k">node settle.js ${WK}</span> → <span class="k">node sync.js</span>. See RUNBOOK.md.</div></div>
    <div class="card"><div class="k">MODEL CONSTANTS</div><div class="sub" style="margin-top:4px">home field ${ENGINE.HFA} · margin sd ${ENGINE.SD_SPREAD} · total sd ${ENGINE.SD_TOTAL} · player trust reaches 50% after ${ENGINE.SHRINK} current-season games · unit $${DATA.bank.unit} · ¼ Kelly · max ${DATA.bank.maxUnits}u</div><div class="note">These are the only hand-set numbers. Everything else is fit from nflverse history by build-model.js and re-fit every week.</div></div>
    <div class="card"><div class="k">MARKET LEAN</div><div class="sub" style="margin-top:4px">${Object.keys(DATA.model.marketLean||{}).length?Object.entries(DATA.model.marketLean).map(([k,v])=>`${STATN[k]||k} ${v>1?'+':''}${Math.round((v-1)*100)}%`).join(' · '):'none yet — set by settle.js from the last 3 graded weeks'}</div><div class="note">Hot markets get slightly more trust, cold ones slightly less, never more than ±${Math.round(ENGINE.LEAN*100)}%, and it is recomputed from scratch each week so a hot streak fades as soon as it ends.</div></div>
    <div class="card"><div class="k">SOURCES</div>${Object.entries(DATA.sources||{}).map(([k,v])=>`<div class="sub" style="margin-top:4px"><b>${k}</b> — ${esc(v)}</div>`).join('')}</div>` }
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{ document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t)); ['lines','props','slate','brain','ledger','data'].forEach(v=>$('v-'+v).classList.toggle('hide',v!==t.dataset.v)) });
renderLines(); renderProps(); renderSlate(); renderBrain(); renderLedger(); renderData();
</script>
</body></html>
