function parseStat(t){ t=t.toLowerCase(); if(/pass/.test(t)&&/td/.test(t))return 'pass_td'; if(/pass/.test(t))return 'pass_yds'; if(/rush.*rec|rec.*rush|rush\+rec|scrimmage/.test(t))return 'rush_rec_yds'; if(/rush/.test(t)&&/td/.test(t))return 'rush_td'; if(/rec/.test(t)&&/td/.test(t))return 'rec_td'; if(/rush/.test(t))return 'rush_yds'; if(/rec/.test(t)&&/yd|yard/.test(t))return 'rec_yds'; if(/rec|catch/.test(t))return 'rec'; if(/td|touchdown/.test(t))return 'td'; return null }
let LINES=(((DFS.picks||{})[String(W.week)]||{}).lines||[]).slice(); try{ const loc=JSON.parse(localStorage.getItem('dfs:lines:'+W.week)||'[]'); const have=new Set(LINES.map(l=>l.player+'|'+l.stat+'|'+(l.src||''))); loc.forEach(l=>{ if(!have.has(l.player+'|'+l.stat+'|'+(l.src||''))) LINES.push(l) }) }catch(e){}   /* file lines (picks.js) + anything pasted on this phone */
function parseLines(text){ const out=[]; text.split(/\r?\n/).forEach(l=>{ const m=l.match(/^(.+?)[,\t]\s*(.+?)[,\t]\s*([0-9]+(?:\.[0-9]+)?)\s*(?:[,\t]\s*(\S+))?\s*$/); if(!m)return; const stat=parseStat(m[2]); if(!stat)return; out.push({player:m[1].trim(),stat,statText:m[2].trim(),line:parseFloat(m[3]),src:m[4]||''}) }); return out }
function renderPick(){ const el=document.getElementById('v-pick');
  const rows=LINES.map(L=>{ const k=norm(L.player); const p=P.find(x=>norm(x.n)===k); if(!p)return {L,miss:true}; const sp=statProj(p,L.stat); if(!sp)return {L,p,miss:true};
    const sd=Math.max(1,sp.v*(SDS[L.stat]||.4)); const z=(sp.v-L.line)/sd; const pOver=Phi(z); const edge=(sp.v-L.line)/Math.max(1,L.line);
    return {L,p,ours:sp.v,real:sp.real,pOver,edge,lean:pOver>=.5?'OVER':'UNDER',conf:Math.abs(pOver-.5)*2} }).sort((a,b)=>(b.conf||0)-(a.conf||0));
  let h=`<h2>Pick'em <span class="pill">Week ${W.week} · ${LINES.length} lines</span></h2><div class="card"><div class="note" style="margin:0 0 6px">Underdog and PrizePicks lines load automatically every run (picks.js). Paste extra lines from PrizePicks, Underdog, Chalkboard, Betr — one per line: <b>Player, stat, line, site</b> (site optional). Example: <i>Jadarian Price, rush yds, 51.5, prizepicks</i>. The app ranks every line by how confidently our projection disagrees with it.</div>
  <textarea id="pk-in" rows="4" placeholder="Drake Maye, rush yds, 24.5, underdog" class="paste"></textarea><div style="display:flex;gap:6px;margin-top:6px"><button class="btn on" data-act="pk-load">Add lines</button><button class="btn" data-act="pk-clear">Clear</button></div></div>`;
  /* correlation between pasted legs: same-team pass+rec move together; rush+pass on the same team pull apart; opposite teams in a shootout move together */
  const legs=rows.filter(r=>!r.miss); const pairs=[]; for(let i=0;i<legs.length;i++)for(let j=i+1;j<legs.length;j++){ const a=legs[i],b=legs[j]; const sameTeam=a.p.t===b.p.t, sameGame=sameTeam||oppT(a.p)===b.p.t; if(!sameGame)continue;
    const pass=x=>/pass/.test(x.L.stat), rec=x=>/rec/.test(x.L.stat), rush=x=>/rush/.test(x.L.stat)&&!/rec/.test(x.L.stat);
    let rel=null; if(sameTeam&&((pass(a)&&rec(b))||(rec(a)&&pass(b))))rel='+ correlated (QB↔receiver): play them the same direction'; else if(sameTeam&&((rush(a)&&pass(b))||(pass(a)&&rush(b))))rel='− correlated (run vs pass): opposite directions, or skip one'; else if(!sameTeam&&(pass(a)||rec(a))&&(pass(b)||rec(b)))rel='+ correlated (shootout): both overs or both unders'; else if(sameTeam&&rec(a)&&rec(b))rel='mild − (targets are shared)';
    if(rel){ const agree=(a.lean===b.lean); pairs.push({a,b,rel,warn:(rel.startsWith('+')&&!agree)||(rel.startsWith('−')&&agree)}) } }
  if(pairs.length) h+=`<h2>Leg correlation</h2><div class="card" style="padding:2px 8px">${pairs.map(x=>`<div class="row"><span class="nm">${esc(x.a.p.n)} ${esc(x.a.L.statText)} <b>${x.a.lean}</b> + ${esc(x.b.p.n)} ${esc(x.b.L.statText)} <b>${x.b.lean}</b><div class="sub" style="color:${x.warn?'var(--bad)':'var(--lime)'}">${x.rel}${x.warn?' — your leans fight each other':''}</div></span></div>`).join('')}</div>`;
  if(rows.length){ h+=`<h2>Ranked by confidence</h2><div class="card" style="padding:2px 8px">${rows.map(r=>r.miss?`<div class="row"><span class="nm" style="color:var(--muted)">${esc(r.L.player)} — ${esc(r.L.statText)} ${r.L.line}<div class="sub">${r.p?'no projection for this stat':'player not found'}</div></span></div>`:
    `<div class="row"><span class="chip" style="background:${PC[r.p.p]}">${r.p.p}</span><span class="nm">${esc(r.p.n)} <span style="color:var(--muted)">${esc(r.L.statText)}</span> ${r.L.line}${r.L.src?' <span class="pill">'+esc(r.L.src)+'</span>':''}<div class="sub">ours ${r.ours.toFixed(1)}${r.real?'':' <span style="color:var(--warn)">(ratio est.)</span>'} · ${(r.edge>=0?'+':'')+(r.edge*100).toFixed(0)}% vs line · P(over) ${(r.pOver*100).toFixed(0)}%${r.p.grade?' · matchup '+r.p.grade:''}${(MAPS_WHY(r.p))}</div></span><span class="num" style="color:${r.conf>=.3?'var(--lime)':r.conf>=.15?'var(--warn)':'var(--muted)'}">${r.lean}</span></div>`).join('')}</div>
    <div class="note">Gold = strong disagreement (our number is 30%+ of a standard deviation from the line). Grey = coin flip — the line is roughly right, don't play it. <b>Ratio est.</b> means the stat was derived from a point projection, not projected directly; treat those as weaker until per-stat projections load. These lines are set by people whose whole job is setting them — expect most to grade grey. That's correct, not broken. Play the gold ones, in correlated pairs, and cap the entry at what you'd lose without noticing.</div>` }
  h+=`<h2>How this learns</h2><div class="card"><div class="note" style="margin:0">Every line you paste is logged with our lean. After the games, the task records the actual stat, and the Brain tab shows hit rate by stat type and by confidence band — the honest question being whether "gold" picks actually hit more than 55%, which is roughly the break-even on a 2-pick entry. If they don't, the tab says so.</div></div>`;
  el.innerHTML=h }
const MAPS_WHY=p=>{ const w=[]; if(p.ctx&&Math.abs(p.ctx-1)>=.02)w.push('ctx '+(p.ctx>1?'+':'')+Math.round((p.ctx-1)*100)+'%'); if(p.wx&&Math.abs(p.wx-1)>=.02)w.push('weather '+(p.wx>1?'+':'')+Math.round((p.wx-1)*100)+'%'); return w.length?' · '+w.join(', '):'' };
const Phi=z=>{ const t=1/(1+.2316419*Math.abs(z)); const d=.3989423*Math.exp(-z*z/2); let pr=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274)))); return z>=0?1-pr:pr };

function parseSal(text){ const lines=text.split(/\r?\n/).filter(l=>l.trim()); if(!lines.length)return{}; const head=lines[0].split(',').map(h=>h.trim().toLowerCase()); const iN=head.findIndex(h=>h==='name'||h==='nickname'||h==='player'); const iS=head.findIndex(h=>h==='salary'); const out={};
  if(iN>-1&&iS>-1){ lines.slice(1).forEach(l=>{ const c=l.split(','); const n=(c[iN]||'').trim().replace(/"/g,''); const s=parseInt((c[iS]||'').replace(/[^0-9]/g,'')); if(n&&s)out[n]=s }) }
  else lines.forEach(l=>{ const m=l.match(/^(.+?)[,\t ]+\$?([0-9][0-9,]{3,})\s*$/); if(m){ out[m[1].trim()]=parseInt(m[2].replace(/,/g,'')) } });
  /* DST naming: "Texans " -> "Texans D/ST" */
  for(const n in out){ const p=P.find(x=>x.p==='DST'&&x.n.split(' ')[0].toLowerCase()===n.trim().toLowerCase()); if(p&&!out[p.n]){out[p.n]=out[n]} } return out }

      <div class="wkbody">${rows.map((c,i)=>`<div class="ent"><div class="who">
        <div class="pick"><span class="site ${c.site}">${c.site.toUpperCase()}</span> ${esc(c.name||(c.type==='cash'?'Cash game':'Tournament'))}</div>
        <div class="sub">${c.entries||1} &times; ${money(c.fee||0)}${c.won!=null?' &middot; paid '+money(c.won):' &middot; still live'}${c.local?' &middot; phone only':''}</div>
        ${c.local?`<div style="margin-top:8px"><button class="btn" data-cdel="${w}:${i}" style="min-height:34px;padding:6px 12px">Remove</button></div>`:''}
      </div><div class="rt"><span class="res ${c.won==null?'open':net(c)>0?'won':'lost'}">${c.won==null?'&bull; Live':net(c)>0?'&#10003; Cashed':'&#10007; Missed'}</span>
        <div class="amt" style="color:${c.won==null?'var(--muted)':col(net(c))}">${c.won==null?money(risk(c)):(net(c)>=0?'+':'−')+money(Math.abs(net(c)))}</div></div></div>`).join('')}</div></details>`;
  });
  h+=form+paperScorecard();
  h+=`<details class="dis" style="border:0;margin-top:14px"><summary>Send these to the PC <span class="caret">&#9662;</span></summary><div class="disbody"><div class="card">
    <div class="note" style="margin-top:0">Contests added on your phone live only in this browser. Copy the text below into <span class="k">inbox\\dfs-${DFS.week}.json</span> on the PC &mdash; the next turnover or refreeze files them permanently.</div>
    <textarea class="paste" rows="4" id="c-json">${esc(JSON.stringify((CONTESTS[String(DFS.week)]||[]).filter(c=>c.local)))}</textarea>
    <div class="seg" style="margin-top:9px"><button class="btn" data-cact="clear">Clear phone-only entries</button></div></div></div></details>`;
  el.innerHTML=h; wirePnl();
}
/* paper lineups: scored in points against the best that was possible — never in money */
function paperScorecard(){ const PW=DFS.paper||{}; const wks=Object.keys(PW).map(Number).sort((a,b)=>b-a); if(!wks.length) return '';
  return `<h2>Paper lineups</h2><div class="note" style="margin:0 0 10px">The builder's own lineups, frozen before kickoff and never entered. Scored in points, not dollars &mdash; without a contest's payout table there is no honest way to price them.</div>`+
  wks.map((w,idx)=>{ const R=PW[w]; const opt=R.optimal||{}; const graded=R.lineups.filter(l=>l.act!=null);
    const pctOf=l=>opt[l.site]&&l.act!=null?100*l.act/opt[l.site].tot:null;
    const avg=graded.length?graded.map(pctOf).filter(x=>x!=null).reduce((a,b)=>a+b,0)/graded.filter(l=>pctOf(l)!=null).length:null;
    return `<details class="wk" ${idx===0?'open':''}><summary><span class="wkname">Week ${w}</span>
      <span class="wkmeta"><div class="sub" style="margin:0">${R.lineups.length} lineups &middot; ${graded.length?'graded':'not graded yet'}</div></span>
      <span class="wkamt">${avg==null?'&mdash;':Math.round(avg)+'%'}</span><span class="caret">&#9662;</span></summary>
      <div class="wkbody"><div class="lane" style="padding-top:12px"><div class="k">Lineup</div><div class="k">Proj &rarr; actual</div><div class="k">Of best</div>
      ${R.lineups.map(l=>{ const p=pctOf(l); return `<div><span class="site ${l.site}">${l.site.toUpperCase()}</span> ${l.mode} #${l.idx+1}</div><div class="sub" style="margin:0">${l.proj} &rarr; ${l.act==null?'&mdash;':l.act}</div><div style="justify-content:flex-end;font:700 14px var(--mono);color:${p==null?'var(--muted)':p>=85?'var(--won)':p>=65?'var(--push)':'var(--lost)'}">${p==null?'&mdash;':Math.round(p)+'%'}</div>` }).join('')}
      </div><div class="note">Percent of the best lineup that was buildable in hindsight from the same slate and salaries. Anything above 85% is a strong week; the gap is what the builder left on the table, not what it lost.</div></div></details>` }).join('');
}
function wirePnl(){ const el=document.getElementById('v-pnl');
  el.querySelectorAll('[data-cdel]').forEach(b=>b.onclick=()=>{ const [w,i]=b.dataset.cdel.split(':'); CONTESTS[w].splice(+i,1); if(!CONTESTS[w].length) delete CONTESTS[w]; saveContests(); renderPnl() });
  el.querySelectorAll('[data-cact]').forEach(b=>b.onclick=()=>{ const a=b.dataset.cact;
    if(a==='clear'){ for(const w in CONTESTS){ CONTESTS[w]=CONTESTS[w].filter(c=>!c.local); if(!CONTESTS[w].length) delete CONTESTS[w] } saveContests(); return renderPnl() }
    if(a==='add'){ const g=id=>document.getElementById(id).value.trim();
      const fee=parseFloat(g('c-fee').replace(/[^0-9.]/g,'')); const entries=parseInt(g('c-entries'))||1; const wonRaw=g('c-won');
      if(!(fee>=0)){ alert('Enter the entry fee'); return }
      const w=String(DFS.week); CONTESTS[w]=CONTESTS[w]||[];
      CONTESTS[w].push({id:Date.now(),week:+w,site:g('c-site'),type:g('c-type'),name:g('c-name'),fee,entries,won:wonRaw===''?null:(parseFloat(wonRaw.replace(/[^0-9.]/g,''))||0),local:true});
      saveContests(); renderPnl() } });
}
let view='board';
const SUBOF={lev:'more',pick:'more',brain:'more',data:'more'};
const RENDER={board:renderBoard,lev:renderLev,stack:renderStack,build:renderBuild,pick:renderPick,data:renderData,brain:renderBrain,pnl:renderPnl,more:renderMore};
const render=()=>{ document.querySelectorAll('main > section').forEach(s=>s.classList.toggle('hide',s.id!=='v-'+view));
  const tv=SUBOF[view]||view; document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===tv));
  RENDER[view]();
  if(SUBOF[view]){ const el=document.getElementById('v-'+view); const b=document.createElement('button'); b.className='back'; b.setAttribute('data-v','more'); b.innerHTML='&lsaquo; More'; el.insertBefore(b,el.firstChild) }
  window.scrollTo(0,0) };
const persist=()=>{ try{localStorage.setItem('dfs:sal',JSON.stringify(SAL)); localStorage.setItem('dfs:salweek',String(DFS.week)); localStorage.setItem('dfs:own',JSON.stringify(OWN)); localStorage.setItem('dfs:site',site)}catch(e){} };
/* everything downstream of a player's projection: range (narrowed by consistency profile, widened by injury risk), salary, ownership, value */
function derive(p){ p.sd=p.pred*((p.prof&&p.prof.cr)?Math.min(1,Math.max(.2,p.prof.cr)):(VOL[p.p]||.5))*(p.risk==='inj'?1.3:1); p.ceil=p.pred+p.sd; p.floor=Math.max(0,p.pred-p.sd); p.sal=salOf(p); p.own=ownOf(p); p.val=p.sal?p.pred/(p.sal/1000):null }
const SLOT_ORDER=['QB','TE','DST','RB','WR','FLEX'];
const refresh=()=>{ P.forEach(p=>{ p.pred=site==='fd'?p.predFD:p.predDK; derive(p) }) };
document.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return; const d=b.dataset;
  if(d.stack){STACK=+d.stack;return renderBuild()} if(d.bring){BRING=!BRING;return renderBuild()} if(d.cap){CAP=+d.cap;return renderBuild()}
  if(d.v){view=d.v;return render()} if(d.slate){SLATE=d.slate; try{localStorage.setItem('dfs:slate',SLATE)}catch(e){} return render()} if(d.mode){MODE=d.mode;return renderBuild()} if(d.site){site=d.site; persist(); refresh(); return render()}
  if(d.act==='opt'){NL=+document.getElementById('b-n').value; LAST=optimize(NL); return renderBuild()}
  if(d.lock){LOCK.add(d.lock); BAN.delete(d.lock); return renderBuild()} if(d.ban){BAN.add(d.ban); LOCK.delete(d.ban); return renderBuild()} if(d.act==='clearlb'){LOCK.clear(); BAN.clear(); return renderBuild()}
  if(d.act==='pk-load'){const got=parseLines(document.getElementById('pk-in').value); LINES=LINES.concat(got); try{localStorage.setItem('dfs:lines:'+W.week,JSON.stringify(LINES))}catch(e){} return renderPick()} if(d.act==='pk-clear'){LINES=[]; try{localStorage.removeItem('dfs:lines:'+W.week)}catch(e){} return renderPick()}
  if(d.act==='loadsal'){const t=document.getElementById('d-sal').value; const got=parseSal(t); SAL[site]=Object.assign(SAL[site]||{},got); persist(); refresh(); alert(Object.keys(got).length+' salaries loaded'); return renderData()}
  if(d.act==='loadown'){const t=document.getElementById('d-own').value; const got=parseOwn(t); for(const n in got){ OWN[n]=OWN[n]!=null?(OWN[n]+got[n])/2:got[n] } persist(); refresh(); alert(Object.keys(got).length+' ownership rows loaded'); return renderData()}
  if(d.act==='cleardata'&&confirm('Clear salaries and ownership for '+SITES[site].name+'?')){SAL[site]={}; OWN={}; persist(); refresh(); return renderData()} });
renderFresh(); render();
</script></body></html>
