/* ---------- DATA: salaries + ownership import ---------- */
function parseSal(text){ const lines=text.split(/\r?\n/).filter(l=>l.trim()); if(!lines.length)return{}; const head=lines[0].split(',').map(h=>h.trim().toLowerCase()); const iN=head.findIndex(h=>h==='name'||h==='nickname'||h==='player'); const iS=head.findIndex(h=>h==='salary'); const out={};
  if(iN>-1&&iS>-1){ lines.slice(1).forEach(l=>{ const c=l.split(','); const n=(c[iN]||'').trim().replace(/"/g,''); const s=parseInt((c[iS]||'').replace(/[^0-9]/g,'')); if(n&&s)out[n]=s }) }
  else lines.forEach(l=>{ const m=l.match(/^(.+?)[,\t ]+\$?([0-9][0-9,]{3,})\s*$/); if(m){ out[m[1].trim()]=parseInt(m[2].replace(/,/g,'')) } });
  /* DST naming: "Texans " -> "Texans D/ST" */
  for(const n in out){ const p=P.find(x=>x.p==='DST'&&x.n.split(' ')[0].toLowerCase()===n.trim().toLowerCase()); if(p&&!out[p.n]){out[p.n]=out[n]} } return out }
function parseOwn(text){ const out={}; text.split(/\r?\n/).forEach(l=>{ const m=l.match(/^(.+?)[,\t ]+([0-9]+(?:\.[0-9]+)?)\s*%?\s*$/); if(m)out[m[1].trim()]=parseFloat(m[2]) }); return out }
function renderData(){ const el=document.getElementById('v-data'); const S=SAL[site]||{};
  el.innerHTML=`<h2>Data</h2><div class="card"><div style="display:flex;gap:6px"><button class="btn ${site==='dk'?'on':''}" data-site="dk">DraftKings</button><button class="btn ${site==='fd'?'on':''}" data-site="fd">FanDuel</button></div>
  <div class="sub" style="margin-top:10px">SALARIES — ${Object.keys(S).length} loaded for ${SITES[site].name}, Week ${W.week}</div><textarea id="d-sal" rows="4" placeholder="Paste the salary CSV export, or lines like: Jahmyr Gibbs, 9200" class="paste" style="margin-top:6px"></textarea><button class="btn on" data-act="loadsal" style="margin-top:6px">Load salaries</button>
  <div class="sub" style="margin-top:14px">OWNERSHIP PROJECTIONS — ${Object.keys(OWN).length} loaded</div><textarea id="d-own" rows="4" placeholder="Name, 23.5  (one per line — any source; paste several, the app averages by name)" class="paste" style="margin-top:6px"></textarea><button class="btn on" data-act="loadown" style="margin-top:6px">Load ownership</button>
  <div class="note" style="margin-top:12px">Projections come from the shared Season HQ engine — same sources, same dials, same weather and context layers. Salaries and ownership are the two inputs that make it DFS. The weekly task will load both once a source is confirmed; until then, paste.</div>
  <div style="margin-top:8px"><button class="btn r" data-act="cleardata">Clear this site's data</button></div></div>` }

/* ---------- BRAIN: DFS-specific tracking ---------- */
function renderBrain(){ const el=document.getElementById('v-brain'); const H=(DFS.model.history||[]);
  el.innerHTML=`<h2>What this app tracks</h2><div class="card"><div class="note" style="margin:0">Three predictions, three scores, every week: <b>points</b> (shared with Season HQ — same ledger, same dials), <b>ownership</b> (our projected % vs. actual contest ownership, so the leverage tool learns whether its sources see the field correctly), and <b>lineups</b> (each built lineup's projected score vs. its actual, split by cash and tournament). The goal is not to be right about players — it's to find where the salary and the crowd are wrong, and to know how often we were right about <i>that</i>.</div></div>
  <h2>Points accuracy</h2><div class="card">${H.length?H.map(h=>`<div class="row"><span class="rk">W${h.week}</span><span class="nm">MAE ${h.mae.toFixed(2)}${h.grade?' · '+h.grade:''}</span></div>`).join(''):'<div class="note">Inherits the Season HQ ledger. No scored week yet.</div>'}</div>
  ${(()=>{ const PW=DFS.paper||{}; const wks=Object.keys(PW).sort((a,b)=>b-a); if(!wks.length) return ''; return '<h2>Paper lineups <span class="pill">frozen before kickoff, graded Tuesday</span></h2><div class="note" style="margin:0 0 8px">The builder\'s own picks, frozen as a test. Not entered anywhere. Cash = 60% projection + 40% floor; GPP = ceiling-weighted with a 2-man stack.</div>'+wks.map(w=>{ const R=PW[w]; const opt=R.optimal||{}; return `<div class="card" style="padding:2px 8px"><div class="sub" style="margin:6px 0">Week ${w} · frozen ${(R.frozenAt||'').slice(0,16).replace('T',' ')}</div>${R.lineups.map(l=>`<details class="pl"><summary><div class="row"><span class="chip" style="background:${l.site==='dk'?'#53a300':'#1493ff'}">${l.site.toUpperCase()}</span><span class="nm">${l.mode} #${l.idx+1}<div class="sub">${l.players.slice(0,3).map(p=>esc(p.n)).join(' · ')} … <b>tap to expand</b></div></span><span class="num">${l.act!=null?l.act:'—'}<div class="sub">proj ${l.proj} · $${(l.sal/1000).toFixed(1)}k</div></span><span class="num ${l.diff==null?'':l.diff>=0?'pos':'neg'}">${l.diff==null?'<span class="sub">pending</span>':(l.diff>=0?'+':'')+l.diff}${opt[l.site]&&l.act!=null?'<div class="sub">'+Math.round(100*l.act/opt[l.site].tot)+'% of best</div>':''}</span></div></summary><div class="plbody">${l.players.map((p,i)=>`<div class="row"><span class="chip" style="background:${PC[p.p]||'#555'}">${i===7?'FLEX':p.p}</span><span class="nm">${esc(p.n)}<div class="sub">${p.t}${p.own!=null?' · own '+p.own.toFixed(0)+'%':''}</div></span><span class="sal">$${(p.sal/1000).toFixed(1)}k</span><span class="num ${p.act==null?'':p.act>=p.pred?'pos':'neg'}">${p.act!=null?p.act:p.pred.toFixed(1)}<div class="sub">${p.act!=null?'proj '+p.pred.toFixed(1):'proj'}</div></span></div>`).join('')}</div></details>`).join('')}${Object.keys(opt).map(s=>`<div class="note" style="margin:6px 0">${s.toUpperCase()} best possible in hindsight: <b>${opt[s].tot}</b> — ${opt[s].players.map(p=>esc(p.n)+' '+p.act).join(', ')}</div>`).join('')}</div>` }).join('') })()}
  <h2>Ownership accuracy</h2><div class="card"><div class="note">${Object.keys(DFS.ownActual||{}).length?'':'Loads once actual ownership is pulled from contest results (DraftKings shows it post-lock). The weekly task records it.'}</div></div>
  <h2>Where the edge has been</h2><div class="card"><div class="note">After three weeks this shows which inefficiency actually paid: salary lag, low-owned ceiling, stacks in high totals, or floor-per-dollar in cash. The one that keeps paying is the one to lean on.</div></div>`}

let view='board'; const render=()=>{document.querySelectorAll('section').forEach(s=>s.classList.toggle('hide',s.id!=='v-'+view)); document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===view)); ({board:renderBoard,lev:renderLev,stack:renderStack,build:renderBuild,pick:renderPick,data:renderData,brain:renderBrain})[view]()};
const persist=()=>{ try{localStorage.setItem('dfs:sal',JSON.stringify(SAL)); localStorage.setItem('dfs:salweek',String(DFS.week)); localStorage.setItem('dfs:own',JSON.stringify(OWN)); localStorage.setItem('dfs:site',site)}catch(e){} };
/* everything downstream of a player's projection: range (narrowed by consistency profile, widened by injury risk), salary, ownership, value */
function derive(p){ p.sd=p.pred*((p.prof&&p.prof.cr)?Math.min(1,Math.max(.2,p.prof.cr)):(VOL[p.p]||.5))*(p.risk==='inj'?1.3:1); p.ceil=p.pred+p.sd; p.floor=Math.max(0,p.pred-p.sd); p.sal=salOf(p); p.own=ownOf(p); p.val=p.sal?p.pred/(p.sal/1000):null }
const SLOT_ORDER=['QB','TE','DST','RB','WR','FLEX'];
const refresh=()=>{ P.forEach(p=>{ p.pred=site==='fd'?p.predFD:p.predDK; derive(p) }) };
document.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return; const d=b.dataset;
  if(d.stack){STACK=+d.stack;return renderBuild()} if(d.bring){BRING=!BRING;return renderBuild()} if(d.cap){CAP=+d.cap;return renderBuild()}
  if(d.v){view=d.v;return render()} if(d.slate){SLATE=d.slate; try{localStorage.setItem('dfs:slate',SLATE)}catch(e){} return render()} if(d.mode){MODE=d.mode;return renderBuild()} if(d.site){site=d.site; persist(); refresh(); return render()}
  if(d.act==='opt'){NL=+document.getElementById('b-n').value; LAST=optimize(NL); return renderBuild()}
  if(d.lock){LOCK.add(d.lock); BAN.delete(d.lock); return renderBuild()} if(d.ban){BAN.add(d.ban); LOCK.delete(d.ban); return renderBuild()} if(d.act==='clearlb'){LOCK.clear(); BAN.clear(); return renderBuild()}
  if(d.act==='pk-load'){const got=parseLines(document.getElementById('pk-in').value); LINES=LINES.concat(got); try{localStorage.setItem('dfs:lines:'+W.week,JSON.stringify(LINES))}catch(e){} return renderPick()} if(d.act==='pk-clear'){LINES=[]; try{localStorage.removeItem('dfs:lines:'+W.week)}catch(e){} return renderPick()}
  if(d.act==='loadsal'){const t=document.getElementById('d-sal').value; const got=parseSal(t); SAL[site]=Object.assign(SAL[site]||{},got); persist(); refresh(); alert(Object.keys(got).length+' salaries loaded'); return renderData()}
  if(d.act==='loadown'){const t=document.getElementById('d-own').value; const got=parseOwn(t); for(const n in got){ OWN[n]=OWN[n]!=null?(OWN[n]+got[n])/2:got[n] } persist(); refresh(); alert(Object.keys(got).length+' ownership rows loaded'); return renderData()}
  if(d.act==='cleardata'&&confirm('Clear salaries and ownership for '+SITES[site].name+'?')){SAL[site]={}; OWN={}; persist(); refresh(); return renderData()} });
document.getElementById('ver').textContent=`engine ${DFS.version} · week ${W.week}`; render();
</script></body></html>
