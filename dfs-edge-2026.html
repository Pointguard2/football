/* ---- 2026-09-15 shared refresh: additive only, never removes a rule above.

   type scale, roomier cards and 44px tap targets. Status colour is never the
   only signal — .res always carries a word. ---- */
:root{--accent:var(--lime);--won:#3DDC84;--lost:#FF4F5E;--push:#FFB020;--open:#8A97A3;--r:14px;--pad:14px}
body{line-height:1.35}

h2{margin:26px 0 10px}h2:first-child{margin-top:18px}
.card{border-radius:var(--r);padding:var(--pad);margin-bottom:10px}
.row{gap:10px;padding:10px 2px}
.sub{font-size:12px;margin-top:3px;line-height:1.4}
.note{font-size:12.5px;line-height:1.5;margin:10px 0 0}
.pos{color:var(--won)}.neg{color:var(--lost)}
.tab{min-height:44px}
.btn{min-height:44px;padding:10px 14px;color:var(--chalk)}
.btn.on{background:var(--accent);color:#0A0D11;border-color:var(--accent);font-weight:700}
input[type=search],input[type=text],select{min-height:44px;padding:12px}
.grid{gap:7px 12px}.grid>div{min-height:22px;display:flex;align-items:center}
.k{font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.seg{gap:8px;margin:8px 0 12px}

.stat{font:700 30px/1 var(--disp);letter-spacing:.01em}
.statlab{font:12px var(--body);color:var(--muted);margin-top:5px}
.statrow{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.statrow>div:last-child{text-align:right}

.res{display:inline-flex;align-items:center;gap:5px;font:700 11px var(--disp);letter-spacing:.07em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid;white-space:nowrap}
.res.won{color:var(--won);border-color:rgba(61,220,132,.45);background:rgba(61,220,132,.1)}
.res.lost{color:var(--lost);border-color:rgba(255,79,94,.45);background:rgba(255,79,94,.1)}
.res.push{color:var(--push);border-color:rgba(255,176,32,.45);background:rgba(255,176,32,.1)}
.res.open{color:var(--open);border-color:var(--line);background:var(--panel2)}
.tag{display:inline-block;font:700 10px var(--disp);letter-spacing:.09em;text-transform:uppercase;padding:3px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted);background:var(--panel2);white-space:nowrap}
.tag.real{color:var(--accent);border-color:currentColor}

.bet .who{flex:1;min-width:0}.bet .pick{font-size:15px;font-weight:600;line-height:1.35}
.bet .rt{flex:0 0 auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.bet .amt{font:700 15px var(--mono)}

/* ===== v2 shell · clearer hierarchy, progressive disclosure =================
   Rules followed: bottom bar holds 3–5 top-level views (overflow → More);
   every card answers first and explains on tap; disclosure never nests
   more than two deep. Colour still never carries meaning on its own. */
body{padding-bottom:calc(86px + env(safe-area-inset-bottom))}
details>summary{list-style:none}
details>summary::-webkit-details-marker{display:none}

/* ---- header: one compact identity block, nothing that wraps ---- */
header{background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;align-items:flex-start}
.brand{font:700 21px/1 var(--disp);letter-spacing:.04em}
.brand i{color:var(--accent);font-style:normal}
.tagline{font:600 9px/1.3 var(--body);letter-spacing:.14em;color:var(--muted);margin-top:6px;text-transform:uppercase}

/* ---- freshness strip: is this data current? one line, tap for the rest ---- */
#fresh{position:sticky;top:0;z-index:39;background:var(--bg);padding:2px 12px 8px;border-bottom:1px solid var(--line)}
.fresh{display:flex;align-items:center;gap:9px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:42px;font:12.5px var(--body);color:var(--muted);cursor:pointer}

details.dis{border-top:1px solid var(--line);margin-top:11px}

.disbody{padding:0 0 10px}
.disbody .note{margin-top:8px}

.chiprow::-webkit-scrollbar{display:none}

details.filt[open]>summary{border-color:var(--accent);color:var(--accent)}

.pcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);margin-bottom:9px}
.pcard.hot{border-color:rgba(180,255,60,.42);background:var(--panel2)}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pname{font-size:15.5px;font-weight:600;line-height:1.25}
.ppick{font-size:15px;font-weight:600;margin-top:9px;line-height:1.35}
.pmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:9px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12.5px;color:var(--muted)}
.kv b{color:var(--chalk);font-weight:600}

/* ---- 5-tab bar, icon + label ---- */
.tabs{background:var(--bg);padding:5px 4px calc(5px + env(safe-area-inset-bottom));gap:2px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:7px 4px;font-size:9.5px;letter-spacing:.05em}

/* ---- More menu + sub-view back ---- */
.mitem{display:flex;align-items:center;gap:13px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px var(--pad);margin-bottom:9px;text-align:left;min-height:66px}

.back{display:inline-flex;align-items:center;gap:7px;background:none;border:0;color:var(--muted);font:700 11px var(--disp);letter-spacing:.07em;text-transform:uppercase;padding:12px 2px 0;min-height:44px}
.empty{text-align:center;padding:30px 12px}
.empty .verdict{color:var(--muted)}

.ent{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.ent:last-child{border-bottom:0}

/* patch-results 2026-10-03 */
.rs-seg{display:flex;gap:6px;margin:0 0 12px}.rs-seg button{flex:1;min-height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font:600 13px var(--body)}

  const seg=`<div class="rs-seg">${[['all','All'],['dk','DraftKings'],['fd','FanDuel']].map(([k,t])=>`<button data-rf="${k}" class="${RSITE===k?'on':''}">${t}</button>`).join('')}</div>`;
  /* this week */
  const cw=DFS.week, CR=PW[cw];
  const thisWeek=!CR?`<div class="card rs-now"><div class="rs-k">Week ${cw}</div><div class="rs-now-t">Lineups build Sunday at 9:30 AM</div><div class="note" style="margin-top:4px">Frozen before the first kickoff, checked automatically once the games are final (Tuesday night).</div></div>`
    :`<div class="card rs-now"><div class="rs-k">Week ${cw}</div><div class="rs-now-t">${(CR.lineups||[]).length} lineups locked in${CR.lateFreeze?' (after kickoff)':''}</div><div class="note" style="margin-top:4px">${CR.gradedAt?'Graded':'Results arrive Tuesday night, once the games are final.'}</div></div>`;
  /* split by site x type */
  const split=[['dk','cash'],['dk','gpp'],['fd','cash'],['fd','gpp']].filter(([s])=>RSITE==='all'||s===RSITE).map(([s,m])=>{ const t=rsTally(counted.filter(x=>x.l.site===s&&x.l.mode===m)); return {s,m,t} }).filter(x=>x.t.W+x.t.L);
  let h=`<h2>Results</h2>${seg}${RSITE==='fd'?'':rsPoolsHero()}
  <div class="card rs-hero"><div class="rs-rec"><span class="won">${T.W}</span><span class="dash">&ndash;</span><span class="lost">${T.L}</span></div>
    <div class="rs-sub">${n?pct+'% wins':'No graded lineups yet'} &middot; ${n} lineup${n===1?'':'s'} graded</div>
    ${split.length?`<div class="rs-split">${split.map(x=>`<div><div class="rs-k">${x.s.toUpperCase()} ${x.m==='cash'?'cash':'tourney'}</div><div class="rs-sv">${x.t.W}&ndash;${x.t.L}</div></div>`).join('')}</div>`:''}
    ${claude.length?`<div class="rs-claude"><span class="rs-tag">Claude’s picks</span> ${TC.W}&ndash;${TC.L}</div>`:''}
    <details class="dis"><summary>How a win is counted <span class="caret">&#9662;</span></summary><div class="disbody"><div class="note" style="margin-top:0">
      A DraftKings lineup <b>wins</b> when it would have <b>made money</b> in the real contests it was entered in on paper (Millionaire, Play-Action, First Down for tournament lineups; Double Up for cash): same entry fee, same payout table, ranked against the real field. ${usesMoney?'':'No week has a real-contest result yet. '}The field comes from a contest's standings export (enter it once, then Export &rarr; <span class="k">inbox\\contest-standings-&lt;id&gt;.csv</span>) or DraftKings' public leaderboard. Where neither exists, a lineup wins when it scores at least its target. That target is the contest's real <b>cash line</b> when you've dropped a standings export for that week (any DraftKings or FanDuel contest &rarr; Export &rarr; <span class="k">inbox\\standings-&lt;week&gt;-&lt;dk|fd&gt;-&lt;cash|gpp&gt;-paid&lt;N&gt;.csv</span>). Without one, it's the lineup's own <b>projection</b> &mdash; a stricter bar, because our projections have run high.${usesCash?'':' No week has a cash line yet, so every result below is against projection.'}
      Lineups are built from the app's own picks before kickoff and never entered, so there's no money here; real entries live under <b>Real money</b> below. Week records count the builder's 1 cash + 3 tournament lineups per site. Lineups frozen after kickoff are shown but left out of the record.</div></div></details></div>
  ${thisWeek}<h2>Week by week</h2>`;
  if(!weeks.length) h+=`<div class="card empty"><div class="verdict">Nothing graded yet</div></div>`;
  weeks.forEach((w,wi)=>{ const rows=all.filter(x=>x.w===w); if(!rows.length) return; const R=PW[w];
    const bld=rows.filter(x=>x.l.mode!=='reasoned'), cl=rows.filter(x=>x.l.mode==='reasoned'); const t=rsTally(bld);
    const graded=bld.some(x=>x.o.r!=='open'); const late=!!R.lateFreeze;
    const gk=bld.filter(x=>x.o.t), nc=gk.filter(x=>x.o.t.kind==='cash').length, nm=gk.filter(x=>x.o.t.kind==='money').length; const kind=nm?(nm===gk.length?'in real contests':'DK in real contests, the rest vs '+(nc?'cash line':'projection')):!nc?'vs projection':nc===gk.length?'vs cash line':'vs cash line where known, else projection';
    const line=x=>{ const l=x.l,o=x.o; const best=((R.optimal||{})[l.site]||{}).tot; const ofBest=best&&l.act!=null?Math.round(100*l.act/best):null;
      return `<details class="plr rs-lu"><summary>
        <span class="rs-pill ${o.r==='W'?'w':o.r==='L'?'l':'o'}">${o.r==='open'?'&bull;':o.r}</span>
        <span class="rs-who"><span class="site ${l.site}">${l.site.toUpperCase()}</span> ${l.mode==='reasoned'?'<span class="rs-tag">Claude’s pick</span>':MN[l.mode]+(l.mode==='gpp'?' '+(l.idx+1):'')}</span>
        <span class="rs-sc">${l.act==null?'<span class="sub" style="margin:0">pending</span>':'<b>'+l.act+'</b><span class="sub" style="margin:0"> '+(o.t&&o.t.kind==='money'?(o.net!=null?$m(o.net):'won '+o.pools.filter(x=>x.e.won).length+' of '+o.pools.length):'/ '+o.t.v)+'</span>'}</span>
      </summary><div class="plbody">
        <div class="note" style="margin:6px 0 8px">${l.act==null?'Projected '+l.proj+'. Graded once the games are final.':o.t.kind==='money'?`Scored <b>${l.act}</b>.${ofBest!=null?' That’s '+ofBest+'% of the best lineup possible in hindsight.':''}${o.late?' Built after kickoff, so not counted.':''}</div>${rsPoolLines(o)}<div>`:`Scored <b>${l.act}</b> against a ${o.t.lbl} of <b>${o.t.v}</b> (${o.margin>=0?'+':''}${o.margin}).${ofBest!=null?' That’s '+ofBest+'% of the best lineup possible in hindsight.':''}${o.late?' Built after kickoff, so not counted.':''}`}</div>
        ${l.why?'<div class="why1">'+esc(l.why)+'</div>':''}
        ${(l.players||[]).map((p,k)=>{ const up=p.act!=null&&p.pred!=null?p.act>=p.pred:null; return `<div class="row" style="padding:5px 0"><span class="chip" style="background:${PC[p.p]||'#555'}">${k===7?'FLEX':p.p}</span><span class="nm" style="font-size:13px">${esc(p.n)}<div class="sub">${p.t||''}${p.sal?' &middot; $'+(p.sal/1000).toFixed(1)+'k':''}</div></span><span class="num ${up==null?'':up?'pos':'neg'}">${p.act!=null?p.act:'&mdash;'}<div class="sub">proj ${p.pred!=null?(+p.pred).toFixed(1):'&mdash;'}</div></span></div>` }).join('')}
      </div></details>` };
    h+=`<details class="wk" ${wi===0?'open':''}><summary><span class="wkname">Week ${w}</span>
      <span class="wkmeta"><span class="rs-sqs">${bld.map(x=>sq(x.o)).join('')}</span><div class="sub" style="margin:2px 0 0">${graded?kind:'not graded yet'}${late?' &middot; built after kickoff, not counted':''}</div></span>
      <span class="wkamt">${graded?`<span class="won">${t.W}</span>&ndash;<span class="lost">${t.L}</span>`:'&mdash;'}</span><span class="caret">&#9662;</span></summary>
      <div class="wkbody">${RSITE==='fd'?'':rsPoolsWeek(w)}${bld.map(line).join('')}${cl.length?'<div style="border-top:1px solid var(--line);margin-top:6px"></div>'+cl.map(line).join(''):''}</div></details>` });
  const nC=Object.values(CONTESTS).reduce((a,v)=>a+v.length,0);
  h+=`<details class="wk rs-money" ${nC?'open':''}><summary><span class="wkname">Real money</span><span class="wkmeta"><div class="sub" style="margin:0">${nC?nC+' contest'+(nC===1?'':'s')+' logged':'none logged'}</div></span><span class="caret">&#9662;</span></summary><div class="wkbody" id="pnl-money"></div></details>`;
  el.innerHTML=h; renderMoney();
  el.querySelectorAll('[data-rf]').forEach(b=>b.onclick=()=>{ RSITE=b.dataset.rf; try{localStorage.setItem('dfs:rsite',RSITE)}catch(e){} renderPnl() });
}

/* paper lineups: scored in points against the best that was possible — never in money (kept for rollback; Results replaces it) */
function paperScorecard(){ /* patch-dfs 2026-09-28 */
  const PW=DFS.paper||{}; const wks=Object.keys(PW).map(Number).sort((a,b)=>b-a); if(!wks.length) return '';
  const LBL={cash:'Cash',gpp:'GPP',reasoned:'Reasoned'};
  const tone=p=>p==null?'var(--muted)':p>=85?'var(--won)':p>=65?'var(--push)':'var(--lost)';
  return `<h2>Paper lineups</h2><div class="note" style="margin:0 0 10px">Frozen before kickoff, never entered, scored in points. <b>Of best</b> is the share of the best lineup you could have built in hindsight from the same salaries; <b>real field</b> is where it would have landed in an actual contest. Tap a lineup for its players.</div>`+
  wks.map((w,wi)=>{ const R=PW[w]; const opt=R.optimal||{}; const L=R.lineups||[]; const graded=L.filter(l=>l.act!=null);
    const C=(((DFS.lobbies||{})[w]||{}).contests)||[];
    const pctOf=l=>opt[l.site]&&l.act!=null?100*l.act/opt[l.site].tot:null;
    const builder=graded.filter(l=>l.mode!=='reasoned'&&pctOf(l)!=null); const avg=builder.length?builder.reduce((a,l)=>a+pctOf(l),0)/builder.length:null;
    const lob=l=>C.find(c=>c.site===l.site&&c.type===(l.mode==='cash'?'cash':'gpp'))||C.find(c=>c.site===l.site)||null;
    const field=l=>{ if(l.act==null) return null; const c=lob(l); if(!c) return null;
      if(c.q){ let k=0; while(k<20&&l.act<c.q[k]) k++; const top=Math.max(1,k*5); const cashed=c.cash!=null?l.act>=c.cash:null;
        return {txt:'top '+top+'%'+(cashed===true?' &#10003;':''),sub:cashed==null?'':cashed?'cashed':'missed by '+(c.cash-l.act).toFixed(1),col:cashed===true||top<=20?'var(--won)':cashed===false||top>=60?'var(--lost)':'var(--push)'} }
      if(c.cash!=null){ const ok=l.act>=c.cash; return {txt:ok?'cashed &#10003;':'missed',sub:ok?'':'by '+(c.cash-l.act).toFixed(1),col:ok?'var(--won)':'var(--lost)'} }
      if(c.win!=null) return {txt:(l.act-c.win).toFixed(0),sub:'to 1st',col:'var(--muted)'};
      return null };
    const anyField=L.some(l=>field(l));
    const cols=anyField?'1fr auto auto auto':'1fr auto auto';
    const row=l=>{ const p=pctOf(l), fd=field(l), R2=l.mode==='reasoned';
      return `<details class="plr"><summary style="display:grid;grid-template-columns:${cols};gap:7px 12px;align-items:center;padding:7px 0">
        <div><span class="site ${l.site}">${l.site.toUpperCase()}</span> ${R2?'<span style="color:#B08CFF;font-weight:700">Reasoned</span>':LBL[l.mode]||l.mode}${!R2&&l.mode!=='cash'?' #'+(l.idx+1):''}${l.late?' <span class="sub" style="display:inline">late</span>':''}</div>
        <div class="sub" style="margin:0">${l.proj} &rarr; ${l.act==null?'&mdash;':'<b style="color:var(--chalk)">'+l.act+'</b>'}</div>
        <div style="text-align:right;font:700 14px var(--mono);color:${tone(p)}">${p==null?'&mdash;':Math.round(p)+'%'}</div>
        ${anyField?`<div style="text-align:right;font:700 13px var(--mono);color:${fd?fd.col:'var(--muted)'}">${fd?fd.txt:'&mdash;'}${fd&&fd.sub?'<div class="sub" style="margin:0;font-weight:400">'+fd.sub+'</div>':''}</div>`:''}
      </summary><div class="plbody">${R2&&l.why?'<div class="why1">'+esc(l.why)+'</div>':''}${l.players.map((x,k)=>{ const up=x.act!=null&&x.pred!=null?x.act>=x.pred:null;
        return `<div class="row" style="padding:5px 0"><span class="chip" style="background:${PC[x.p]||'#555'}">${k===7?'FLEX':x.p}</span><span class="nm" style="font-size:13px">${esc(x.n)}<div class="sub">${x.t} &middot; $${(x.sal/1000).toFixed(1)}k</div></span><span class="num ${up==null?'':up?'pos':'neg'}">${x.act!=null?x.act:'&mdash;'}<div class="sub">proj ${x.pred!=null?(+x.pred).toFixed(1):'&mdash;'}</div></span></div>` }).join('')}</div></details>` };
    const lanes=[L.filter(l=>l.mode!=='reasoned'),L.filter(l=>l.mode==='reasoned')].filter(a=>a.length);
    const cLine=C.map(c=>`<div class="sub" style="margin:2px 0"><span class="site ${c.site}">${c.site.toUpperCase()}</span> ${esc(c.name||c.type)}${c.fee!=null?' &middot; $'+c.fee:''}${c.entries?' &middot; '+c.entries.toLocaleString()+' entries':''} &mdash; 1st <b>${c.win!=null?c.win:'?'}</b>${c.cash!=null?' &middot; cash line <b>'+c.cash+'</b>':''}${c.url?' &middot; <a href="'+esc(c.url)+'" target="_blank" rel="noopener" style="color:var(--muted)">source</a>':''}</div>`).join('');
    return `<details class="wk" ${wi===0?'open':''}><summary><span class="wkname">Week ${w}</span>
      <span class="wkmeta"><div class="sub" style="margin:0">${L.length} lineups &middot; ${graded.length?'graded':'not graded yet'}${C.length?' &middot; vs real contests':''}</div></span>
      <span class="wkamt" style="color:${tone(avg)}">${avg==null?'&mdash;':Math.round(avg)+'%'}</span><span class="caret">&#9662;</span></summary>
      <div class="wkbody">${C.length?'<div style="padding-top:10px">'+cLine+'</div>':''}
      <div style="display:grid;grid-template-columns:${cols};gap:7px 12px;padding-top:12px"><div class="k">Lineup</div><div class="k">Proj &rarr; actual</div><div class="k" style="text-align:right">Of best</div>${anyField?'<div class="k" style="text-align:right">Real field</div>':''}</div>
      ${lanes.map((a,k)=>(k?'<div style="border-top:1px solid var(--line);margin-top:4px"></div>':'')+a.map(row).join('')).join('')}
      <div class="note">${R.lateFreeze?'Frozen after kickoff &mdash; shown, not a prediction. ':''}The week's % is the builder's average; the Reasoned lineup is scored beside it, not in it.${C.some(c=>!c.q&&c.cash==null)?' Where only the winning score is published, real field shows the distance to 1st.':''}</div></div></details>` }).join('');
}
function wirePnl(){ const el=document.getElementById('v-pnl');
  el.querySelectorAll('[data-cdel]').forEach(b=>b.onclick=()=>{ const [w,i]=b.dataset.cdel.split(':'); CONTESTS[w].splice(+i,1); if(!CONTESTS[w].length) delete CONTESTS[w]; saveContests(); renderPnl() });
  el.querySelectorAll('[data-cact]').forEach(b=>b.onclick=()=>{ const a=b.dataset.cact;
    if(a==='clear'){ for(const w in CONTESTS){ CONTESTS[w]=CONTESTS[w].filter(c=>!c.local); if(!CONTESTS[w].length) delete CONTESTS[w] } saveContests(); return renderPnl() }
    if(a==='add'){ const g=id=>document.getElementById(id).value.trim();
      const fee=parseFloat(g('c-fee').replace(/[^0-9.]/g,'')); const entries=parseInt(g('c-entries'))||1; const wonRaw=g('c-won');
      if(!(fee>=0)){ alert('Enter the entry fee'); return }
      const w=String(DFS.week); CONTESTS[w]=CONTESTS[w]||[];
      CONTESTS[w].push({id:Date.now(),week:+w,site:g('c-site'),type:g('c-type'),name:g('c-name'),fee,entries,won:wonRaw===''?null:(parseFloat(wonRaw.replace(/[^0-9.]/g,''))||0),local:true});
      saveContests(); renderPnl() } });
}
let view='board';
const SUBOF={lev:'more',pick:'more',brain:'more',data:'more'};
const RENDER={board:renderBoard,lev:renderLev,stack:renderStack,build:renderBuild,pick:renderPick,data:renderData,brain:renderBrain,pnl:renderPnl,more:renderMore};
const render=()=>{ document.querySelectorAll('main > section').forEach(s=>s.classList.toggle('hide',s.id!=='v-'+view));
  const tv=SUBOF[view]||view; document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===tv));
  RENDER[view]();
  if(SUBOF[view]){ const el=document.getElementById('v-'+view); const b=document.createElement('button'); b.className='back'; b.setAttribute('data-v','more'); b.innerHTML='&lsaquo; More'; el.insertBefore(b,el.firstChild) }
  window.scrollTo(0,0) };
const persist=()=>{ try{localStorage.setItem('dfs:sal',JSON.stringify(SAL)); localStorage.setItem('dfs:salweek',String(DFS.week)); localStorage.setItem('dfs:own',JSON.stringify(OWN)); localStorage.setItem('dfs:site',site)}catch(e){} };
/* everything downstream of a player's projection: range (narrowed by consistency profile, widened by injury risk), salary, ownership, value */
function derive(p){ p.sd=p.pred*((p.prof&&p.prof.cr)?Math.min(1,Math.max(.2,p.prof.cr)):(VOL[p.p]||.5))*(p.risk==='inj'?1.3:1); p.ceil=p.pred+p.sd; p.floor=Math.max(0,p.pred-p.sd); p.sal=salOf(p); p.own=ownOf(p); p.val=p.sal?p.pred/(p.sal/1000):null }
const SLOT_ORDER=['QB','TE','DST','RB','WR','FLEX'];
const refresh=()=>{ P.forEach(p=>{ p.pred=site==='fd'?p.predFD:p.predDK; derive(p) }) };
document.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return; const d=b.dataset;
  if(d.stack){STACK=+d.stack;return renderBuild()} if(d.bring){BRING=!BRING;return renderBuild()} if(d.cap){CAP=+d.cap;return renderBuild()}
  if(d.v){view=d.v;return render()} if(d.slate){SLATE=d.slate; try{localStorage.setItem('dfs:slate',SLATE)}catch(e){} return render()} if(d.mode){MODE=d.mode;return renderBuild()} if(d.site){site=d.site; persist(); refresh(); return render()}
  if(d.act==='opt'){NL=+document.getElementById('b-n').value; LAST=optimize(NL); return renderBuild()}
  if(d.lock){LOCK.add(d.lock); BAN.delete(d.lock); return renderBuild()} if(d.ban){BAN.add(d.ban); LOCK.delete(d.ban); return renderBuild()} if(d.act==='clearlb'){LOCK.clear(); BAN.clear(); return renderBuild()}
  if(d.act==='pk-load'){const got=parseLines(document.getElementById('pk-in').value); LINES=LINES.concat(got); try{localStorage.setItem('dfs:lines:'+W.week,JSON.stringify(LINES))}catch(e){} return renderPick()} if(d.act==='pk-clear'){LINES=[]; try{localStorage.removeItem('dfs:lines:'+W.week)}catch(e){} return renderPick()}
  if(d.act==='loadsal'){const t=document.getElementById('d-sal').value; const got=parseSal(t); SAL[site]=Object.assign(SAL[site]||{},got); persist(); refresh(); alert(Object.keys(got).length+' salaries loaded'); return renderData()}
  if(d.act==='loadown'){const t=document.getElementById('d-own').value; const got=parseOwn(t); for(const n in got){ OWN[n]=OWN[n]!=null?(OWN[n]+got[n])/2:got[n] } persist(); refresh(); alert(Object.keys(got).length+' ownership rows loaded'); return renderData()}
  if(d.act==='cleardata'&&confirm('Clear salaries and ownership for '+SITES[site].name+'?')){SAL[site]={}; OWN={}; persist(); refresh(); return renderData()} });
renderFresh(); render();
</script></body></html>
