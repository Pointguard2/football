/* ---------- trade finder ---------- */
function gradeMe(d){return d>=18?'A':d>=11?'B':d>=5?'C':'D'}
function findTrades(){
  const wr=wireRepl(); const myVal=p=>Math.max(0,p.season-wr[p.p]); const theirVal=p=>Math.max(0,espnVal(p));
  const mine=R[ME].map(n=>byName[n]).filter(p=>p&&!['K','DST'].includes(p.p));
  const base=lineup(R[ME],myVal).total; const out=[];
  for(const t of Object.keys(R)){ if(t===ME||!R[t].length)continue;
    const theirs=R[t].map(n=>byName[n]).filter(p=>p&&!['K','DST'].includes(p.p));
    const tb=lineup(R[t],myVal).total, tbE=lineup(R[t],theirVal).total;
    const tryTrade=(give,get)=>{
      if(get.some(p=>p.risk==='fade'||['O','IR','SUSP','PUP'].includes(W.status[p.n])))return;   // never recommend acquiring a flagged player
      const g=give.map(p=>p.n), r=get.map(p=>p.n);
      const my2=lineup(R[ME].filter(n=>!g.includes(n)).concat(r),myVal).total-base;
      if(NEED){ const wantPos=POS.includes(NEED); const hit=wantPos?get.some(p=>p.p===NEED):get.some(p=>p.n===NEED); if(!hit)return; if(my2<-2)return; } else if(my2<4)return;
      const tAfter=R[t].filter(n=>!r.includes(n)).concat(g);
      const th=lineup(tAfter,myVal).total-tb, thE=lineup(tAfter,theirVal).total-tbE;
      const rawE=get.reduce((a,p)=>a+theirVal(p),0)-give.reduce((a,p)=>a+theirVal(p),0); // ESPN-lens raw swap, from their side it's -rawE
      if(thE<-6&&rawE>8)return;                       // they'd see a clear loss on their own board
      const acc=(th>=-6&&thE>=-2)?'Fair to both':(thE>=0)?'Wins on optics':(thE>=-4||rawE<=8)?'Possible':'Unlikely';
      out.push({t,give:g,get:r,my:my2,th,thE,acc,grade:gradeMe(my2)}) };
    for(const a of mine){ for(const x of theirs){ if(a.p===x.p&&Math.abs(a.r-x.r)<6)continue; tryTrade([a],[x]) } }
    for(let i=0;i<mine.length;i++)for(let j=i+1;j<mine.length;j++)for(const x of theirs) tryTrade([mine[i],mine[j]],[x]);
    for(const a of mine)for(let i=0;i<theirs.length;i++)for(let j=i+1;j<theirs.length;j++) tryTrade([a],[theirs[i],theirs[j]]);
  }
  const rank={'Fair to both':0,'Wins on optics':1,Possible:2,Unlikely:3};
  return out.sort((a,b)=>(rank[a.acc]-rank[b.acc])||(b.my-a.my)).filter((x,i,arr)=>{ const main=g=>g.map(n=>byName[n]).sort((a,b)=>a.r-b.r)[0].n; const k=x.t+'|'+main(x.get)+'|'+main(x.give); return arr.findIndex(y=>y.t+'|'+main(y.get)+'|'+main(y.give)===k)===i })
  .filter((x,i,arr)=>arr.slice(0,i).filter(y=>y.t===x.t).length<3).slice(0,12) }

/* ---------- variance model (for win probability and boom/bust) ---------- */
const VOL={QB:0.42,RB:0.5,WR:0.53,TE:0.5,LB:0.36,DL:0.63,DB:0.42,K:0.48,DST:0.75};
function sdOf(p,pred){ let v=(p.prof&&p.prof.cr)?Math.min(1,Math.max(.2,p.prof.cr)):(VOL[p.p]||.5); if(p.risk==='inj')v*=1.3; if(p.epr&&Math.abs(p.epr-p.pr)>=8)v*=1.2; if(p.spread>=3)v*=1.1; return pred*v }
const PROFTAG=p=>{ if(!p.prof)return''; const c=p.prof.cr; const tag=c<=.4?'steady':c<=.55?'normal':c<=.7?'volatile':'boom/bust'; const sat=p.prof.sat3!=null?p.prof.sat3:p.prof.sat, gp=p.prof.gp3!=null?p.prof.gp3:p.prof.gp; const inj=(sat!=null&&gp)?Math.round(100*sat/(gp+sat)):null; const shape=(p.prof.star!=null)?` · ${p.prof.star}★ ${p.prof.stiff}✕ of ${p.prof.gp}`:''; return ` <span class="pill" style="color:${c<=.4?'var(--lime)':c>.7?'var(--warn)':'var(--muted)'}">${tag} ·${c.toFixed(2)}</span>${inj!=null&&inj>=10?` <span class="pill" style="color:${inj>=20?'var(--bad)':'var(--warn)'}">missed ${inj}% (23–25)</span>`:''}` };
const Phi=z=>{ const t=1/(1+.2316419*Math.abs(z)); const d=.3989423*Math.exp(-z*z/2); let pr=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274)))); return z>=0?1-pr:pr };
let OPP={}; try{OPP=JSON.parse(localStorage.getItem('seasonhq2026:opp')||'{}')}catch(e){}
function renderWeek(){ const el=document.getElementById('v-week'); if(!R[ME]||!R[ME].length){el.innerHTML=`<h2>Week ${W.week}</h2><div class="card">Load your roster in the Rosters tab.</div>`;return}
  const ACT=(DATA.actuals||{})[String(W.week)]||{}; const played=n=>ACT[n]!==undefined; const liveVal=p=>played(p.n)?(ACT[p.n]==null?0:ACT[p.n]):weekPts(p);
  const L=lineup(R[ME],liveVal); const starters=Object.keys(L).filter(k=>k!=='BN'&&k!=='total').flatMap(k=>L[k].map(x=>({k,x})));
  const mySd=Math.sqrt(starters.reduce((a,s)=>a+(played(s.x.p.n)?0:sdOf(s.x.p,s.x.v)**2),0));
  const oppName=OPP[W.week]||teamOfOwner((DATA.myOpp||{})[W.week])||''; const teams=Object.keys(R).filter(t=>t!==ME&&R[t].length);
  const lastH=(MODEL.history||[]).slice(-1)[0]; let h=`<h2>Week ${W.week} <span class="pill">${L.total.toFixed(1)} projected</span>${lastH?`<span class="pill" style="color:var(--lime)">last week ${lastH.grade}</span>`:''}</h2>`;

  h+=`<div class="card"><div class="sub" style="margin-bottom:6px">THIS WEEK'S OPPONENT</div><select id="w-opp"><option value="">— pick opponent —</option>${teams.map(t=>`<option ${oppName===t?'selected':''}>${esc(t)}</option>`).join('')}</select>`;
  if(oppName&&R[oppName]){ const setNames=((DATA.oppSet||{})[String(W.week)]||[]).filter(n=>byName[n]); const O=setNames.length?lineup(setNames,liveVal):lineup(R[oppName],liveVal); const oSt=Object.keys(O).filter(k=>k!=='BN'&&k!=='total').flatMap(k=>O[k]); const oSd=Math.sqrt(oSt.reduce((a,x)=>a+(played(x.p.n)?0:sdOf(x.p,x.v)**2),0));
    const diff=L.total-O.total, sd=Math.sqrt(mySd**2+oSd**2), win=Phi(diff/sd); const setNote=setNames.length?` · using ${esc(oppName)}'s <b>set</b> lineup${Object.keys(ACT).filter(n=>setNames.includes(n)).length?' with '+Object.keys(ACT).filter(n=>setNames.includes(n)).length+' already scored':''}`:' · assumes they start their best lineup';
    const mode=win<.45?'underdog':win>.55?'favorite':'coinflip';
    h+=`<div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:10px"><div><div style="font:700 26px var(--disp)">${L.total.toFixed(1)}</div><div class="sub">you</div></div><div style="text-align:center"><div style="font:700 22px var(--disp);color:${win>=.5?'var(--lime)':'var(--bad)'}">${(win*100).toFixed(0)}%</div><div class="sub">win prob</div></div><div style="text-align:right"><div style="font:700 26px var(--disp)">${O.total.toFixed(1)}</div><div class="sub">${esc(oppName)}${OWN[oppName]?' · '+esc(OWN[oppName]):''}</div></div></div><div class="note" style="margin-top:4px">${setNote}</div>

    /* side-by-side lineup, ESPN-style: my slot player on the left, theirs on the right; actuals in bold once a player has played */
    const cell=(x,right)=>{ if(!x) return `<div class="mc ${right?'r':''}"><div class="sub">— empty —</div></div>`; const p=x.p, done=played(p.n), v=x.v, proj=weekPts(p), stat=W.status[p.n]; const out=done&&ACT[p.n]==null;

    const slotRows=[]; POS.forEach(k=>{ for(let i=0;i<(DATA.slots[k]||0);i++) slotRows.push([k,L[k][i],O[k][i]]) }); for(let i=0;i<DATA.slots.FLEX;i++) slotRows.push(['FLEX',L.FLEX[i],O.FLEX[i]]);

    /* swap suggestions */
    const swaps=[]; L.BN.forEach(b=>{ const sdB=sdOf(b.p,b.v); const cands=starters.filter(s=>s.x.p.p===b.p.p||(s.k==='FLEX'&&FLEXOK.includes(b.p.p))); cands.forEach(s=>{ const sdS=sdOf(s.x.p,s.x.v);
      if(mode==='underdog'&&b.v+sdB>s.x.v+sdS+0.5) swaps.push({b,s,gain:(b.v+sdB)-(s.x.v+sdS),cost:s.x.v-b.v,kind:'ceiling'});
      if(mode==='favorite'&&b.v-sdB>s.x.v-sdS+0.5) swaps.push({b,s,gain:(b.v-sdB)-(s.x.v-sdS),cost:s.x.v-b.v,kind:'floor'}) }) });
    swaps.sort((a,b)=>b.gain-a.gain);
    if(mode!=='coinflip'){ h+=`<div style="margin-top:8px">${swaps.length?swaps.slice(0,4).map(w=>`<div class="row"><span class="chip" style="background:${PC[w.b.p.p]}">${w.b.p.p}</span><span class="nm">${esc(w.b.p.n)} <span style="color:var(--muted)">for</span> ${esc(w.s.x.p.n)}<div class="sub">${w.kind} +${w.gain.toFixed(1)} · expected ${w.cost>0?'−':'+'}${Math.abs(w.cost).toFixed(1)} · ${w.s.k}</div></span><span class="num ${w.kind==='ceiling'?'':'pos'}">${w.kind==='ceiling'?'↑ boom':'↑ floor'}</span></div>`).join(''):`<div class="note">No bench swap changes the ${mode==='underdog'?'ceiling':'floor'} enough to be worth it. Your best move is the waiver wire — Defenses tab, "Exploit this week."</div>`}</div>` }
    /* head-to-head by slot */
    h+=`<div class="sub" style="margin:12px 0 4px">SLOT BY SLOT</div>${['QB','RB','WR','TE','FLEX','LB','DL','DB','K','DST'].filter(k=>DATA.slots[k]).map(k=>{const a=L[k].reduce((x,y)=>x+y.v,0), b=O[k].reduce((x,y)=>x+y.v,0); return `<div class="row"><span class="chip" style="background:${PC[k]||'var(--muted)'}">${k}</span><span class="nm"><div class="sub">${L[k].map(x=>esc(x.p.n)).join(', ')||'—'} <span style="color:var(--line)">|</span> ${O[k].map(x=>esc(x.p.n)).join(', ')||'—'}</div></span><span class="num ${a>=b?'pos':'neg'}">${a>=b?'+':''}${(a-b).toFixed(1)}</span></div>`}).join('')}`;
  } else h+=`<div class="note">Pick who you play this week and the win probability, slot-by-slot comparison and strategy appear here. Remembered per week on this phone.</div>`;
  h+=`</div>`;
  /* --- game context: aggregated across sources --- */
  const G=(DATA.games||{})[String(W.week)]||{}; const gl=Object.values(G);
  if(gl.length){ const agg=(g,side)=>{const T=g.totals||{}; const v=Object.values(T).map(x=>x[side]).filter(x=>x!=null); return v.length?v.reduce((a,b)=>a+b,0)/v.length:(side===0?g.homePts:g.awayPts)};

    const ou=g=>{ const O=g.ou; if(O==null)return''; if(typeof O==='number')return 'O/U '+O; const v=Object.values(O).filter(x=>x!=null); return v.length?'O/U '+(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1):'' };
    h+=`<h2>Game context <span class="pill">${gl.reduce((a,g)=>Math.max(a,nsrc(g)),0)} source${gl.reduce((a,g)=>Math.max(a,nsrc(g)),0)===1?'':'s'} · aggregated</span></h2><div class="card" style="padding:2px 8px">${gl.map(g=>{const hp=agg(g,0),ap=agg(g,1); return `<div class="row"><span class="nm"><b>${g.away} ${ap!=null?ap.toFixed(0):''}</b> at <b>${g.home} ${hp!=null?hp.toFixed(0):''}</b> <span class="pill">${nsrc(g)} src</span><div class="sub">${ou(g)}${ou(g)?' · ':''}${locks(g).length?'consensus starts: '+locks(g).map(esc).join(', '):''}${(g.notes||[]).length?'<br>'+g.notes.map(n=>'<i>'+esc(n.src)+':</i> '+esc(n.text)).join(' · '):''}</div></span></div>`}).join('')}</div><div class="note">Implied totals are the average of every source that published one. Starts show how many sources agree. Shadow-report and matchup notes are attributed so you can weigh them yourself.</div>` }

  POS.concat(['FLEX']).forEach(k=>{ if(!DATA.slots[k])return; for(let i=0;i<DATA.slots[k];i++){const x=L[k][i]; h+=`<div class="row"><span class="chip" style="background:${PC[k]||'var(--muted)'}">${k}</span><span class="nm">${x?esc(x.p.n)+MARK(x.p.risk,x.p.n):'<span class="neg">empty</span>'}<div class="sub">${x?x.p.t+' '+grade(x.p)+st(x.p)+bye(x.p)+CTXTAG(x.p)+PROFTAG(x.p)+(W.note[x.p.n]?' · '+esc(W.note[x.p.n]):'')+' · floor '+(x.v-sdOf(x.p,x.v)).toFixed(0)+' / ceiling '+(x.v+sdOf(x.p,x.v)).toFixed(0):''}</div></span><span class="num">${x?x.v.toFixed(1):''}</span></div>`}});
  h+=`</div><h2>Bench · closest calls first</h2><div class="card" style="padding:2px 8px">`;
  L.BN.map(b=>{const alt=starters.filter(s=>s.x.p.p===b.p.p||(s.k==='FLEX'&&FLEXOK.includes(b.p.p))).sort((a,c)=>a.x.v-c.x.v)[0]; return {b,alt,gap:alt?alt.x.v-b.v:99}}).sort((a,c)=>a.gap-c.gap).forEach(({b,alt,gap})=>{
    h+=`<div class="row"><span class="chip" style="background:${PC[b.p.p]}">${b.p.p}</span><span class="nm">${esc(b.p.n)}${MARK(b.p.risk,b.p.n)}<div class="sub">${b.p.t} ${grade(b.p)}${st(b.p)}${bye(b.p)}${CTXTAG(b.p)}${PROFTAG(b.p)}${alt?' · '+(gap<1.5?'<b style="color:var(--warn)">coin flip</b> vs ':'behind ')+esc(alt.x.p.n)+' by '+gap.toFixed(1):''} · ceiling ${(b.v+sdOf(b.p,b.v)).toFixed(0)}</div></span><span class="num">${b.v.toFixed(1)}</span></div>`});
  h+=`</div>`; if((MODEL.history||[]).length){const last=MODEL.history[MODEL.history.length-1]; h+=`<div class="note">Last scored week: MAE ${last.mae.toFixed(2)}. The model adjusted; this week's numbers already include it. Nothing carries over from last week except what the data earned.</div>`}

  let h=paperHtml+`<h2>Last week's grade</h2><div class="card top" style="display:flex;gap:14px;align-items:center"><div class="grade" style="font-size:40px">${last?last.grade:'—'}</div><div style="flex:1"><div style="font-weight:600">${last?`Week ${last.week} · MAE ${last.mae.toFixed(2)} pts/player`:'No scored week yet'}</div><div class="sub">${last?(last.bestSrcMae==null?`Week ${last.week} is in progress (${last.n}/${last.total} scored) — grade and source comparison lock in once the week is complete. `:`Best single source was ${(last.bestSrc||'').toUpperCase()} at ${last.bestSrcMae.toFixed(2)}. The blend ${(last.skill||0)>=0?'beat it by':'lost to it by'} ${Math.abs(last.skill||0).toFixed(2)}. `)+` ${H.length>1?(last.mae<H[H.length-2].mae?'Improved on the week before.':'Worse than the week before.'):''}`:'Week 1 becomes the first data point once actuals load. Scale: A ≤4.0 · B ≤5.0 · C ≤6.0 · D ≤7.0. A + means the blend beat every single source; a − means one source alone would have done better.'}</div></div></div>

      <div class="note">The band is one standard deviation each way, so about two thirds of results should fall inside it. A position stuck well under 60% means its volatility constant is too low; well over 76%, too high. Only meaningful once a few weeks are in.</div></div>` })()}

  <h2>Accuracy — the only metric</h2><div class="card"><div class="sub" style="margin-bottom:6px">Mean absolute error of our weekly prediction vs. what actually happened, all rostered players plus the top 150. Lower is better. Each source is scored too, so the blend can lean on whoever is right.</div>${trend}</div>
  <h2>Learned dials</h2><div class="card">
    <div class="row"><span class="nm">Source weights<div class="sub">${Object.entries(MODEL.weights).map(([k,v])=>k.toUpperCase()+' '+v.toFixed(2)).join(' · ')}</div></span></div>
    <div class="row"><span class="nm">Matchup multipliers<div class="sub">${Object.entries(MODEL.mf).map(([k,v])=>k+' ×'+v.toFixed(2)).join(' · ')}</div></span></div>
    <div class="row"><span class="nm">Context &amp; weather scales<div class="sub">vacated opportunity ×${(MODEL.ctxScale==null?1:MODEL.ctxScale).toFixed(2)} · weather ×${(MODEL.wxScale==null?1:MODEL.wxScale).toFixed(2)} · implied team total ×${(MODEL.ttScale==null?1:MODEL.ttScale).toFixed(2)} — 1.00 means the rule is applied at full strength; the model turns each down if the effect doesn't show up in results</div></span></div>
    <div class="row"><span class="nm">Position bias<div class="sub">${Object.keys(MODEL.posBias).length?Object.entries(MODEL.posBias).map(([k,v])=>k+' '+(v>=0?'+':'')+(v*100).toFixed(0)+'%').join(' · '):'none yet — needs 10+ scored games at a position'}</div></span></div>
    <div class="row"><span class="nm">Player adjustments<div class="sub">${Object.entries(MODEL.playerAdj).filter(([k,v])=>v).length?Object.entries(MODEL.playerAdj).filter(([k,v])=>v).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([k,v])=>esc(k)+' '+(v>=0?'+':'')+(v*100).toFixed(0)+'%').join(' · '):'none yet — needs 3 straight weeks in the same direction'}</div></span></div>
  </div>
  <h2>This week's predictions</h2><div class="card"><div class="sub">${(DATA.ledger||{})[String(W.week)]?`<b style="color:var(--lime)">Frozen in this file ✓</b> — ${Object.keys(DATA.ledger[String(W.week)]).length} players locked before kickoff. The live numbers below may differ slightly if you've set ★ convictions; the frozen set is what gets graded.`:`<b style="color:var(--warn)">Not frozen yet</b> — copy this into DATA.ledger["${W.week}"] before kickoff, or run engine.js freeze.`}</div>
    <button class="btn on" data-act="copyledger" style="margin-top:8px">Copy predictions JSON</button><textarea id="ledger-out" style="width:100%;height:90px;margin-top:8px;background:var(--panel2);color:var(--muted);border:1px solid var(--line);border-radius:8px;font:11px var(--mono);padding:6px">${esc(JSON.stringify(snap))}</textarea></div>
  <h2>How it learns</h2><div class="card"><div class="note" style="margin:0">Four dials, all rule-based and capped so one weird week can't wreck it. Injuries are not errors: a player who left hurt or didn't play is recorded as blank, not zero, and never counts against a source or starts a player streak. Any single miss is capped at 20 points before it's scored. <b>Source weights</b>: each source's error is tracked; the blend leans toward whoever has been closest, recent weeks weighted more. From Week 3, actual points-per-game joins as a source. <b>Matchup multipliers</b>: if "A" matchups have actually delivered +9% not +15%, the A dial moves toward +9%, max 4% per week. <b>Position bias</b>: if we're 8% high on tight ends across the league, tight ends get trimmed, max 3% per week. <b>Player adjustments</b>: three straight weeks beating or missing the number in the same direction earns a capped nudge, half the size of the miss. <b>Context &amp; weather</b>: when a teammate is out, 65% of a pass-catcher's projection (75% of a back's) is redistributed to the players who inherit the work, capped at +25% (+60% for a backup running back). Wind, rain, snow and cold apply research-based multipliers — a sprinkle is worth 1%, a 20-mph wind is worth 13%. Both are tracked in the ledger; if adjusted players don't actually deliver the adjustment, the scale turns down. Your ★ convictions sit on top of all this and are never overwritten.</div></div>`;
  el.innerHTML=h }

/* ---------- rosters editor ---------- */
let RQ='',RT=null,CQ='';
function renderRosters(){ const el=document.getElementById('v-rosters'); const teams=Object.keys(R);
  let h=`<h2>Rosters <span class="pill">tap a team, then tap players to add</span></h2><div class="card"><div style="display:flex;gap:6px;flex-wrap:wrap">`+teams.map(t=>`<button class="btn ${RT===t?'on':''}" data-team="${esc(t)}">${esc(t)}${OWN[t]?' · '+esc(OWN[t]):''} (${R[t].length})${t===ME?' ★':''}</button>`).join('')+`<button class="btn" data-act="addteam">+ team</button></div>
  ${RT?`<div style="display:flex;gap:6px;margin-top:8px"><button class="btn" data-act="rename">Rename</button><button class="btn" data-act="setme">Mark as mine</button><button class="btn" data-act="owner">Owner</button><button class="btn r" data-act="delteam">Remove team</button></div>`:''}</div>`;
  if(RT){ h+=`<h2>${esc(RT)}</h2><div class="card">`+(R[RT].map(n=>byName[n]).filter(Boolean).sort((a,b)=>POS.indexOf(a.p)-POS.indexOf(b.p)||a.r-b.r).map(p=>`<div class="row">${chipNm(p)}<div class="sub">${p.t} · B${p.bye}</div></span><button class="btn r" data-rm="${esc(p.n)}">✕</button></div>`).join('')||'<div class="note">Empty.</div>')+`</div>
    <input type="search" id="r-search" placeholder="Add a player…" autocomplete="off" value="${esc(RQ)}"><div class="card" id="r-results" style="margin-top:6px">`+(RQ?P.filter(p=>p.n.toLowerCase().includes(RQ.toLowerCase())).slice(0,10).map(p=>`<div class="row">${chipNm(p)}<div class="sub">${p.t} · ${owner[p.n]?'on '+esc(owner[p.n]):'free agent'}</div></span><button class="btn g" data-add="${esc(p.n)}">+</button></div>`).join(''):'')+`</div>` }
  const convList=Object.keys(CONV).filter(n=>CONV[n]&&byName[n]).sort((a,b)=>CONV[b]-CONV[a]);
  h+=`<h2>My guys — your read on a player</h2><div class="card"><div class="note" style="margin:0 0 6px">+1 treats him like 6 spots better at his position, +2 like 12. −1/−2 the reverse. Moves the projection lens only — your lineup, waiver and trade <i>decisions</i> use it; the market number stays honest.</div>
    <input type="search" id="c-search" placeholder="Player to mark…" autocomplete="off" value="${esc(CQ)}"><div id="c-results">${CQ?P.filter(p=>p.n.toLowerCase().includes(CQ.toLowerCase())).slice(0,6).map(p=>`<div class="row">${chipNm(p)}<div class="sub">${p.t} · ${p.p}${p.pr}</div></span>${[-2,-1,1,2].map(v=>`<button class="btn ${CONV[p.n]===v?'on':''}" data-conv="${esc(p.n)}" data-v="${v}" style="min-width:36px;padding:7px 6px">${v>0?'+':''}${v}</button>`).join('')}</div>`).join(''):''}</div>
    ${convList.length?`<div style="margin-top:6px">${convList.map(n=>{const p=byName[n]; return `<div class="row"><span class="chip" style="background:${PC[p.p]}">${p.p}</span><span class="nm">${esc(n)}${MARK('',n)}<div class="sub">now valued like ${p.p}${convPr(p)} (was ${p.p}${p.pr})</div></span><button class="btn r" data-conv="${esc(n)}" data-v="0">✕</button></div>`}).join('')}</div>`:''}</div>`;
  const rsjRank=p=>P.filter(q=>q.p===p.p&&q.rsj!=null).sort((a,b)=>b.rsj-a.rsj).findIndex(q=>q.n===p.n)+1;
  const div=P.filter(p=>p.rsj!=null&&['QB','RB','WR','TE'].includes(p.p)).map(p=>({p,gap:p.pr-rsjRank(p),mr:rsjRank(p)})).filter(x=>Math.abs(x.gap)>=8).sort((a,b)=>b.gap-a.gap);
  h+=`<h2>Hidden value — where the trade market and the projections disagree</h2><div class="card"><div class="note" style="margin:0 0 6px">Trade market (RSJ) rank vs. the projection blend. A big positive gap means people are already paying more for him than the rankings justify — buy before the rankings catch up, or sell into it.</div>${div.slice(0,10).map(x=>`<div class="row">${chipNm(x.p)}${MARK(x.p.risk,x.p.n)}<div class="sub">${owner[x.p.n]?'on '+esc(owner[x.p.n]):'free agent'} · projections ${x.p.p}${x.p.pr} · market ${x.p.p}${x.mr}</div></span><span class="num pos">+${x.gap}</span></div>`).join('')}</div>
  <div class="card" style="margin-top:6px"><div class="sub" style="margin-bottom:4px">Market is OUT on these (projections higher than the trade market)</div>${div.slice(-6).reverse().map(x=>`<div class="row">${chipNm(x.p)}<div class="sub">${owner[x.p.n]?'on '+esc(owner[x.p.n]):'free agent'} · projections ${x.p.p}${x.p.pr} · market ${x.p.p}${x.mr}</div></span><span class="num neg">${x.gap}</span></div>`).join('')}</div>`;
  h+=`<div class="note" style="margin-top:12px">Edits save on this phone. <button class="btn" data-act="resetR">Reset to file</button></div>`; el.innerHTML=h;
  const cs=document.getElementById('c-search'); if(cs){cs.addEventListener('input',e=>{CQ=e.target.value; renderRosters(); const n=document.getElementById('c-search'); n.focus(); n.setSelectionRange(CQ.length,CQ.length)})}
  const s=document.getElementById('r-search'); if(s){s.addEventListener('input',e=>{RQ=e.target.value; renderRosters(); const n=document.getElementById('r-search'); n.focus(); n.setSelectionRange(RQ.length,RQ.length)})} }

/* ---------- events ---------- */
let view='week'; const render=()=>{document.querySelectorAll('section').forEach(s=>s.classList.toggle('hide',s.id!=='v-'+view)); document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===view)); ({week:renderWeek,draft:renderDraft,trade:renderTrade,rank:renderRank,match:renderMatch,brain:renderBrain,rosters:renderRosters})[view]()};
document.addEventListener('click',e=>{ const b=e.target.closest('button'); const row=e.target.closest('[data-tr]');
  if(row){ const arr=T[row.dataset.tr]; const n=row.dataset.n; const i=arr.indexOf(n); i>-1?arr.splice(i,1):arr.push(n); return renderTrade() }
  const cardL=e.target.closest('[data-load]'); if(!b&&cardL&&FOUND){const f=FOUND[+cardL.dataset.load]; T={partner:f.t,give:f.give.slice(),get:f.get.slice()}; return renderTrade()}
  if(!b)return; const d=b.dataset;
  if(d.v){view=d.v; return render()} if(d.rkpos){RKPOS=d.rkpos; return renderRank()} if(d.rkmode){RKMODE=d.rkmode; return renderRank()} if(d.mpos){MPOS=d.mpos; return renderMatch()} if(d.act==='copyledger'){const t=document.getElementById('ledger-out'); t.select(); try{document.execCommand('copy')}catch(e){} return} if(d.team){RT=d.team; return renderRosters()}
  if(d.add){ if(RT&&!R[RT].includes(d.add)){ for(const t in R)R[t]=R[t].filter(x=>x!==d.add); R[RT].push(d.add); reindex(); saveR() } return renderRosters() }
  if(d.rm){ R[RT]=R[RT].filter(x=>x!==d.rm); reindex(); saveR(); return renderRosters() }
  if(d.conv!==undefined){ const v=+d.v; if(v)CONV[d.conv]=v; else delete CONV[d.conv]; saveConv(); recompute(); recomputeTV(); return renderRosters() }
  if(d.act==='addteam'){const n=prompt('Team name'); if(n&&!R[n]){R[n]=[]; RT=n; saveR()} return renderRosters()}
  if(d.act==='rename'){const n=prompt('New name',RT); if(n&&n!==RT&&!R[n]){R[n]=R[RT]; delete R[RT]; if(OWN[RT]){OWN[n]=OWN[RT]; delete OWN[RT]} if(ME===RT)ME=n; RT=n; reindex(); saveR()} return renderRosters()}
  if(d.act==='owner'){const n=prompt('Owner name for '+RT,OWN[RT]||''); if(n!=null){OWN[RT]=n; saveR()} return renderRosters()}
  if(d.act==='setme'){ME=RT; saveR(); return renderRosters()}
  if(d.act==='delteam'&&confirm('Remove '+RT+'?')){delete R[RT]; RT=null; reindex(); saveR(); return renderRosters()}
  if(d.act==='resetR'&&confirm('Discard your local roster edits?')){R=JSON.parse(JSON.stringify(DATA.rosters)); ME=Object.keys(R)[0]; reindex(); try{localStorage.removeItem(KEY)}catch(e){} return renderRosters()}
  if(d.act==='t-clear'){T={partner:T.partner,give:[],get:[]}; return renderTrade()}
  if(d.act==='t-swap'){T={partner:T.partner,give:T.get.slice(),get:T.give.slice()}; return renderTrade()}
  if(d.act==='find'){FOUND=findTrades(); return renderTrade()}
  const card=e.target.closest('[data-load]'); if(card){const f=FOUND[+card.dataset.load]; T={partner:f.t,give:f.give.slice(),get:f.get.slice()}; return renderTrade()} });
document.addEventListener('change',e=>{ if(e.target.id==='t-partner'){T.partner=e.target.value||null; T.get=[]; renderTrade()} if(e.target.id==='w-opp'){OPP[W.week]=e.target.value; try{localStorage.setItem('seasonhq2026:opp',JSON.stringify(OPP))}catch(x){} renderWeek()} if(e.target.id==='t-need'){NEED=e.target.value; FOUND=findTrades(); renderTrade()} });
document.getElementById('ver').textContent=`file ${DATA.version} · week ${W.week}`; render();
</script>
</body></html>
