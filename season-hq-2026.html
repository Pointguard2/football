</style><style>
/* ---- 2026-09-15 shared refresh: additive only, never removes a rule above.
   Keeps each app's own accent; adds reserved status colours, a consistent
   type scale, roomier cards and 44px tap targets. Status colour is never the
   only signal — .res always carries a word. ---- */
:root{--accent:var(--lime);--won:#3DDC84;--lost:#FF4F5E;--push:#FFB020;--open:#8A97A3;--r:14px;--pad:14px}
body{line-height:1.35}
main{padding:0 16px}
h2{margin:26px 0 10px}h2:first-child{margin-top:18px}
.card{border-radius:var(--r);padding:var(--pad);margin-bottom:10px}
.row{gap:10px;padding:10px 2px}
.sub{font-size:12px;margin-top:3px;line-height:1.4}
.note{font-size:12.5px;line-height:1.5;margin:10px 0 0}
.pos{color:var(--won)}.neg{color:var(--lost)}
.tab{min-height:44px}
.btn{min-height:44px;padding:10px 14px;color:var(--chalk)}
.btn.on{background:var(--accent);color:#0A0D11;border-color:var(--accent);font-weight:700}
input[type=search],input[type=text],select{min-height:44px;padding:12px}
.grid{gap:7px 12px}.grid>div{min-height:22px;display:flex;align-items:center}
.k{font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.seg{gap:8px;margin:8px 0 12px}
/* hero number */
.stat{font:700 30px/1 var(--disp);letter-spacing:.01em}
.statlab{font:12px var(--body);color:var(--muted);margin-top:5px}
.statrow{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.statrow>div:last-child{text-align:right}
/* result pill — word first, colour second */
.res{display:inline-flex;align-items:center;gap:5px;font:700 11px var(--disp);letter-spacing:.07em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid;white-space:nowrap}
.res.won{color:var(--won);border-color:rgba(61,220,132,.45);background:rgba(61,220,132,.1)}
.res.lost{color:var(--lost);border-color:rgba(255,79,94,.45);background:rgba(255,79,94,.1)}
.res.push{color:var(--push);border-color:rgba(255,176,32,.45);background:rgba(255,176,32,.1)}
.res.open{color:var(--open);border-color:var(--line);background:var(--panel2)}
.tag{display:inline-block;font:700 10px var(--disp);letter-spacing:.09em;text-transform:uppercase;padding:3px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted);background:var(--panel2);white-space:nowrap}
.tag.real{color:var(--accent);border-color:currentColor}
.bet{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.bet:last-child{border-bottom:0}
.bet .who{flex:1;min-width:0}.bet .pick{font-size:15px;font-weight:600;line-height:1.35}
.bet .rt{flex:0 0 auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.bet .amt{font:700 15px var(--mono)}

/* ===== v2 shell · clearer hierarchy, progressive disclosure =================
   Rules followed: bottom bar holds 3–5 top-level views (overflow → More);
   every card answers first and explains on tap; disclosure never nests
   more than two deep. Colour still never carries meaning on its own. */
body{padding-bottom:calc(86px + env(safe-area-inset-bottom))}
details>summary{list-style:none}
details>summary::-webkit-details-marker{display:none}

/* ---- header: one compact identity block, nothing that wraps ---- */
header{background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;align-items:flex-start}
.brand{font:700 21px/1 var(--disp);letter-spacing:.04em}
.brand i{color:var(--accent);font-style:normal}
.tagline{font:600 9px/1.3 var(--body);letter-spacing:.14em;color:var(--muted);margin-top:6px;text-transform:uppercase}

/* ---- freshness strip: is this data current? one line, tap for the rest ---- */
#fresh{position:sticky;top:0;z-index:39;background:var(--bg);padding:2px 12px 8px;border-bottom:1px solid var(--line)}
.fresh{display:flex;align-items:center;gap:9px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:42px;font:12.5px var(--body);color:var(--muted);cursor:pointer}
.fresh b{color:var(--chalk);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--won)}
.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.freshmore{font:11.5px/1.85 var(--mono);color:var(--muted);padding:9px 13px 4px}
.freshmore b{color:var(--chalk)}
.caret{flex:0 0 auto;color:var(--muted);font-size:11px;transition:transform .15s}
details[open]>summary .caret{transform:rotate(180deg)}

/* ---- in-card disclosure: the reasoning, on demand ---- */
details.dis{border-top:1px solid var(--line);margin-top:11px}
details.dis>summary{display:flex;align-items:center;gap:7px;min-height:42px;padding-top:10px;cursor:pointer;font:700 11px var(--disp);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
details.dis[open]>summary{color:var(--accent)}
.disbody{padding:0 0 10px}
.disbody .note{margin-top:8px}

/* ---- week accordion ---- */
details.wk{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:9px}
details.wk[open]{border-color:rgba(180,255,60,.3)}
details.wk>summary{display:flex;align-items:center;gap:12px;padding:13px var(--pad);min-height:60px;cursor:pointer}
.wkname{font:700 16px var(--disp);letter-spacing:.03em;flex:0 0 auto;min-width:62px}
.wkmeta{flex:1;min-width:0}
.wkamt{font:700 16px var(--mono);flex:0 0 auto;text-align:right}
.wkbody{padding:0 var(--pad) 6px;border-top:1px solid var(--line)}

/* ---- filters: one scrolling row, the rest folded away ---- */
.chiprow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -12px 9px;padding:1px 12px 1px}
.chiprow::-webkit-scrollbar{display:none}
.chiprow .btn{flex:0 0 auto;min-height:38px;padding:8px 14px;white-space:nowrap}
details.filt{margin:0 0 12px}
details.filt>summary{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:9px 14px;min-height:40px;cursor:pointer;font:600 12px var(--body);color:var(--muted)}
details.filt[open]>summary{border-color:var(--accent);color:var(--accent)}
.filtbody{padding:11px 0 2px}
.filtlab{font:700 10px var(--disp);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 7px}

/* ---- prop card: answer first ---- */
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);margin-bottom:9px}
.pcard.hot{border-color:rgba(180,255,60,.42);background:var(--panel2)}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pname{font-size:15.5px;font-weight:600;line-height:1.25}
.ppick{font-size:15px;font-weight:600;margin-top:9px;line-height:1.35}
.pmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:9px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12.5px;color:var(--muted)}
.kv b{color:var(--chalk);font-weight:600}

/* ---- 5-tab bar, icon + label ---- */
.tabs{background:var(--bg);padding:5px 4px calc(5px + env(safe-area-inset-bottom));gap:2px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:7px 4px;font-size:9.5px;letter-spacing:.05em}
.tab svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{background:none;color:var(--accent);font-weight:700}

/* ---- More menu + sub-view back ---- */
.mitem{display:flex;align-items:center;gap:13px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px var(--pad);margin-bottom:9px;text-align:left;min-height:66px}
.mitem .mt{font:700 14px var(--disp);letter-spacing:.04em;text-transform:uppercase}
.mitem .ms{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.back{display:inline-flex;align-items:center;gap:7px;background:none;border:0;color:var(--muted);font:700 11px var(--disp);letter-spacing:.07em;text-transform:uppercase;padding:12px 2px 0;min-height:44px}
.empty{text-align:center;padding:30px 12px}
.empty .verdict{color:var(--muted)}

/* ---- contest / entry rows (DFS Results) ---- */
.ent{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.ent:last-child{border-bottom:0}
.ent .who{flex:1;min-width:0}
.ent .rt{flex:0 0 auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.site{font:700 10px var(--disp);letter-spacing:.07em;padding:3px 7px;border-radius:5px;color:#0A0D11}
.site.dk{background:#53a300}.site.fd{background:#1493ff}
.lane{display:grid;grid-template-columns:1fr auto auto;gap:7px 12px;align-items:center}
.lane>div{min-height:22px;display:flex;align-items:center}
/* ---- charts: tip of the iceberg. One picture per card, the numbers stay under the details. ---- */
.ch{display:block;width:100%;height:auto;margin-top:8px}
.chleg{display:flex;flex-wrap:wrap;gap:5px 14px;font:11px var(--mono);color:var(--muted);margin-top:8px}
.chleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chtitle{font:700 11px var(--disp);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:12px}
</style></head><body>

  const out={}, used=new Set(); POS.forEach(pos=>{out[pos]=[]; for(let i=0;i<(DATA.slots[pos]||0);i++){const c=pl.find(x=>!used.has(x.p.n)&&x.p.p===pos); if(c){out[pos].push(c);used.add(c.p.n)}}});
  out.FLEX=[]; for(let i=0;i<DATA.slots.FLEX;i++){const c=pl.find(x=>!used.has(x.p.n)&&FLEXOK.includes(x.p.p)); if(c){out.FLEX.push(c);used.add(c.p.n)}}
  out.BN=pl.filter(x=>!used.has(x.p.n)); out.total=Object.keys(out).filter(k=>k!=='BN'&&k!=='total').reduce((s,k)=>s+out[k].reduce((a,x)=>a+x.v,0),0); return out }

/* ---------- trade finder ---------- */
function gradeMe(d){return d>=18?'A':d>=11?'B':d>=5?'C':'D'}
function findTrades(){
  const wr=wireRepl(); const myVal=p=>Math.max(0,p.season-wr[p.p]); const theirVal=p=>Math.max(0,espnVal(p));
  const mine=R[ME].map(n=>byName[n]).filter(p=>p&&!['K','DST'].includes(p.p));
  const base=lineup(R[ME],myVal).total; const out=[];
  for(const t of Object.keys(R)){ if(t===ME||!R[t].length)continue;
    const theirs=R[t].map(n=>byName[n]).filter(p=>p&&!['K','DST'].includes(p.p));
    const tb=lineup(R[t],myVal).total, tbE=lineup(R[t],theirVal).total;
    const tryTrade=(give,get)=>{
      if(get.some(p=>p.risk==='fade'||['O','IR','SUSP','PUP'].includes(W.status[p.n])))return;   // never recommend acquiring a flagged player
      const g=give.map(p=>p.n), r=get.map(p=>p.n);
      const my2=lineup(R[ME].filter(n=>!g.includes(n)).concat(r),myVal).total-base;
      if(NEED){ const wantPos=POS.includes(NEED); const hit=wantPos?get.some(p=>p.p===NEED):get.some(p=>p.n===NEED); if(!hit)return; if(my2<-2)return; } else if(my2<4)return;
      const tAfter=R[t].filter(n=>!r.includes(n)).concat(g);
      const th=lineup(tAfter,myVal).total-tb, thE=lineup(tAfter,theirVal).total-tbE;
      const rawE=get.reduce((a,p)=>a+theirVal(p),0)-give.reduce((a,p)=>a+theirVal(p),0); // ESPN-lens raw swap, from their side it's -rawE
      if(thE<-6&&rawE>8)return;                       // they'd see a clear loss on their own board
      const acc=(th>=-6&&thE>=-2)?'Fair to both':(thE>=0)?'Wins on optics':(thE>=-4||rawE<=8)?'Possible':'Unlikely';
      out.push({t,give:g,get:r,my:my2,th,thE,acc,grade:gradeMe(my2)}) };
    for(const a of mine){ for(const x of theirs){ if(a.p===x.p&&Math.abs(a.r-x.r)<6)continue; tryTrade([a],[x]) } }
    for(let i=0;i<mine.length;i++)for(let j=i+1;j<mine.length;j++)for(const x of theirs) tryTrade([mine[i],mine[j]],[x]);
    for(const a of mine)for(let i=0;i<theirs.length;i++)for(let j=i+1;j<theirs.length;j++) tryTrade([a],[theirs[i],theirs[j]]);
  }
  const rank={'Fair to both':0,'Wins on optics':1,Possible:2,Unlikely:3};
  return out.sort((a,b)=>(rank[a.acc]-rank[b.acc])||(b.my-a.my)).filter((x,i,arr)=>{ const main=g=>g.map(n=>byName[n]).sort((a,b)=>a.r-b.r)[0].n; const k=x.t+'|'+main(x.get)+'|'+main(x.give); return arr.findIndex(y=>y.t+'|'+main(y.get)+'|'+main(y.give)===k)===i })
  .filter((x,i,arr)=>arr.slice(0,i).filter(y=>y.t===x.t).length<3).slice(0,12) }

/* ---------- variance model (for win probability and boom/bust) ---------- */
const VOL={QB:0.42,RB:0.5,WR:0.53,TE:0.5,LB:0.36,DL:0.63,DB:0.42,K:0.48,DST:0.75};
function sdOf(p,pred){ let v=(p.prof&&p.prof.cr)?Math.min(1,Math.max(.2,p.prof.cr)):(VOL[p.p]||.5); if(p.risk==='inj')v*=1.3; if(p.epr&&Math.abs(p.epr-p.pr)>=8)v*=1.2; if(p.spread>=3)v*=1.1; return pred*v }
const PROFTAG=p=>{ if(!p.prof)return''; const c=p.prof.cr; const tag=c<=.4?'steady':c<=.55?'normal':c<=.7?'volatile':'boom/bust'; const sat=p.prof.sat3!=null?p.prof.sat3:p.prof.sat, gp=p.prof.gp3!=null?p.prof.gp3:p.prof.gp; const inj=(sat!=null&&gp)?Math.round(100*sat/(gp+sat)):null; const shape=(p.prof.star!=null)?` · ${p.prof.star}★ ${p.prof.stiff}✕ of ${p.prof.gp}`:''; return ` <span class="pill" style="color:${c<=.4?'var(--lime)':c>.7?'var(--warn)':'var(--muted)'}">${tag} ·${c.toFixed(2)}</span>${inj!=null&&inj>=10?` <span class="pill" style="color:${inj>=20?'var(--bad)':'var(--warn)'}">missed ${inj}% (23–25)</span>`:''}` };
const Phi=z=>{ const t=1/(1+.2316419*Math.abs(z)); const d=.3989423*Math.exp(-z*z/2); let pr=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274)))); return z>=0?1-pr:pr };
let OPP={}; try{OPP=JSON.parse(localStorage.getItem('seasonhq2026:opp')||'{}')}catch(e){}
function renderWeek(){ const el=document.getElementById('v-week'); if(!R[ME]||!R[ME].length){el.innerHTML=`<h2>Week ${W.week}</h2><div class="card">Load your roster in the Rosters tab.</div>`;return}
  const ACT=(DATA.actuals||{})[String(W.week)]||{}; const played=n=>ACT[n]!==undefined; const liveVal=p=>played(p.n)?(ACT[p.n]==null?0:ACT[p.n]):weekPts(p);
  const L=lineup(R[ME],liveVal); const starters=Object.keys(L).filter(k=>k!=='BN'&&k!=='total').flatMap(k=>L[k].map(x=>({k,x})));

  const cardL=e.target.closest('[data-load]'); if(!b&&cardL&&FOUND){const f=FOUND[+cardL.dataset.load]; T={partner:f.t,give:f.give.slice(),get:f.get.slice()}; return renderTrade()}
  if(!b)return; const d=b.dataset;
  if(d.v){view=d.v; return render()} if(d.rkpos){RKPOS=d.rkpos; return renderRank()} if(d.rkmode){RKMODE=d.rkmode; return renderRank()} if(d.mpos){MPOS=d.mpos; return renderMatch()} if(d.act==='copyledger'){const t=document.getElementById('ledger-out'); t.select(); try{document.execCommand('copy')}catch(e){} return} if(d.team){RT=d.team; return renderRosters()}
  if(d.add){ if(RT&&!R[RT].includes(d.add)){ for(const t in R)R[t]=R[t].filter(x=>x!==d.add); R[RT].push(d.add); reindex(); saveR() } return renderRosters() }
  if(d.rm){ R[RT]=R[RT].filter(x=>x!==d.rm); reindex(); saveR(); return renderRosters() }
  if(d.conv!==undefined){ const v=+d.v; if(v)CONV[d.conv]=v; else delete CONV[d.conv]; saveConv(); recompute(); recomputeTV(); return renderRosters() }
  if(d.act==='addteam'){const n=prompt('Team name'); if(n&&!R[n]){R[n]=[]; RT=n; saveR()} return renderRosters()}
  if(d.act==='rename'){const n=prompt('New name',RT); if(n&&n!==RT&&!R[n]){R[n]=R[RT]; delete R[RT]; if(OWN[RT]){OWN[n]=OWN[RT]; delete OWN[RT]} if(ME===RT){ME=n; MESET=true} RT=n; reindex(); saveR()} return renderRosters()}
  if(d.act==='owner'){const n=prompt('Owner name for '+RT,OWN[RT]||''); if(n!=null){OWN[RT]=n; saveR()} return renderRosters()}
  if(d.act==='setme'){ME=RT; MESET=true; saveR(); return renderRosters()}
  if(d.act==='delteam'&&confirm('Remove '+RT+'?')){delete R[RT]; RT=null; reindex(); saveR(); return renderRosters()}
  if(d.act==='resetR'&&confirm('Discard your local roster edits?')){R=JSON.parse(JSON.stringify(DATA.rosters)); OWN=JSON.parse(JSON.stringify(DATA.owners||{})); ME=resolveME(R,OWN); MESET=false; reindex(); try{localStorage.removeItem(KEY)}catch(e){} return renderRosters()}
  if(d.act==='t-clear'){T={partner:T.partner,give:[],get:[]}; return renderTrade()}
  if(d.act==='t-swap'){T={partner:T.partner,give:T.get.slice(),get:T.give.slice()}; return renderTrade()}
  if(d.act==='find'){FOUND=findTrades(); return renderTrade()}
  const card=e.target.closest('[data-load]'); if(card){const f=FOUND[+card.dataset.load]; T={partner:f.t,give:f.give.slice(),get:f.get.slice()}; return renderTrade()} });
document.addEventListener('change',e=>{ if(e.target.id==='t-partner'){T.partner=e.target.value||null; T.get=[]; renderTrade()} if(e.target.id==='w-opp'){OPP[W.week]=e.target.value; try{localStorage.setItem('seasonhq2026:opp',JSON.stringify(OPP))}catch(x){} renderWeek()} if(e.target.id==='t-need'){NEED=e.target.value; FOUND=findTrades(); renderTrade()} });
renderFresh(); render();
</script>
