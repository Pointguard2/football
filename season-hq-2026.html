</style><style>
/* ---- 2026-09-15 shared refresh: additive only, never removes a rule above.
   Keeps each app's own accent; adds reserved status colours, a consistent
   type scale, roomier cards and 44px tap targets. Status colour is never the
   only signal — .res always carries a word. ---- */
:root{--accent:var(--lime);--won:#3DDC84;--lost:#FF4F5E;--push:#FFB020;--open:#8A97A3;--r:14px;--pad:14px}
body{line-height:1.35}
main{padding:0 16px}
h2{margin:26px 0 10px}h2:first-child{margin-top:18px}
.card{border-radius:var(--r);padding:var(--pad);margin-bottom:10px}
.row{gap:10px;padding:10px 2px}
.sub{font-size:12px;margin-top:3px;line-height:1.4}
.note{font-size:12.5px;line-height:1.5;margin:10px 0 0}
.pos{color:var(--won)}.neg{color:var(--lost)}
.tab{min-height:44px}
.btn{min-height:44px;padding:10px 14px;color:var(--chalk)}
.btn.on{background:var(--accent);color:#0A0D11;border-color:var(--accent);font-weight:700}
input[type=search],input[type=text],select{min-height:44px;padding:12px}
.grid{gap:7px 12px}.grid>div{min-height:22px;display:flex;align-items:center}
.k{font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.seg{gap:8px;margin:8px 0 12px}
/* hero number */
.stat{font:700 30px/1 var(--disp);letter-spacing:.01em}
.statlab{font:12px var(--body);color:var(--muted);margin-top:5px}
.statrow{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.statrow>div:last-child{text-align:right}
/* result pill — word first, colour second */
.res{display:inline-flex;align-items:center;gap:5px;font:700 11px var(--disp);letter-spacing:.07em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid;white-space:nowrap}
.res.won{color:var(--won);border-color:rgba(61,220,132,.45);background:rgba(61,220,132,.1)}
.res.lost{color:var(--lost);border-color:rgba(255,79,94,.45);background:rgba(255,79,94,.1)}
.res.push{color:var(--push);border-color:rgba(255,176,32,.45);background:rgba(255,176,32,.1)}
.res.open{color:var(--open);border-color:var(--line);background:var(--panel2)}
.tag{display:inline-block;font:700 10px var(--disp);letter-spacing:.09em;text-transform:uppercase;padding:3px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted);background:var(--panel2);white-space:nowrap}
.tag.real{color:var(--accent);border-color:currentColor}
.bet{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.bet:last-child{border-bottom:0}
.bet .who{flex:1;min-width:0}.bet .pick{font-size:15px;font-weight:600;line-height:1.35}
.bet .rt{flex:0 0 auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.bet .amt{font:700 15px var(--mono)}

/* ===== v2 shell · clearer hierarchy, progressive disclosure =================
   Rules followed: bottom bar holds 3–5 top-level views (overflow → More);
   every card answers first and explains on tap; disclosure never nests
   more than two deep. Colour still never carries meaning on its own. */
body{padding-bottom:calc(86px + env(safe-area-inset-bottom))}
details>summary{list-style:none}
details>summary::-webkit-details-marker{display:none}

/* ---- header: one compact identity block, nothing that wraps ---- */
header{background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;align-items:flex-start}
.brand{font:700 21px/1 var(--disp);letter-spacing:.04em}
.brand i{color:var(--accent);font-style:normal}
.tagline{font:600 9px/1.3 var(--body);letter-spacing:.14em;color:var(--muted);margin-top:6px;text-transform:uppercase}

/* ---- freshness strip: is this data current? one line, tap for the rest ---- */
#fresh{position:sticky;top:0;z-index:39;background:var(--bg);padding:2px 12px 8px;border-bottom:1px solid var(--line)}
.fresh{display:flex;align-items:center;gap:9px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:42px;font:12.5px var(--body);color:var(--muted);cursor:pointer}
.fresh b{color:var(--chalk);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--won)}
.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.freshmore{font:11.5px/1.85 var(--mono);color:var(--muted);padding:9px 13px 4px}
.freshmore b{color:var(--chalk)}
.caret{flex:0 0 auto;color:var(--muted);font-size:11px;transition:transform .15s}
details[open]>summary .caret{transform:rotate(180deg)}

/* ---- in-card disclosure: the reasoning, on demand ---- */
details.dis{border-top:1px solid var(--line);margin-top:11px}
details.dis>summary{display:flex;align-items:center;gap:7px;min-height:42px;padding-top:10px;cursor:pointer;font:700 11px var(--disp);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
details.dis[open]>summary{color:var(--accent)}
.disbody{padding:0 0 10px}
.disbody .note{margin-top:8px}

/* ---- week accordion ---- */
details.wk{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:9px}
details.wk[open]{border-color:rgba(180,255,60,.3)}
details.wk>summary{display:flex;align-items:center;gap:12px;padding:13px var(--pad);min-height:60px;cursor:pointer}
.wkname{font:700 16px var(--disp);letter-spacing:.03em;flex:0 0 auto;min-width:62px}
.wkmeta{flex:1;min-width:0}
.wkamt{font:700 16px var(--mono);flex:0 0 auto;text-align:right}
.wkbody{padding:0 var(--pad) 6px;border-top:1px solid var(--line)}

/* ---- filters: one scrolling row, the rest folded away ---- */
.chiprow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -12px 9px;padding:1px 12px 1px}
.chiprow::-webkit-scrollbar{display:none}
.chiprow .btn{flex:0 0 auto;min-height:38px;padding:8px 14px;white-space:nowrap}
details.filt{margin:0 0 12px}
details.filt>summary{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:9px 14px;min-height:40px;cursor:pointer;font:600 12px var(--body);color:var(--muted)}
details.filt[open]>summary{border-color:var(--accent);color:var(--accent)}
.filtbody{padding:11px 0 2px}
.filtlab{font:700 10px var(--disp);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 7px}

/* ---- prop card: answer first ---- */
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);margin-bottom:9px}
.pcard.hot{border-color:rgba(180,255,60,.42);background:var(--panel2)}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pname{font-size:15.5px;font-weight:600;line-height:1.25}
.ppick{font-size:15px;font-weight:600;margin-top:9px;line-height:1.35}
.pmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:9px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12.5px;color:var(--muted)}
.kv b{color:var(--chalk);font-weight:600}

/* ---- 5-tab bar, icon + label ---- */
.tabs{background:var(--bg);padding:5px 4px calc(5px + env(safe-area-inset-bottom));gap:2px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:7px 4px;font-size:9.5px;letter-spacing:.05em}
.tab svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{background:none;color:var(--accent);font-weight:700}

/* ---- More menu + sub-view back ---- */
.mitem{display:flex;align-items:center;gap:13px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px var(--pad);margin-bottom:9px;text-align:left;min-height:66px}
.mitem .mt{font:700 14px var(--disp);letter-spacing:.04em;text-transform:uppercase}
.mitem .ms{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.back{display:inline-flex;align-items:center;gap:7px;background:none;border:0;color:var(--muted);font:700 11px var(--disp);letter-spacing:.07em;text-transform:uppercase;padding:12px 2px 0;min-height:44px}
.empty{text-align:center;padding:30px 12px}
.empty .verdict{color:var(--muted)}

/* ---- contest / entry rows (DFS Results) ---- */
.ent{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.ent:last-child{border-bottom:0}
.ent .who{flex:1;min-width:0}
.ent .rt{flex:0 0 auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.site{font:700 10px var(--disp);letter-spacing:.07em;padding:3px 7px;border-radius:5px;color:#0A0D11}
.site.dk{background:#53a300}.site.fd{background:#1493ff}
.lane{display:grid;grid-template-columns:1fr auto auto;gap:7px 12px;align-items:center}
.lane>div{min-height:22px;display:flex;align-items:center}
/* ---- charts: tip of the iceberg. One picture per card, the numbers stay under the details. ---- */
.ch{display:block;width:100%;height:auto;margin-top:8px}
.chleg{display:flex;flex-wrap:wrap;gap:5px 14px;font:11px var(--mono);color:var(--muted);margin-top:8px}
.chleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chtitle{font:700 11px var(--disp);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:12px}
.why1{font:12.5px/1.45 var(--body);color:var(--muted);margin-top:5px;padding-left:9px;border-left:2px solid #B08CFF}
/* ---- Trade lab (2026-10-01) ---- */
.tlg{display:grid;grid-template-columns:minmax(0,1fr) repeat(8,30px);gap:3px;align-items:center;padding:3px 2px;border-radius:8px;cursor:pointer}
.tlg.tlh{cursor:default;font:700 10px var(--disp);letter-spacing:.06em;color:var(--muted);text-align:center}
.tlg.me .tln{color:var(--accent)}.tlg.on{background:var(--panel2);outline:1px solid var(--accent)}
.tln{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tlc{display:flex;flex-direction:column;align-items:center;justify-content:center;height:30px;border-radius:6px;font:600 12px var(--mono);color:var(--chalk);line-height:1}
.tlc i{font-style:normal;font-size:9px;color:var(--chalk);opacity:.85;letter-spacing:-1px;margin-top:1px}
.tlpick{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 10px 5px 6px;margin:0 6px 6px 0;font-size:13px;font-weight:600;cursor:pointer;min-height:34px}
#v-trade .row[data-tx]{cursor:pointer}
#v-trade .card[data-tx]{cursor:pointer}
#v-trade .nm .sub{white-space:normal}

</style></head><body>

/* ---------- value model ----------
   Season PPR projection from positional rank (calibrated to typical finishes),
   then value-over-replacement for a 10-team league with your slots. */
function seasonPts(p){ return p.proj!=null?p.proj:ENGINE.seasonPts(p) }
const REPL={QB:12,RB:25,WR:25,TE:11,LB:12,DL:12,DB:12,K:11,DST:11};
const replPts={}; POS.forEach(pos=>{const real=P.filter(x=>x.p===pos&&x.proj!=null).sort((a,b)=>b.proj-a.proj)[REPL[pos]-1]; replPts[pos]=real?real.proj:seasonPts({p:pos,pr:REPL[pos]})});
function vor(p){const v=(p.season!=null?p.season:seasonPts(p))-replPts[p.p]; const rk=p.risk==='inj'?.9:p.risk==='fade'?.85:1; return v*rk}
/* ---------- conviction: your read, -2..+2, applied to the projection lens only ---------- */
let CONV={}; try{ CONV=JSON.parse(localStorage.getItem('seasonhq2026:conv')||'{}') }catch(e){}
function saveConv(){ try{localStorage.setItem('seasonhq2026:conv',JSON.stringify(CONV))}catch(e){} }
const convPr=p=>Math.max(1,p.pr-6*(CONV[p.n]||0));       // +1 = treated like 6 spots better at his position
function recompute(){ P.forEach(p=>{ const c=CONV[p.n]||0; p.season=p.proj!=null?p.proj*(1+.08*c):seasonPts({p:p.p,pr:convPr(p)}); p.vor=vor(p) }) }
recompute();
/* the other side of the table judges by ESPN's board, not ours */
POS.forEach(pos=>{ const l=P.filter(p=>p.p===pos&&p.espn).sort((a,b)=>a.espn-b.espn); l.forEach((p,i)=>p.epr=i+1); });
function espnVal(p){ const q={p:p.p,pr:p.epr||p.pr}; const v=(p.proj!=null&&!p.epr)?p.proj:seasonPts(q); return v-replPts[p.p] }
/* replacement level = what's actually sitting on the waiver wire */
/* ---------- aggregate trade value ---------- */
/* market lens: season points above a deep positional floor (what trade charts measure), not lineup VOR */
const FLOOR={QB:24,RB:45,WR:55,TE:22,LB:30,DL:30,DB:30,K:14,DST:14};
const floorPts={}; POS.forEach(pos=>{floorPts[pos]=seasonPts({p:pos,pr:FLOOR[pos]})});
const mkt=(pos,pr)=>Math.max(0,seasonPts({p:pos,pr})-floorPts[pos]);
function ffVal(p){ if(!p.ff)return null; return mkt(p.p,parseInt(p.ff.replace(/[A-Z]+/,''))) }
const MAXV={}; function lenses(p){ return { proj:p.proj!=null?Math.max(0,p.season-floorPts[p.p]):mkt(p.p,convPr(p)), espn:p.epr?mkt(p.p,p.epr):null, ff:p.ff?ffVal(p):null, rsj:p.rsj!=null?p.rsj:null } }
function recomputeTV(){ ['proj','espn','ff','rsj'].forEach(k=>{ MAXV[k]=Math.max(...P.map(p=>lenses(p)[k]||0)) }); P.forEach(p=>{ p.tv=tv(p).agg }) } recomputeTV();
function tv(p){ const L=lenses(p); const vals=Object.keys(L).filter(k=>L[k]!=null).map(k=>100*L[k]/MAXV[k]); const agg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0; return {agg, n:vals.length, L} }
function wireRepl(){ const owned=new Set(Object.values(R).flat()); const out={}; POS.forEach(pos=>{const fa=P.filter(p=>p.p===pos&&!owned.has(p.n)).sort((a,b)=>b.season-a.season)[0]; out[pos]=fa?fa.season:replPts[pos]}); return out }

const SCH=(DATA.schedule||{})[String(W.week)]||{}; const DVP=DATA.dvp||{};
function oppOf(p){ const o=SCH[p.t]; return o?o.replace('vs ','').replace('@',''):null }
function dvpRank(p){ const o=oppOf(p); const pos=['QB','RB','WR','TE'].includes(p.p)?p.p:null; return (o&&pos&&DVP[o])?DVP[o][pos]:null }
function autoGrade(p){ if(W.matchup[p.n])return W.matchup[p.n]; const r=dvpRank(p); if(r==null)return null; return r<=6?'A':r<=12?'B':r<=20?'C':r<=26?'D':'F' } const SF={Q:.85,D:.4,O:0,IR:0,SUSP:0,PUP:0};
const GP=Object.keys(DATA.actuals||{}).length; const MAPS=ENGINE.contextMaps(DATA); function weekPts(p){ return ENGINE.predict(p,{M:MODEL,W,grade:autoGrade,seasonPts,replPts,gamesPlayed:GP,maps:MAPS}).pred }

  out.BN=pl.filter(x=>!used.has(x.p.n)); out.total=Object.keys(out).filter(k=>k!=='BN'&&k!=='total').reduce((s,k)=>s+out[k].reduce((a,x)=>a+x.v,0),0); return out }
const teamScore=t=>{const L=lineup(R[t]||[],p=>Math.max(0,p.vor)); return L.total + .3*L.BN.reduce((a,x)=>a+x.v,0)};

/* ---------- draft analyzer ---------- */

/* ---------- trade finder ---------- */
function gradeMe(d){return d>=18?'A':d>=11?'B':d>=5?'C':'D'}
function findTrades(){
  const wr=wireRepl(); const myVal=p=>Math.max(0,p.season-wr[p.p]); const theirVal=p=>Math.max(0,espnVal(p));
  const mine=R[ME].map(n=>byName[n]).filter(p=>p&&!['K','DST'].includes(p.p));
  const base=lineup(R[ME],myVal).total; const out=[];
  for(const t of Object.keys(R)){ if(t===ME||!R[t].length)continue;
    const theirs=R[t].map(n=>byName[n]).filter(p=>p&&!['K','DST'].includes(p.p));
    const tb=lineup(R[t],myVal).total, tbE=lineup(R[t],theirVal).total;
    const tryTrade=(give,get)=>{
      if(get.some(p=>p.risk==='fade'||['O','IR','SUSP','PUP'].includes(W.status[p.n])))return;   // never recommend acquiring a flagged player
      const g=give.map(p=>p.n), r=get.map(p=>p.n);
      const my2=lineup(R[ME].filter(n=>!g.includes(n)).concat(r),myVal).total-base;
      if(NEED){ const wantPos=POS.includes(NEED); const hit=wantPos?get.some(p=>p.p===NEED):get.some(p=>p.n===NEED); if(!hit)return; if(my2<-2)return; } else if(my2<4)return;
      const tAfter=R[t].filter(n=>!r.includes(n)).concat(g);
      const th=lineup(tAfter,myVal).total-tb, thE=lineup(tAfter,theirVal).total-tbE;
      const rawE=get.reduce((a,p)=>a+theirVal(p),0)-give.reduce((a,p)=>a+theirVal(p),0); // ESPN-lens raw swap, from their side it's -rawE
      if(thE<-6&&rawE>8)return;                       // they'd see a clear loss on their own board
      const acc=(th>=-6&&thE>=-2)?'Fair to both':(thE>=0)?'Wins on optics':(thE>=-4||rawE<=8)?'Possible':'Unlikely';
      out.push({t,give:g,get:r,my:my2,th,thE,acc,grade:gradeMe(my2)}) };
    for(const a of mine){ for(const x of theirs){ if(a.p===x.p&&Math.abs(a.r-x.r)<6)continue; tryTrade([a],[x]) } }
    for(let i=0;i<mine.length;i++)for(let j=i+1;j<mine.length;j++)for(const x of theirs) tryTrade([mine[i],mine[j]],[x]);
    for(const a of mine)for(let i=0;i<theirs.length;i++)for(let j=i+1;j<theirs.length;j++) tryTrade([a],[theirs[i],theirs[j]]);
  }
  const rank={'Fair to both':0,'Wins on optics':1,Possible:2,Unlikely:3};
  return out.sort((a,b)=>(rank[a.acc]-rank[b.acc])||(b.my-a.my)).filter((x,i,arr)=>{ const main=g=>g.map(n=>byName[n]).sort((a,b)=>a.r-b.r)[0].n; const k=x.t+'|'+main(x.get)+'|'+main(x.give); return arr.findIndex(y=>y.t+'|'+main(y.get)+'|'+main(y.give)===k)===i })
  .filter((x,i,arr)=>arr.slice(0,i).filter(y=>y.t===x.t).length<3).slice(0,12) }

  h+=`<h2>Build a trade</h2><select id="t-partner">${teams.filter(t=>t!==ME).map(t=>`<option ${T.partner===t?'selected':''}>${esc(t)}</option>`).join('')}</select>

/* ---------- brain: accuracy ledger + learned dials ---------- */

  const owned=new Set(Object.values(R).flat()); const snap={}; P.filter(p=>owned.has(p.n)||p.r<=150).forEach(p=>{const r=ENGINE.predict(p,{M:MODEL,W,grade:autoGrade,seasonPts,replPts,gamesPlayed:GP,maps:MAPS}); snap[p.n]={pred:+r.pred.toFixed(2),src:Object.fromEntries(Object.entries(r.src).map(([k,v])=>[k,+v.toFixed(2)])),grade:r.grade,mf:r.mf,pos:p.p}});
  const trend=H.length?H.map(h=>`<div class="row"><span class="rk">W${h.week}</span><span class="nm">MAE <b>${h.mae.toFixed(2)}</b> pts${h.partial?` <span class="pill" style="color:var(--warn)">in progress · ${h.n}/${h.total} scored</span>`:''} <div class="sub">${Object.entries(h.srcMae).map(([k,v])=>k+' '+v.toFixed(2)).join(' · ')} · n=${h.n}</div></span><span class="num ${H.length>1&&h.mae<H[H.length-2].mae?'pos':''}">${h.mae.toFixed(1)}</span></div>`).join(''):'<div class="note">No completed weeks yet. Week 1 becomes the first data point once actuals are loaded.</div>';

  const board=Object.entries(lb).map(([k,v])=>({k,mae:v.s/v.w,n:v.n,wt:MODEL.weights[k]||0,benched:(MODEL.benched||[]).includes(k)})).sort((a,b)=>a.mae-b.mae);
  const paperHtml=(()=>{ const PW=DATA.paper||{}; const wks=Object.keys(PW).sort((a,b)=>b-a); if(!wks.length) return '';
    const lu=(title,F,wk)=>{ if(!F||!F.slots) return ''; const A=(DATA.actuals||{})[wk]||{}; let act=0,n=0,pend=0; F.slots.forEach(o=>{ if(!o.n) return; if(A[o.n]!==undefined){ act+=A[o.n]==null?0:A[o.n]; n++ } else pend++ }); const done=n>0&&pend===0; const diff=done?+(act-F.proj).toFixed(1):null;
      return `<details class="pl"><summary><div class="row"><span class="nm">${title}<div class="sub">${F.slots.filter(o=>o.n).slice(0,3).map(o=>esc(o.n)).join(' · ')} … <b>tap to expand</b></div></span><span class="num">${n?act.toFixed(1):'—'}<div class="sub">proj ${F.proj}${pend&&n?' · '+pend+' pending':''}</div></span><span class="num ${diff==null?'':diff>=0?'pos':'neg'}">${diff==null?'<span class="sub">'+(n?'in progress':'pending')+'</span>':(diff>=0?'+':'')+diff}</span></div></summary><div class="plbody">${F.slots.map(o=>{ const a=o.n?A[o.n]:undefined; return `<div class="row"><span class="chip" style="background:${PC[o.slot]||'var(--muted)'}">${o.slot}</span><span class="nm">${o.n?esc(o.n):'<i>empty</i>'}<div class="sub">${o.n&&byName[o.n]?byName[o.n].t:''}</div></span><span class="num ${a===undefined||o.pred==null?'':(a==null?0:a)>=o.pred?'pos':'neg'}">${a!==undefined?(a==null?'inj':a):(o.pred!=null?o.pred.toFixed(1):'—')}<div class="sub">${a!==undefined?'proj '+(o.pred!=null?o.pred.toFixed(1):'—'):'proj'}</div></span></div>` }).join('')}</div></details>` };
    return `<h2>Paper lineups <span class="pill">frozen before kickoff</span></h2><div class="note" style="margin:0 0 8px">Three lineups frozen each week and scored against real results: the app's optimal lineup from your roster, the lineup you actually set on ESPN, and your opponent's &mdash; plus, in violet, the Saturday reasoning pass's own pick when it made one. The question each week: did the app's start/sit calls beat yours?</div>`+(()=>{ /* actual points per lineup, oldest week left. The white tick on each bar is what it projected — bar above the tick beat its number. */
      const tot=(F,wk)=>{ if(!F) return null; const A=(DATA.actuals||{})[wk]||{}; let act=0,n=0,pend=0; F.slots.forEach(o=>{ if(!o.n) return; if(A[o.n]!==undefined){ act+=A[o.n]==null?0:A[o.n]; n++ } else pend++ }); return n&&!pend?{act:+act.toFixed(1),proj:F.proj}:null };
      const asc=wks.slice().sort((a,b)=>a-b); const cols={opt:'var(--lime)',mine:'#4DA3FF',opp:'#FFA53D',rs:RCOL}; const anyR=asc.some(w=>PW[w].reasoned);
      const groups=asc.map(w=>{ const R0=PW[w]; const o=tot(R0.optimal,w), m=tot(R0.mine,w), p=tot(R0.oppSet||R0.oppOptimal,w); return {vals:[{v:o&&o.act,mark:o&&o.proj,color:cols.opt,name:'App optimal'},{v:m&&m.act,mark:m&&m.proj,color:cols.mine,name:'Your set'},{v:p&&p.act,mark:p&&p.proj,color:cols.opp,name:'Opponent'}].concat(anyR?(()=>{ const r=tot(R0.reasoned,w); return [{v:r&&r.act,mark:r&&r.proj,color:cols.rs,name:'Reasoned'}] })():[])} });
      if(!groups.some(g=>g.vals.some(v=>v.v!=null))) return '';
      const beat=asc.map(w=>{ const R0=PW[w]; const o=tot(R0.optimal,w), m=tot(R0.mine,w); return o&&m?o.act-m.act:null }).filter(v=>v!=null);
      return `<div class="card"><div class="chtitle">Actual points, lineup by lineup</div>${CH.bars({groups,cats:asc.map(w=>'W'+w),h:170,yf:v=>String(Math.round(v)),m:{l:40}})}${CH.legend([{name:'app optimal',color:cols.opt},{name:'your set',color:cols.mine},{name:'opponent',color:cols.opp}].concat(anyR?[{name:'reasoned',color:cols.rs}]:[]))}<div class="note">The white tick is what each lineup projected; a bar above its tick beat its own number. ${beat.length?(()=>{ const avg=beat.reduce((a,b)=>a+b,0)/beat.length; return 'The app\'s lineup finished ahead of the one you set in '+(beat.filter(v=>v>0).length)+' of '+beat.length+' week'+(beat.length===1?'':'s')+', and '+(avg>=0?'ahead':'behind')+' by '+Math.abs(avg).toFixed(1)+' points a week on average.' })():''}</div></div>` })()+wks.map(w=>{ const R0=PW[w]; return `<div class="card" style="padding:2px 8px"><div class="sub" style="margin:6px 0">Week ${w} · frozen ${(R0.frozenAt||'').slice(0,16).replace('T',' ')}</div>${lu('App optimal',R0.optimal,w)}${lu('Your set',R0.mine,w)||'<div class="note" style="margin:4px 0">Your set lineup not captured this week (Saturday task writes myset.txt).</div>'}${lu((R0.opp?esc(R0.opp.split(' ')[0]):'Opp')+(R0.oppSet?' set':' optimal'),R0.oppSet||R0.oppOptimal,w)}${R0.reasoned?lu('<span style="color:'+RCOL+'">Reasoned</span>',R0.reasoned,w)+(R0.reasoned.why?'<div class="why1" style="margin:0 0 8px">'+esc(R0.reasoned.why)+'</div>':''):''}</div>` }).join('')+(()=>{ /* every week's waiver calls, graded by what each add and drop has scored since */
      const ww=Object.keys(DATA.waivers||{}).filter(w=>((DATA.waivers[w]||{}).moves||[]).length).sort((a,b)=>b-a); if(!ww.length) return '';
      return `<h2>Waiver calls <span class="pill">graded since the call</span></h2><div class="note" style="margin:0 0 8px">Each Tuesday's add/drop advice, scored by what the player added has put up since minus what the player dropped has. Advice, not a record of moves you made.</div>`+ww.map(w=>`<div class="card" style="padding:4px var(--pad)"><div class="sub" style="margin:6px 0">Week ${w}</div>${waiverRows(w,true)}</div>`).join('') })() })();
  let h=paperHtml+`<h2>Last week's grade</h2><div class="card top" style="display:flex;gap:14px;align-items:center"><div class="grade" style="font-size:40px">${last?last.grade:'—'}</div><div style="flex:1"><div style="font-weight:600">${last?`Week ${last.week} · MAE ${last.mae.toFixed(2)} pts/player`:'No scored week yet'}</div><div class="sub">${last?(last.bestSrcMae==null?`Week ${last.week} is in progress (${last.n}/${last.total} scored) — grade and source comparison lock in once the week is complete. `:`Best single source was ${(last.bestSrc||'').toUpperCase()} at ${last.bestSrcMae.toFixed(2)}. The blend ${(last.skill||0)>=0?'beat it by':'lost to it by'} ${Math.abs(last.skill||0).toFixed(2)}. `)+` ${H.length>1?(last.mae<H[H.length-2].mae?'Improved on the week before.':'Worse than the week before.'):''}`:'Week 1 becomes the first data point once actuals load. Scale: A ≤4.0 · B ≤5.0 · C ≤6.0 · D ≤7.0. A + means the blend beat every single source; a − means one source alone would have done better.'}</div></div></div>
  ${(()=>{ /* every graded player-week: what we said against what happened. On the diagonal it was right; the spread is the whole story of how hard this is. */
    const rows=[]; Object.entries(DATA.ledger||{}).forEach(([wk,L])=>{ const A=(DATA.actuals||{})[wk]||{}; Object.entries(L).forEach(([n,e])=>{ const p=byName[n]; const a=A[n]; if(!p||a==null||e.pred==null) return; rows.push({n,wk,pos:p.p,pred:e.pred,act:a,grade:e.grade}) }) });
    if(rows.length<15) return '';
    const lastWk=Math.max(...rows.map(r=>+r.wk)); const R1=rows.filter(r=>+r.wk===lastWk);
    const pts=R1.map(r=>({x:r.pred,y:r.act,color:PC[r.pos]||'var(--muted)',title:r.n+' W'+r.wk+': said '+r.pred.toFixed(1)+', got '+r.act}));
    const posIn=POS.filter(k=>R1.some(r=>r.pos===k)); const mae=R1.reduce((a,r)=>a+Math.min(20,Math.abs(r.act-r.pred)),0)/R1.length; const over=R1.filter(r=>r.act>r.pred).length;
    /* the matchup grade check: does an A matchup actually deliver more than its number, and an F less? One dot per grade, actual minus predicted. */

  ${(()=>{ /* range check: do actuals land inside the floor–ceiling band as often as they should? */

    const all=stat(rows); const verdict=all.inside>=60&&all.inside<=76?'bands are honest':all.inside>76?'bands are too wide — ranges could be tighter':'bands are too narrow — more lands outside than should';

  <h2>Source leaderboard</h2><div class="card" style="padding:2px 8px">${board.length?board.map((b,i)=>`<div class="row"><span class="rk">${i+1}</span><span class="nm">${b.k.toUpperCase()}${b.benched?' <span class="pill" style="color:var(--bad)">BENCHED</span>':i===0?' <span class="pill" style="color:var(--lime)">LEADING</span>':''}<div class="sub">rolling MAE ${b.mae.toFixed(2)} · ${b.n} wk · trust ${b.wt.toFixed(2)}</div></span><span class="num">${b.mae.toFixed(1)}</span></div>`).join(''):`<div class="note">Sources in the blend now: ${Object.keys(MODEL.weights).filter(k=>MODEL.weights[k]>0).map(k=>k.toUpperCase()).join(', ')} (PPG joins from Week 3). Each is scored separately once a week is complete. A source that runs 50% worse than the blend for three straight weeks is benched — still scored in the background, so it comes back if it recovers.</div>`}</div>

/* ===================== TRADE LAB (2026-10-01) =====================
   Rest-of-season trade analysis. Reads DATA.trade (written by trade.js: full schedule, nflverse usage + xFP, FantasyCalc market)
   plus what the app already holds (weekly source projections, learned weights, statuses, DvP, rosters). Fetches nothing.
   The core number is the change in each team's OPTIMAL STARTING LINEUP, week by week through week 17, playoff weeks weighted
   ×1.2 — the method RotoWire's analyzer and the published trade-finder literature use. That makes 2-for-1s, byes and depth
   price themselves; no fudge factor. The market (FantasyCalc, built from real trades) is shown beside it as the "will they
   say yes" lens, never as the decision. Every constant that is a judgement call lives in TLK so it is one edit away. */
const TLK={
  blend:{consensus:.70, usage:.20, actual:.10, idpActual:.25, noWeekly:.45},   // ROS per-game: weekly source consensus / usage xFP / actual PPG; actual + usage scale in with games played (full at 3)
  sosMax:.15, sosShrink:.25,          // DvP rank swings ±15%, shrunk 75% toward zero: schedule strength is weakly predictive (12-game splits correlate .05–.18)
  avail:{Q:[.7],D:[.05,.6],O:[0,.5,.85],IR:[0,0,0,0,.5],PUP:[0,0,0,0,.5],SUSP:[0,.5]}, irAfter:.9,   // P(plays) by week from today's status. Q 71.5% / D 5% are measured (2017–22); the O and IR paths are judgement
  likely:{gain:.5, mkt:-.10}, coin:{gain:-.3, mkt:-.25},   // acceptance labels (pts/wk to THEIR starters, market change for THEM as a share)
  winwinPenalty:.25                   // finder score = gA + gB − .25·|gA − gB| (arXiv 2511.17535)

const TL=(()=>{
  const TD=DATA.trade||{}; const CUR=+W.week; const LAST=17;

    let keys=Object.keys(src).filter(k=>src[k]!=null&&(M.weights[k]||0)>0&&!ben.has(k));
    if(st){ const ref=Math.max(src.ngs||0,base*.8); keys=keys.filter(k=>src[k]>=.6*ref) }
    const bw=M.weights.base||.16; let num=base*bw, den=bw; keys.forEach(k=>{ num+=src[k]*M.weights[k]; den+=M.weights[k] });
    return {v:num/den, n:keys.length, base} }
  /* K and D/ST have no nflverse usage line: their actual comes from the league's own graded weeks */
  function appgFromActuals(p){ let s=0,n=0; for(const w in (DATA.actuals||{})){ const a=DATA.actuals[w][p.n]; if(typeof a==='number'&&+w!==p.bye){ s+=a; n++ } } return n?{ppg:s/n,gp:n}:null }
  function ros(p){ if(cache['r'+p.n]) return cache['r'+p.n];
    const c=cons(p); const u=USE[p.n]; const B=TLK.blend; const parts=[{k:'consensus',v:c.v,w:c.n?B.consensus:B.noWeekly}];
    let gp=0, ppg=null, xppg=null;
    if(u&&u.gp){ gp=u.gp; ppg=u.ppg; xppg=u.xppg??null } else if(['K','DST'].includes(p.p)){ const a=appgFromActuals(p); if(a){ gp=a.gp; ppg=a.ppg } }

  function sos(p,w){ if(!OFF.includes(p.p)) return 1; const o=oppOfW(p,w); const r=o&&DVP[o]?DVP[o][p.p]:null; if(r==null) return 1; return 1+TLK.sosShrink*TLK.sosMax*(16.5-r)/15.5 }

  function vec(n){ const k='v'+n; if(cache[k]) return cache[k]; const p=byName[n]; if(!p) return cache[k]=WEEKS.map(()=>0);

  function wkLineup(names,i,keep){ const pl=[]; for(const n of names){ const p=byName[n]; if(p) pl.push([n,p.p,vec(n)[i]]) } pl.sort((a,b)=>b[2]-a[2]);

  function team(names,keep){ let s=0; const per=[]; const by={}; const startW={};

      if(keep){ for(const g in L.by){ by[g]=(by[g]||0)+L.by[g].reduce((a,x)=>a+x[2],0)*WT[i]; L.by[g].forEach(x=>startW[x[0]]=(startW[x[0]]||0)+WT[i]) } } });

  function fid(n){ let i=FID[n]; if(i!=null) return i; const p=byName[n]; if(!p) return -1; i=FPOS.length; FID[n]=i; FPOS.push(PI[p.p]); FVEC.push(Float64Array.from(vec(n))); return i }
  const usedBuf=new Uint8Array(64);
  function teamFast(ids){ let s=0; const m=ids.length;
    for(let w=0;w<WEEKS.length;w++){ usedBuf.fill(0,0,m); let tot=0;
      for(let q=0;q<9;q++){ for(let k=NEED[q];k>0;k--){ let bi=-1,bv=-1; for(let j=0;j<m;j++){ if(usedBuf[j]||FPOS[ids[j]]!==q) continue; const v=FVEC[ids[j]][w]; if(v>bv){bv=v;bi=j} } if(bi<0) break; usedBuf[bi]=1; tot+=bv } }
      for(let k=FLX;k>0;k--){ let bi=-1,bv=-1; for(let j=0;j<m;j++){ const q=FPOS[ids[j]]; if(usedBuf[j]||q<1||q>3) continue; const v=FVEC[ids[j]][w]; if(v>bv){bv=v;bi=j} } if(bi<0) break; usedBuf[bi]=1; tot+=bv }

    return s/WSUM }
  function quick(a,b,give,get){ const ka='q'+a, kb='q'+b; const A0=cache[ka]||(cache[ka]=(R[a]||[]).map(fid).filter(i=>i>=0)), B0=cache[kb]||(cache[kb]=(R[b]||[]).map(fid).filter(i=>i>=0));
    const g=give.map(fid), t=get.map(fid); const A1=A0.filter(i=>!g.includes(i)).concat(t), B1=B0.filter(i=>!t.includes(i)).concat(g);
    const a0=cache['Q'+a]??(cache['Q'+a]=teamFast(A0)), b0=cache['Q'+b]??(cache['Q'+b]=teamFast(B0)); return {gA:teamFast(A1)-a0, gB:teamFast(B1)-b0} }
  /* ---- roster limits: 17 active + up to 2 IR for players listed IR/PUP/O; never stricter than the roster already is ---- */
  const ACTIVE=Object.entries(DATA.slots).filter(([k])=>k!=='IR').reduce((a,[,v])=>a+v,0), IRS=DATA.slots.IR||0;
  const cap=names=>ACTIVE+Math.min(IRS,names.filter(n=>['IR','PUP','O'].includes(W.status[n])).length);
  const owned=()=>new Set(Object.values(R).flat());
  function faTop(){ if(cache.fa) return cache.fa; const own=owned(); const out=[];
    POS.forEach(pos=>{ P.filter(p=>p.p===pos&&!own.has(p.n)).map(p=>[p.n,rosTot(p.n)]).sort((a,b)=>b[1]-a[1]).slice(0,pos==='K'||pos==='DST'?1:3).forEach(x=>out.push(x[0])) });

  /* settle a post-trade roster: drop the lowest-value player when over the cap; fill a freed spot with the best free agent (the "waiver credit") */
  function settle(before,after){ let names=after.slice(); const drop=[], add=[]; const c=Math.max(cap(after),before.length>cap(before)?before.length:0);
    while(names.length>c){ const lo=names.filter(n=>!['IR','PUP'].includes(W.status[n])).sort((a,b)=>rosTot(a)-rosTot(b))[0]; if(!lo) break; names=names.filter(n=>n!==lo); drop.push(lo) }

/* ---------- acceptance: their starters and their market, never ours ---------- */
function tlAccept(r,give,get){ const mv=n=>TL.mval(byName[n]); const theyGet=give.map(mv), theyGive=get.map(mv);
  const known=theyGet.concat(theyGive).some(v=>v!=null&&v>0); const a=theyGet.reduce((s,v)=>s+(v||0),0), b=theyGive.reduce((s,v)=>s+(v||0),0);

  why.push(`their starters ${g>=0?'+':''}${g.toFixed(1)} pts/wk`); if(known) why.push(`market ${mk>=0?'+':''}${Math.round(mk*100)}% for them`); else why.push('no market price on these players');
  const L=TLK.likely, C=TLK.coin; const label=(g>=L.gain&&mk>=L.mkt)?'Likely':((g>=C.gain&&mk>=C.mkt)||mk>=.10||g>=1.5)?'Coin flip':'Long shot';
  return {label,why,mk,known} }
const ACCCOL={Likely:'var(--accent)','Coin flip':'var(--warn)','Long shot':'var(--bad)'};

const tlShort=t=>{ const w=String(OWN[t]||t).trim().split(/\s+/); const x=w[0].replace(/\.$/,'').length>1?w[0]:w[w.length-1]; return x.charAt(0).toUpperCase()+x.slice(1) };

/* labels under a CH.bars category axis, placed where CH puts each category */

/* ---------- small SVG ring: market split ---------- */

/* ---------- player line used everywhere ---------- */
function tlRow(p,opts){ opts=opts||{}; const r=TL.ros(p); const u=TL.USE[p.n]; const mv=TL.mval(p); const st=W.status[p.n];

/* ---------- player detail: every number behind the value ---------- */
function tlDetail(p){ const r=TL.ros(p); const u=TL.USE[p.n]; const fc=TL.FCV[p.n]; const L=[];

    if(TL.OFF.includes(p.p)) L.push(`Snaps ${wk.map(w=>u.wk[w].sn??'–').join('/')}% · targets ${wk.map(w=>u.wk[w].tg).join('/')}${u.tshare!=null?` (share ${Math.round(u.tshare*100)}%)`:''} · carries ${wk.map(w=>u.wk[w].ca).join('/')} · TDs ${u.td}`);
    else L.push(`Snaps ${wk.map(w=>u.wk[w].sn??'–').join('/')}% · tackles ${wk.map(w=>u.wk[w].tk).join('/')} · sacks ${u.skpg.toFixed(1)}/g`) }
  else L.push('No nflverse box score yet this season (did not play, or not matched).');
  if(fc) L.push(`Market (FantasyCalc) ${fc[0]} · ${p.p}${fc[2]} · 30-day ${fc[1]>=0?'+':''}${fc[1]}`); else if(TL.OFF.includes(p.p)) L.push(TL.hasMarket?'Not in the FantasyCalc list this file holds'+(TL.TD.fc&&TL.TD.fc.partial?` (top ${TL.TD.fc.n} only)`:'')+'.':'No market file loaded.');
  else L.push('No trade market exists for '+p.p+' — value is projection only.');
  if(TL.OFF.includes(p.p)){ const rows=TL.WEEKS.filter(w=>w>TL.CUR&&!TL.onBye(p,w)).map(w=>[w,TL.oppOfW(p,w),TL.oppOfW(p,w)&&DVP[TL.oppOfW(p,w)]?DVP[TL.oppOfW(p,w)][p.p]:null]);
    const avg=a=>{ const v=a.map(x=>x[2]).filter(x=>x!=null); return v.length?(v.reduce((s,x)=>s+x,0)/v.length).toFixed(1):'–' };
    L.push(`Schedule (DvP rank of opponent, 1 = softest): rest of season avg ${avg(rows)} · fantasy playoffs ${avg(rows.filter(x=>x[0]>=TL.PO.first))} — `+rows.filter(x=>x[0]>=TL.PO.first).map(x=>`P${x[0]} ${x[1]||'?'}`).join(', ')) }
  return `<div class="note" style="margin:6px 0 0;line-height:1.6">${L.join('<br>')}</div>` }

/* ---------- sub-views ---------- */
function tlTeam(){ const lg=TL.league(); const me=ME; const T=lg.T[me]; if(!T) return `<div class="card">Your team isn't in the rosters.</div>`;
  const gs=TL.GROUPS.filter(g=>DATA.slots[g]); const diff=gs.map(g=>T.slot[g]-lg.avg[g]);
  let h=`<div class="card top"><div class="statrow"><div><div class="stat">#${lg.trank[me]} <span style="font-size:15px;color:var(--muted)">of ${lg.teams.length}</span></div><div class="statlab">rest-of-season lineup strength</div></div>
    <div><div class="stat">${T.ppw.toFixed(1)}</div><div class="statlab">starter pts / wk · league ${ (lg.tot.reduce((a,x)=>a+x[1],0)/lg.tot.length).toFixed(1)}</div></div></div>
    <div class="sub" style="margin-top:8px">Weeks ${TL.CUR}–17 · fantasy playoffs (wk ${TL.PO.first}–${TL.PO.last}) count ×${TL.PO.weight}</div></div>`;

    ${tlAxis(gs.map(g=>{const rk=lg.rank[g][me]; return `${g==='FLEX'?'FX':g}<br><b style="color:${rk<=3?'var(--accent)':rk>=8?'var(--bad)':'var(--muted)'}">#${rk}</b>`}))}
    <div class="sub" style="margin-top:2px">Your starters minus the league-average starter, points per week. Rank of 10 under each.</div></div>`;
  const strong=gs.filter(g=>lg.rank[g][me]<=3), weak=gs.filter(g=>lg.rank[g][me]>=7);
  const who=g=>{ const n=Object.keys(T.start).filter(n=>T.start[n]>=.5&&(g==='FLEX'?FLEXOK.includes(byName[n].p):byName[n].p===g)); return n.slice(0,3).map(esc).join(', ') };
  h+=`<div class="card"><div class="sub" style="margin:0 0 4px">STRONG</div>${strong.length?strong.map(g=>`<div class="row"><span class="chip" style="background:${PC[g]||'var(--muted)'}">${g}</span><span class="nm">#${lg.rank[g][me]} · ${f1(T.slot[g]-lg.avg[g])}/wk<div class="sub">${who(g)}</div></span></div>`).join(''):'<div class="note">Nothing in the top three.</div>'}
    <div class="sub" style="margin:10px 0 4px">WEAK — where a trade helps most</div>${weak.length?weak.map(g=>`<div class="row"><span class="chip" style="background:${PC[g]||'var(--muted)'}">${g}</span><span class="nm">#${lg.rank[g][me]} · ${f1(T.slot[g]-lg.avg[g])}/wk<div class="sub">${who(g)||'—'}</div></span><button class="btn" data-tx="need" data-s="go" data-k="${g==='FLEX'?'':g}" style="min-height:36px;padding:6px 10px">Find</button></div>`).join(''):'<div class="note">No position ranks 7th or worse.</div>'}</div>`;
  /* week by week: where byes bite */
  const cats=TL.WEEKS.map(tlLab); h+=`<h2>Week by week</h2><div class="card">${CH.lines({cats,series:[{name:'league median',color:'var(--muted)',ys:lg.medWeek.map(v=>+v.toFixed(1)),width:1.5,dim:true,nodots:true,label:false},{name:'you',color:'var(--accent)',ys:T.per.map(v=>+v.toFixed(1)),width:2.5,label:false}],h:160})}${CH.legend([{name:'your lineup',color:'var(--accent)'},{name:'league median',color:'var(--muted)'}])}
    ${(()=>{ const avg=T.per.reduce((a,b)=>a+b,0)/T.per.length; const dips=TL.WEEKS.map((w,i)=>[w,T.per[i]]).filter(([w,v])=>w>TL.CUR&&v<avg*.9);
      return dips.length?`<div class="note">Dips: `+dips.map(([w,v])=>{ const out=R[me].filter(n=>byName[n]&&TL.onBye(byName[n],w)&&(T.start[n]||0)>=.5); return `wk ${w} ${v.toFixed(0)} pts${out.length?' ('+out.map(esc).join(', ')+' on bye)':''}` }).join(' · ')+`</div>`:'<div class="note">No week falls more than 10% below your average.</div>' })()}</div>`;
  const iw=TL.improved(me); if(iw.added.length) h+=`<h2>Free upgrade on waivers</h2><div class="card top">${iw.added.map((n,i)=>`<div class="row">${chipNm(byName[n])}<div class="sub">free agent · drop ${esc(iw.dropped[i])} (${TL.ros(byName[iw.dropped[i]]).v.toFixed(1)}/g)</div></span><span class="num pos">${TL.ros(byName[n]).v.toFixed(1)}</span></div>`).join('')}<div class="note">Worth <b class="pos">${f1(iw.gain)}</b> starter pts/wk before any trade. Every mock trade assumes both teams make their best pickup either way, so a deal is never credited with one.</div></div>`;

  h+=`<h2>Your trade chips</h2><div class="card">${chips.length?chips.map(n=>tlRow(byName[n])).join('')+`<div class="note">Bench players who would start for an average team at their position — value you are not using.</div>`:'<div class="note">No bench player here would start for an average team. Trades will be consolidation from your starters.</div>'}</div>`;

function tlLeague(){ const lg=TL.league(); const gs=['QB','RB','WR','TE','FLEX','LB','DL','DB'];
  const cell=(t,g)=>{ const rk=lg.rank[g][t]; const n=g==='FLEX'?0:((lg.surplus[t]||{})[g]||[]).length; const a=rk<=3?(.55-(rk-1)*.15):rk>=8?(.2+(rk-8)*.15):0; const col=rk<=3?`rgba(180,255,60,${a})`:rk>=8?`rgba(255,79,94,${a})`:'transparent';
    return `<span class="tlc" style="background:${col}">${rk}${n?'<i>'+'•'.repeat(Math.min(3,n))+'</i>':''}</span>` };
  let h=`<h2>League map</h2><div class="card" style="padding:10px 8px"><div class="tlg tlh"><span></span>${gs.map(g=>`<span>${g==='FLEX'?'FX':g}</span>`).join('')}</div>`+
    lg.tot.map(([t])=>`<div class="tlg ${t===ME?'me':''} ${TS.team===t?'on':''}" data-tx="team" data-k="${esc(t)}"><span class="tln">${lg.trank[t]}. ${esc(tlShort(t))}</span>${gs.map(g=>cell(t,g)).join('')}</div>`).join('')+
    `<div class="note">Rank of 10 by rest-of-season starter points at each spot (1 = best; green top 3, red bottom 3). Dots = tradeable surplus: bench players who would start for an average team. Tap a team.</div></div>`;
  const t=TS.team&&lg.T[TS.team]?TS.team:null;
  if(t&&t!==ME){ const sp=lg.surplus[t]||{}, mySp=lg.surplus[ME]||{}; const theirWeak=gs.filter(g=>lg.rank[g][t]>=7), myWeak=gs.filter(g=>lg.rank[g][ME]>=7);
    const fitA=myWeak.filter(g=>(sp[g]||[]).length), fitB=theirWeak.filter(g=>(mySp[g]||[]).length||lg.rank[g][ME]<=3);
    h+=`<div class="card top"><div style="font-weight:600">${esc(t)} <span class="sub">${esc(OWN[t]||'')}</span></div><div class="sub">#${lg.trank[t]} · ${lg.T[t].ppw.toFixed(1)} starter pts/wk · strong ${gs.filter(g=>lg.rank[g][t]<=3).join('/')||'—'} · weak ${theirWeak.join('/')||'—'}</div>
      ${Object.keys(sp).length?`<div class="sub" style="margin:10px 0 2px">THEIR SURPLUS</div>`+Object.values(sp).flat().map(n=>tlRow(byName[n])).join(''):'<div class="note">No tradeable surplus.</div>'}
      <div class="note">${fitA.length?`<b>They're heavy where you're thin:</b> ${fitA.join(', ')}. `:''}${fitB.length?`<b>They need what you have:</b> ${fitB.join(', ')}.`:''}${!fitA.length&&!fitB.length?'Little natural fit with your roster.':''}</div>
      <div style="display:flex;gap:6px;margin-top:10px"><button class="btn on" data-tx="trade-with" data-k="${esc(t)}">Mock a trade</button></div></div>` }
  else if(t===ME) h+=`<div class="card"><div class="note" style="margin:0">That's you — see My team.</div></div>`;
  h+=`<h2>Power ranking</h2><div class="card">${CH.bars({cats:lg.tot.map(()=>''),groups:lg.tot.map(([t,v])=>({vals:[{v:+v.toFixed(1),color:t===ME?'var(--accent)':'var(--muted)',name:t}]})),h:150})}${tlAxis(lg.tot.map(([t],i)=>`<span style="color:${t===ME?'var(--accent)':'var(--muted)'}">${i+1}<br>${esc(tlShort(t).slice(0,4))}</span>`))}<div class="sub">Rest-of-season starter points per week, playoff weeks ×${TL.PO.weight}. Not a record — schedule and luck are not in it.</div></div>`;
  return h }

function tlMock(){ const teams=Object.keys(R).filter(t=>t!==ME&&R[t].length); if(!TS.partner||!R[TS.partner]) TS.partner=teams[0];
  const lg=TL.league(); const side=TS.side; const roster=side==='give'?R[ME]:R[TS.partner];
  const pickedRow=(n,s)=>{ const p=byName[n]; return p?`<span class="tlpick" data-tx="pick" data-s="${s}" data-k="${esc(n)}"><span class="chip" style="background:${PC[p.p]};min-width:0;padding:2px 5px">${p.p}</span> ${esc(n)} ✕</span>`:'' };
  let h=`<div class="chiprow">${teams.map(t=>`<button class="btn ${TS.partner===t?'on':''}" data-tx="partner" data-k="${esc(t)}">${esc(tlShort(t))}</button>`).join('')}</div>
  <div class="card"><div class="sub" style="margin:0 0 4px">YOU GIVE</div><div>${TS.give.map(n=>pickedRow(n,'give')).join('')||'<span class="sub">tap players below</span>'}</div>
    <div class="sub" style="margin:10px 0 4px">YOU GET <span style="color:var(--chalk)">from ${esc(TS.partner)}</span></div><div>${TS.get.map(n=>pickedRow(n,'get')).join('')||'<span class="sub">tap players below</span>'}</div>
    ${TS.give.length||TS.get.length?`<div style="display:flex;gap:6px;margin-top:10px"><button class="btn" data-tx="clear">Clear</button></div>`:''}</div>`;
  h+=tlResult();
  h+=`<div class="chiprow" style="margin-top:6px"><button class="btn ${side==='give'?'on':''}" data-tx="side" data-k="give">My roster</button><button class="btn ${side==='get'?'on':''}" data-tx="side" data-k="get">${esc(tlShort(TS.partner))}'s roster</button></div>
  <input type="search" id="tl-q" placeholder="Find any rostered player…" autocomplete="off" value="${esc(TS.q)}"><div id="tl-qr"></div>
  <div class="card" style="padding:2px 8px;margin-top:8px">${roster.map(n=>byName[n]).filter(Boolean).sort((a,b)=>POS.indexOf(a.p)-POS.indexOf(b.p)||TL.ros(b).v-TL.ros(a).v).map(p=>tlRow(p,{sel:(side==='give'?TS.give:TS.get).includes(p.n),attr:`data-tx="pick" data-s="${side}" data-k="${esc(p.n)}"`})).join('')}</div>
  <div class="note">Right-hand number = rest-of-season points per game. Tap to add or remove. Search reaches every roster; picking another team's player switches the partner.</div>`;
  return h }

function tlResult(){ if(!TS.give.length&&!TS.get.length) return '';
  const r=TL.evalTrade(ME,TS.partner,TS.give,TS.get,true); const acc=tlAccept(r,TS.give,TS.get);
  const mv=n=>TL.mval(byName[n])||0; const mGive=TS.give.reduce((a,n)=>a+mv(n),0), mGet=TS.get.reduce((a,n)=>a+mv(n),0);
  const gA=r.gA, gB=r.gB; const verdict=gA>=1&&gB>=0?'Win-win on lineups':gA>=1?'Win for you':gA>=.3?'Small win for you':gA>-.3?(gB>.3?'Helps them, not you':'Even — decide on fit'):gA>-1?'Small loss for you':'Loss for you';
  const vcol=gA>=.3?'var(--accent)':gA>-.3?'var(--chalk)':'var(--bad)';
  let h=`<div class="card top"><div class="verdict" style="color:${vcol}">${verdict}</div>
    <div style="display:flex;align-items:center;gap:12px;margin-top:6px"><div style="flex:1">
      <div class="statrow" style="justify-content:flex-start;gap:22px"><div style="text-align:left"><div class="stat" style="color:${gA>=0?'var(--accent)':'var(--bad)'}">${f1(gA)}</div><div class="statlab">your starters, pts/wk</div></div>
      <div style="text-align:left"><div class="stat" style="font-size:22px;color:var(--muted)">${f1(gB)}</div><div class="statlab">theirs</div></div></div>
      <div style="margin-top:8px"><span class="res" style="color:${ACCCOL[acc.label]};border-color:currentColor">${acc.label}</span> <span class="sub">${acc.why.join(' · ')}</span></div></div>
      ${TL.hasMarket&&(mGive+mGet)>0?`<div style="flex:0 0 auto;text-align:center">${tlRing(mGive,mGet,Math.round(100*mGet/(mGive+mGet))+'%','market to you')}</div>`:''}</div>`;
  const cats=TL.WEEKS.map(tlLab);
  h+=`<div style="margin-top:8px">${CH.lines({cats,series:[{name:'now',color:'var(--muted)',ys:r.ta0.per.map(v=>+v.toFixed(1)),width:1.5,dim:true,label:false},{name:'after',color:'var(--accent)',ys:r.ta1.per.map(v=>+v.toFixed(1)),width:2.5,label:false}],h:140})}${CH.legend([{name:'your lineup after',color:'var(--accent)'},{name:'now',color:'var(--muted)'}])}</div>`;
  const deltas=TL.GROUPS.map(g=>[g,(r.ta1.slot[g]||0)-(r.ta0.slot[g]||0)]).filter(x=>Math.abs(x[1])>=.05);
  if(deltas.length) h+=`<div class="sub" style="margin-top:8px">${deltas.map(([g,d])=>`<b style="color:${d>0?'var(--accent)':'var(--bad)'}">${g} ${f1(d)}</b>`).join(' · ')}</div>`;
  const ia=TL.improved(ME), ib=TL.improved(TS.partner); const nw=(arr,base)=>arr.filter(n=>!base.includes(n));
  r.sa.add=nw(r.sa.add,ia.added); r.sa.drop=nw(r.sa.drop,ia.dropped); r.sb.add=nw(r.sb.add,ib.added); r.sb.drop=nw(r.sb.drop,ib.dropped);
  const moves=[]; if(r.sa.drop.length) moves.push('you drop '+r.sa.drop.map(esc).join(', ')); if(r.sa.add.length) moves.push('you add '+r.sa.add.map(esc).join(', ')+' off waivers'); if(r.sb.drop.length) moves.push('they drop '+r.sb.drop.map(esc).join(', ')); if(r.sb.add.length) moves.push('they add '+r.sb.add.map(esc).join(', '));
  if(moves.length) h+=`<div class="note">Roster spots: ${moves.join(' · ')} — already counted above.</div>`;
  /* counters: one player that fixes the side that loses */
  const ctr=tlCounter(r);
  if(ctr) h+=`<div class="note"><b>${ctr.title}</b> ${ctr.text}${ctr.apply?` <button class="btn" data-tx="counter" data-s="${ctr.side}" data-k="${esc(ctr.n)}" style="min-height:34px;padding:5px 10px;margin-left:4px">Add</button>`:''}</div>`;
  if(TL.TD.fc&&TL.TD.fc.partial&&(TS.give.concat(TS.get)).some(n=>TL.OFF.includes(byName[n].p)&&!TL.FCV[n])) h+=`<div class="note">Market caveat: this file holds FantasyCalc's top ${TL.TD.fc.n} only; players below it count as waiver-level (0) on the market ring.</div>`;
  h+=`<details class="dis"><summary>Every player in the deal</summary><div class="disbody">${TS.give.concat(TS.get).map(n=>byName[n]).filter(Boolean).map(tlDetail).join('<hr style="border:0;border-top:1px solid var(--line);margin:8px 0">')}</div></details>
  <details class="dis"><summary>How this is scored</summary><div class="disbody"><div class="note">Both rosters are re-optimised for every week from ${TL.CUR} to 17 — the best legal lineup each week from who is actually on the roster, byes and injury windows included — and the change in starting points is averaged per week, fantasy playoffs ×${TL.PO.weight}. Over the roster limit, the lowest-value player is dropped; a freed spot is filled with the best free agent; and both teams, before and after, are assumed to make their best waiver pickup anyway, so the deal only gets credit for what it changes. Week ${TL.CUR} uses the Week tab's own projection; later weeks use each player's rest-of-season per-game value (weekly source consensus ~70%, usage-based expected points ~20%, actual points ~10%, the last two scaling in over 3 games), times his chance to play from today's status, times a schedule factor shrunk 75% toward neutral because matchup strength barely predicts. The ring is the trade market — FantasyCalc's redraft values, built from real league trades — measured above the best free agent at each position. The label is from their side: their starters, then their market.</div></div></details></div>`;
  return h }

function tlCounter(r){ try{
  if(r.gB<0&&r.gA>0){ let best=null; for(const n of R[ME]){ if(TS.give.includes(n)) continue; const p=byName[n]; if(!p||['K','DST'].includes(p.p)) continue; const x=TL.evalTrade(ME,TS.partner,TS.give.concat(n),TS.get,false); if(x.gB>=0&&x.gA>0&&(!best||x.gA>best.gA)) best={n,gA:x.gA,gB:x.gB} }
    return best?{title:'To get a yes:',text:`add ${esc(best.n)} — they go to ${f1(best.gB)}, you keep ${f1(best.gA)} pts/wk.`,apply:true,side:'give',n:best.n}:{title:'Hard sell:',text:'no single bench add from you makes their lineup better without erasing your gain.'} }
  if(r.gA<0&&TS.get.length){ let best=null; for(const n of R[TS.partner]){ if(TS.get.includes(n)) continue; const p=byName[n]; if(!p||['K','DST'].includes(p.p)) continue; const x=TL.evalTrade(ME,TS.partner,TS.give,TS.get.concat(n),false); if(x.gA>=0&&(!best||x.gB>best.gB)) best={n,gA:x.gA,gB:x.gB} }
    return best?{title:'Ask for more:',text:`adding ${esc(best.n)} puts you at ${f1(best.gA)} and them at ${f1(best.gB)} pts/wk.`,apply:true,side:'get',n:best.n}:null } }catch(e){} return null }

function tlFind(){ const needs=['','QB','RB','WR','TE','LB','DL','DB'];
  let h=`<div class="chiprow">${needs.map(k=>`<button class="btn ${TS.need===k?'on':''}" data-tx="need" data-k="${k}">${k||'Any upgrade'}</button>`).join('')}</div>
    <button class="btn on" data-tx="find" style="width:100%">Search every team</button>
    <div class="note">Checks every 1-for-1, 2-for-1 and 1-for-2 with all nine teams, scores both lineups week by week, then re-checks the best with roster limits and waiver fills.</div>`;
  if(TS.found){ const F=TS.found; const card=(f,i)=>{ const col=ACCCOL[f.acc.label]; return `<div class="card" data-tx="load" data-k="${i}"><div style="display:flex;gap:10px;align-items:center"><div style="flex:1;min-width:0">
      <div style="font-weight:600;white-space:normal">${f.give.map(esc).join(' + ')} <span style="color:var(--muted)">for</span> ${f.get.map(esc).join(' + ')}</div>
      <div class="sub">with ${esc(tlShort(f.t))} · you <b style="color:var(--accent)">${f1(f.gA)}</b> · them ${f1(f.gB)} pts/wk · <b style="color:${col}">${f.acc.label}</b>${f.acc.known?` · market ${f.acc.mk>=0?'+':''}${Math.round(f.acc.mk*100)}% for them`:''}</div></div>
      <div class="num" style="color:var(--accent)">${f1(f.gA)}</div></div></div>` };
    const ww=F.filter(f=>f.gB>=0), lo=F.filter(f=>f.gB<0);
    h+=`<h2>Win-win <span class="pill">both lineups improve</span></h2>`+(ww.length?ww.map(f=>card(f,F.indexOf(f))).join(''):`<div class="card"><div class="note" style="margin:0">None found${TS.need?' for '+TS.need:''}.</div></div>`);
    h+=`<h2>Better for you <span class="pill">they lose a little</span></h2>`+(lo.length?lo.map(f=>card(f,F.indexOf(f))).join(''):`<div class="card"><div class="note" style="margin:0">None.</div></div>`);
    h+=`<div class="note">Tap a deal to open it in Mock trade. Searched ${F.searched} combinations in ${F.ms} ms.</div>` }
  return h }

function tlSearch(){ const t0=Date.now(); const lg=TL.league(); const cands=[]; let searched=0;
  const myC=R[ME].filter(n=>byName[n]&&!['K','DST'].includes(byName[n].p)).sort((a,b)=>TL.rosTot(b)-TL.rosTot(a)).slice(0,14);
  for(const t of lg.teams){ if(t===ME) continue; const thC=R[t].filter(n=>byName[n]&&!['K','DST'].includes(byName[n].p)&&!['IR','PUP','O','SUSP'].includes(W.status[n])).sort((a,b)=>TL.rosTot(b)-TL.rosTot(a)).slice(0,12);
    const ok=get=>!TS.need||get.some(n=>byName[n].p===TS.need);
    const tryT=(give,get)=>{ if(!ok(get)) return; searched++; const r=TL.quick(ME,t,give,get); if(r.gA>.3&&r.gB>-1.2) cands.push({t,give,get,gA:r.gA,gB:r.gB}) };
    for(const a of myC) for(const x of thC) tryT([a],[x]);
    for(let i=0;i<myC.length;i++) for(let j=i+1;j<myC.length;j++) for(const x of thC) tryT([myC[i],myC[j]],[x]);
    for(const a of myC) for(let i=0;i<thC.length;i++) for(let j=i+1;j<thC.length;j++) tryT([a],[thC[i],thC[j]]) }
  const score=c=>c.gB>=0?c.gA+c.gB-TLK.winwinPenalty*Math.abs(c.gA-c.gB):c.gA+2*c.gB;
  cands.sort((a,b)=>score(b)-score(a));
  const exact=[]; for(const c of cands.slice(0,36)){ const r=TL.evalTrade(ME,c.t,c.give,c.get,true); if(r.gA>.3&&r.gB>-1.2) exact.push(Object.assign(c,{gA:r.gA,gB:r.gB,acc:tlAccept(r,c.give,c.get)})) }
  exact.sort((a,b)=>score(b)-score(a));
  const seen=new Set(), per={}; const out=exact.filter(c=>{ const k=c.t+'|'+c.get.slice().sort().join('+'); if(seen.has(k)) return false; seen.add(k); per[c.t]=(per[c.t]||0)+1; return per[c.t]<=2 }).slice(0,12);
  out.searched=searched; out.ms=Date.now()-t0; return out }

function tlBuy(){ const U=TL.USE; const mine=new Set(R[ME]); const rows=[];
  for(const t in R) for(const n of R[t]){ const u=U[n], p=byName[n]; if(!u||!p||u.xppg==null||u.gp<2) continue; rows.push({n,p,t,u}) }
  const sell=rows.filter(x=>mine.has(x.n)&&x.u.luck>=2.5).sort((a,b)=>b.u.luck-a.u.luck).slice(0,6);
  const buy=rows.filter(x=>!mine.has(x.n)&&x.u.luck<=-2.5&&((x.u.snap||0)>=55||(x.u.tshare||0)>=.17||(x.u.capg||0)>=10)).sort((a,b)=>a.u.luck-b.u.luck).slice(0,8);
  const line=x=>{ const fc=TL.FCV[x.n]; return `<div class="row" data-tx="quick" data-k="${esc(x.n)}">${chipNm(x.p)}<div class="sub">${mine.has(x.n)?'yours':'on '+esc(tlShort(x.t))} · ${x.u.ppg.toFixed(1)} actual vs ${x.u.xppg.toFixed(1)} expected · ${x.u.td} TD in ${x.u.gp}${x.u.snap!=null?' · snaps '+x.u.snap+'%':''}${x.u.tshare?' · tgt '+Math.round(x.u.tshare*100)+'%':''}${fc?` · mkt 30d ${fc[1]>=0?'+':''}${fc[1]}`:''}</div></span><span class="num ${x.u.luck>=0?'pos':'neg'}">${f1(x.u.luck)}</span></div>` };
  let h=`<h2>Sell high <span class="pill">yours, scoring above usage</span></h2><div class="card">${sell.length?sell.map(line).join(''):'<div class="note" style="margin:0">Nobody on your roster is running 2.5+ points a game above his usage.</div>'}</div>
  <h2>Buy low <span class="pill">others, usage above scoring</span></h2><div class="card">${buy.length?buy.map(line).join(''):'<div class="note" style="margin:0">No one fits yet.</div>'}</div>
  <div class="note">Right-hand number = actual points per game minus expected points from usage (targets, air yards, carries, pass attempts, priced at this season's league-wide rates in your scoring). Touchdown rate barely carries forward, usage does — so a big plus is a sell signal and a big minus with steady snaps is a buy. ${rows.length} rostered players with 2+ games. Three games is a small sample: treat this as a list to check, not a verdict. Tap a player to start a trade for him.</div>`;
  const mv=Object.entries(TL.FCV).filter(([n])=>owner[n]).sort((a,b)=>b[1][1]-a[1][1]);
  if(mv.length){ const up=mv.slice(0,5), dn=mv.slice(-5).reverse(); const r=([n,v])=>`<div class="row" data-tx="quick" data-k="${esc(n)}">${chipNm(byName[n])}<div class="sub">${owner[n]===ME?'yours':'on '+esc(tlShort(owner[n]))} · value ${v[0]}</div></span><span class="num ${v[1]>=0?'pos':'neg'}">${v[1]>=0?'+':''}${v[1]}</span></div>`;
    h+=`<h2>Market movers <span class="pill">30-day trade value</span></h2><div class="card"><div class="sub" style="margin-bottom:2px">RISING</div>${up.map(r).join('')}<div class="sub" style="margin:10px 0 2px">FALLING</div>${dn.map(r).join('')}</div>` }
  return h }

function renderTradeX(){ const el=document.getElementById('v-trade');
  if(!R[ME]||!R[ME].length){ el.innerHTML=`<h2>Trade lab</h2><div class="card">Load your roster first.</div>`; return }
  const subs=[['team','My team'],['league','League'],['mock','Mock trade'],['find','Finder'],['buy','Buy / sell']];
  const TD=TL.TD; const fresh=TD.at?`nflverse wk ${(TD.weeks||[]).join(',')} · market ${TD.fc?(TD.fc.partial?'top '+TD.fc.n:TD.fc.n+' players')+' '+String(TD.fc.at).slice(5,10):'none'} · built ${String(TD.at).slice(5,10)}`:'no trade data file yet — projections only';
  let h=`<h2>Trade lab</h2><div class="chiprow">${subs.map(([k,l])=>`<button class="btn ${TS.sub===k?'on':''}" data-tx="sub" data-k="${k}">${l}</button>`).join('')}</div><div class="sub" style="margin:-4px 0 8px">${fresh}</div>`;
  try{ h+=TS.sub==='league'?tlLeague():TS.sub==='mock'?tlMock():TS.sub==='find'?tlFind():TS.sub==='buy'?tlBuy():tlTeam() }catch(e){ h+=`<div class="card"><div class="note neg" style="margin:0">Trade lab error: ${esc(e.message)}</div></div>`; console.error(e) }
  el.innerHTML=h;
  const q=document.getElementById('tl-q'); if(q) q.addEventListener('input',e=>{ TS.q=e.target.value; const qq=TS.q.trim().toLowerCase(); const out=document.getElementById('tl-qr'); if(!qq){out.innerHTML='';return}
    out.innerHTML=`<div class="card" style="padding:2px 8px;margin-top:6px">`+P.filter(p=>owner[p.n]&&p.n.toLowerCase().includes(qq)).slice(0,8).map(p=>tlRow(p,{owner:true,attr:`data-tx="any" data-k="${esc(p.n)}"`})).join('')+`</div>` });
  if(!el.dataset.tl){ el.dataset.tl='1'; el.addEventListener('click',tlClick) } }

function tlClick(e){ const x=e.target.closest('[data-tx]'); if(!x) return; e.stopPropagation(); const a=x.dataset.tx, k=x.dataset.k, s=x.dataset.s;
  const sub=v=>{ TS.sub=v; try{localStorage.setItem('seasonhq2026:tradesub',v)}catch(er){} };
  if(a==='sub'){ sub(k); return renderTradeX() }
  if(a==='partner'){ if(k!==TS.partner){ TS.partner=k; TS.get=[] } TS.side='get'; return renderTradeX() }
  if(a==='side'){ TS.side=k; return renderTradeX() }
  if(a==='pick'){ const arr=TS[s]; const i=arr.indexOf(k); i>-1?arr.splice(i,1):arr.push(k); return renderTradeX() }
  if(a==='clear'){ TS.give=[]; TS.get=[]; return renderTradeX() }
  if(a==='counter'){ (TS[s]).push(k); return renderTradeX() }
  if(a==='need'){ TS.need=k; TS.found=null; sub('find'); if(s==='go'){ TS.found=tlSearch() } return renderTradeX() }
  if(a==='find'){ const b=x; b.textContent='Searching…'; setTimeout(()=>{ TS.found=tlSearch(); renderTradeX() },30); return }
  if(a==='load'){ const f=TS.found[+k]; TS.partner=f.t; TS.give=f.give.slice(); TS.get=f.get.slice(); sub('mock'); renderTradeX(); return window.scrollTo(0,0) }
  if(a==='team'){ TS.team=TS.team===k?null:k; return renderTradeX() }
  if(a==='trade-with'){ TS.partner=k; TS.get=[]; TS.give=[]; TS.side='get'; sub('mock'); renderTradeX(); return window.scrollTo(0,0) }
  if(a==='any'||a==='quick'){ const t=owner[k]; if(!t) return; if(t===ME){ if(!TS.give.includes(k)) TS.give.push(k); TS.side='get' } else { if(t!==TS.partner){ TS.partner=t; TS.get=[] } if(!TS.get.includes(k)) TS.get.push(k); TS.side='give' } TS.q=''; sub('mock'); renderTradeX(); return window.scrollTo(0,0) } }
/* ===================== END TRADE LAB ===================== */

/* ---------- rosters editor ---------- */
let RQ='',RT=null,CQ='';
function renderRosters(){ const el=document.getElementById('v-rosters'); const teams=Object.keys(R);
  let h=`<h2>Rosters <span class="pill">tap a team, then tap players to add</span></h2><div class="card"><div style="display:flex;gap:6px;flex-wrap:wrap">`+teams.map(t=>`<button class="btn ${RT===t?'on':''}" data-team="${esc(t)}">${esc(t)}${OWN[t]?' · '+esc(OWN[t]):''} (${R[t].length})${t===ME?' ★':''}</button>`).join('')+`<button class="btn" data-act="addteam">+ team</button></div><div class="sub" style="margin-top:6px">Your team: <b>${esc(ME)}</b>${R[ME]?' · '+R[ME].length+' players':' — not found in this file'}${MESET?' (set by hand)':''}. Everything marked "yours" follows this.</div>
  ${RT?`<div style="display:flex;gap:6px;margin-top:8px"><button class="btn" data-act="rename">Rename</button><button class="btn" data-act="setme">Mark as mine</button><button class="btn" data-act="owner">Owner</button><button class="btn r" data-act="delteam">Remove team</button></div>`:''}</div>`;
  if(RT){ h+=`<h2>${esc(RT)}</h2><div class="card">`+(R[RT].map(n=>byName[n]).filter(Boolean).sort((a,b)=>POS.indexOf(a.p)-POS.indexOf(b.p)||a.r-b.r).map(p=>`<div class="row">${chipNm(p)}<div class="sub">${p.t} · B${p.bye}</div></span><button class="btn r" data-rm="${esc(p.n)}">✕</button></div>`).join('')||'<div class="note">Empty.</div>')+`</div>
    <input type="search" id="r-search" placeholder="Add a player…" autocomplete="off" value="${esc(RQ)}"><div class="card" id="r-results" style="margin-top:6px">`+(RQ?P.filter(p=>p.n.toLowerCase().includes(RQ.toLowerCase())).slice(0,10).map(p=>`<div class="row">${chipNm(p)}<div class="sub">${p.t} · ${owner[p.n]?'on '+esc(owner[p.n]):'free agent'}</div></span><button class="btn g" data-add="${esc(p.n)}">+</button></div>`).join(''):'')+`</div>` }
  const convList=Object.keys(CONV).filter(n=>CONV[n]&&byName[n]).sort((a,b)=>CONV[b]-CONV[a]);
  h+=`<h2>My guys — your read on a player</h2><div class="card"><div class="note" style="margin:0 0 6px">+1 treats him like 6 spots better at his position, +2 like 12. −1/−2 the reverse. Moves the projection lens only — your lineup, waiver and trade <i>decisions</i> use it; the market number stays honest.</div>
    <input type="search" id="c-search" placeholder="Player to mark…" autocomplete="off" value="${esc(CQ)}"><div id="c-results">${CQ?P.filter(p=>p.n.toLowerCase().includes(CQ.toLowerCase())).slice(0,6).map(p=>`<div class="row">${chipNm(p)}<div class="sub">${p.t} · ${p.p}${p.pr}</div></span>${[-2,-1,1,2].map(v=>`<button class="btn ${CONV[p.n]===v?'on':''}" data-conv="${esc(p.n)}" data-v="${v}" style="min-width:36px;padding:7px 6px">${v>0?'+':''}${v}</button>`).join('')}</div>`).join(''):''}</div>
    ${convList.length?`<div style="margin-top:6px">${convList.map(n=>{const p=byName[n]; return `<div class="row"><span class="chip" style="background:${PC[p.p]}">${p.p}</span><span class="nm">${esc(n)}${MARK('',n)}<div class="sub">now valued like ${p.p}${convPr(p)} (was ${p.p}${p.pr})</div></span><button class="btn r" data-conv="${esc(n)}" data-v="0">✕</button></div>`}).join('')}</div>`:''}</div>`;
  const rsjRank=p=>P.filter(q=>q.p===p.p&&q.rsj!=null).sort((a,b)=>b.rsj-a.rsj).findIndex(q=>q.n===p.n)+1;
  const div=P.filter(p=>p.rsj!=null&&['QB','RB','WR','TE'].includes(p.p)).map(p=>({p,gap:p.pr-rsjRank(p),mr:rsjRank(p)})).filter(x=>Math.abs(x.gap)>=8).sort((a,b)=>b.gap-a.gap);
  h+=`<h2>Hidden value — where the trade market and the projections disagree</h2><div class="card"><div class="note" style="margin:0 0 6px">Trade market (RSJ) rank vs. the projection blend. A big positive gap means people are already paying more for him than the rankings justify — buy before the rankings catch up, or sell into it.</div>${div.slice(0,10).map(x=>`<div class="row">${chipNm(x.p)}${MARK(x.p.risk,x.p.n)}<div class="sub">${owner[x.p.n]?'on '+esc(owner[x.p.n]):'free agent'} · projections ${x.p.p}${x.p.pr} · market ${x.p.p}${x.mr}</div></span><span class="num pos">+${x.gap}</span></div>`).join('')}</div>
  <div class="card" style="margin-top:6px"><div class="sub" style="margin-bottom:4px">Market is OUT on these (projections higher than the trade market)</div>${div.slice(-6).reverse().map(x=>`<div class="row">${chipNm(x.p)}<div class="sub">${owner[x.p.n]?'on '+esc(owner[x.p.n]):'free agent'} · projections ${x.p.p}${x.p.pr} · market ${x.p.p}${x.mr}</div></span><span class="num neg">${x.gap}</span></div>`).join('')}</div>`;
  h+=`<div class="note" style="margin-top:12px">Edits save on this phone. <button class="btn" data-act="resetR">Reset to file</button></div>`; el.innerHTML=h;
  const cs=document.getElementById('c-search'); if(cs){cs.addEventListener('input',e=>{CQ=e.target.value; renderRosters(); const n=document.getElementById('c-search'); n.focus(); n.setSelectionRange(CQ.length,CQ.length)})}
  const s=document.getElementById('r-search'); if(s){s.addEventListener('input',e=>{RQ=e.target.value; renderRosters(); const n=document.getElementById('r-search'); n.focus(); n.setSelectionRange(RQ.length,RQ.length)})} }

/* ---------- events ---------- */
/* ---- freshness strip: is this week actually loaded? ---- */
function renderFresh(){ const el=document.getElementById('fresh'); const wk=String(DATA.week);
  const graded=Object.keys(DATA.actuals||{}).map(Number).sort((a,b)=>a-b);
  const cov={}; DATA.players.forEach(p=>{ for(const k in (p.wk||{})) cov[k]=(cov[k]||0)+1 });
  const srcs=Object.keys(cov).sort((a,b)=>cov[b]-cov[a]);
  const frozen=!!(DATA.ledger||{})[wk]; const sched=!!(DATA.schedule||{})[wk];
  const state=!srcs.length?'bad':(!frozen||!sched)?'warn':'';
  el.innerHTML=`<details><summary class="fresh"><span class="dot ${state}"></span>
      <span style="flex:1;min-width:0"><b>Week ${wk}</b> &middot; ${frozen?'frozen':'not frozen'} &middot; ${srcs.length} source${srcs.length===1?'':'s'}${sched?'':' &middot; no schedule'}</span>
      <span class="caret">&#9662;</span></summary>
    <div class="freshmore">file <b>${esc(DATA.version)}</b> &middot; pool ${DATA.players.length} players<br>
      sources ${srcs.length?srcs.map(k=>k+' '+cov[k]).join(' &middot; '):'none loaded'}<br>
      graded ${graded.length?'week '+graded.join(', '):'nothing yet'}${(DATA.model&&DATA.model.benched&&DATA.model.benched.length)?' &middot; benched '+DATA.model.benched.join(', '):''}<br>
      opponent set ${Object.keys(DATA.oppSet||{}).includes(wk)?'in':'not in yet'} &middot; your set ${Object.keys(DATA.mySet||{}).includes(wk)?'in':'not in yet'}</div></details>`;
}
function renderMore(){ document.getElementById('v-more').innerHTML=`<h2>More</h2>
  <button class="mitem" data-v="rosters"><div><div class="mt">Rosters</div><div class="ms">Every team in the league, searchable &mdash; who owns whom, and who is free.</div></div></button>
  <button class="mitem" data-v="brain"><div><div class="mt">Brain</div><div class="ms">The prediction ledger drawn out: predicted against actual, the source race, whether the matchup grades earn their keep, and the paper lineups.</div></div></button>
  <button class="mitem" data-v="draft"><div><div class="mt">Draft board</div><div class="ms">The preseason value board &mdash; a fallback now that weekly numbers are in.</div></div></button>`; }
let view='week';
const SUBOF={rosters:'more',brain:'more',draft:'more'};
const RENDER={week:renderWeek,draft:renderDraft,trade:renderTradeX,rank:renderRank,match:renderMatch,brain:renderBrain,rosters:renderRosters,more:renderMore};
const render=()=>{ document.querySelectorAll('main > section').forEach(s=>s.classList.toggle('hide',s.id!=='v-'+view));
  const tv=SUBOF[view]||view; document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===tv));
  RENDER[view]();
  if(SUBOF[view]){ const el=document.getElementById('v-'+view); const b=document.createElement('button'); b.className='back'; b.setAttribute('data-v','more'); b.innerHTML='&lsaquo; More'; el.insertBefore(b,el.firstChild) }
  window.scrollTo(0,0) };
document.addEventListener('click',e=>{ const b=e.target.closest('button'); const row=e.target.closest('[data-tr]');
  if(row){ const arr=T[row.dataset.tr]; const n=row.dataset.n; const i=arr.indexOf(n); i>-1?arr.splice(i,1):arr.push(n); return renderTrade() }
  const cardL=e.target.closest('[data-load]'); if(!b&&cardL&&FOUND){const f=FOUND[+cardL.dataset.load]; T={partner:f.t,give:f.give.slice(),get:f.get.slice()}; return renderTrade()}
  if(!b)return; const d=b.dataset;
  if(d.v){view=d.v; return render()} if(d.rkpos){RKPOS=d.rkpos; return renderRank()} if(d.rkmode){RKMODE=d.rkmode; return renderRank()} if(d.mpos){MPOS=d.mpos; return renderMatch()} if(d.act==='copyledger'){const t=document.getElementById('ledger-out'); t.select(); try{document.execCommand('copy')}catch(e){} return} if(d.team){RT=d.team; return renderRosters()}
  if(d.add){ if(RT&&!R[RT].includes(d.add)){ for(const t in R)R[t]=R[t].filter(x=>x!==d.add); R[RT].push(d.add); reindex(); saveR() } return renderRosters() }
  if(d.rm){ R[RT]=R[RT].filter(x=>x!==d.rm); reindex(); saveR(); return renderRosters() }
  if(d.conv!==undefined){ const v=+d.v; if(v)CONV[d.conv]=v; else delete CONV[d.conv]; saveConv(); recompute(); recomputeTV(); return renderRosters() }
  if(d.act==='addteam'){const n=prompt('Team name'); if(n&&!R[n]){R[n]=[]; RT=n; saveR()} return renderRosters()}
  if(d.act==='rename'){const n=prompt('New name',RT); if(n&&n!==RT&&!R[n]){R[n]=R[RT]; delete R[RT]; if(OWN[RT]){OWN[n]=OWN[RT]; delete OWN[RT]} if(ME===RT){ME=n; MESET=true} RT=n; reindex(); saveR()} return renderRosters()}
  if(d.act==='owner'){const n=prompt('Owner name for '+RT,OWN[RT]||''); if(n!=null){OWN[RT]=n; saveR()} return renderRosters()}
  if(d.act==='setme'){ME=RT; MESET=true; saveR(); return renderRosters()}
  if(d.act==='delteam'&&confirm('Remove '+RT+'?')){delete R[RT]; RT=null; reindex(); saveR(); return renderRosters()}
  if(d.act==='resetR'&&confirm('Discard your local roster edits?')){R=JSON.parse(JSON.stringify(DATA.rosters)); OWN=JSON.parse(JSON.stringify(DATA.owners||{})); ME=resolveME(R,OWN); MESET=false; reindex(); try{localStorage.removeItem(KEY)}catch(e){} return renderRosters()}
  if(d.act==='t-clear'){T={partner:T.partner,give:[],get:[]}; return renderTrade()}
  if(d.act==='t-swap'){T={partner:T.partner,give:T.get.slice(),get:T.give.slice()}; return renderTrade()}
  if(d.act==='find'){FOUND=findTrades(); return renderTrade()}
  const card=e.target.closest('[data-load]'); if(card){const f=FOUND[+card.dataset.load]; T={partner:f.t,give:f.give.slice(),get:f.get.slice()}; return renderTrade()} });
document.addEventListener('change',e=>{ if(e.target.id==='t-partner'){T.partner=e.target.value||null; T.get=[]; renderTrade()} if(e.target.id==='w-opp'){OPP[W.week]=e.target.value; try{localStorage.setItem('seasonhq2026:opp',JSON.stringify(OPP))}catch(x){} renderWeek()} if(e.target.id==='t-need'){NEED=e.target.value; FOUND=findTrades(); renderTrade()} });
renderFresh(); render();
</script>
